<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="32 Drive" />
  <title>32 Drive - Cassino & Rio Grande</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230f172a'/%3E%3Ctext x='50%25' y='48%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='900' font-size='210' fill='%23ffffff'%3E32%3C/text%3E%3Ctext x='50%25' y='73%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='54' letter-spacing='6' fill='%23ffffff'%3EDRIVE%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230f172a'/%3E%3Ctext x='50%25' y='48%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='900' font-size='210' fill='%23ffffff'%3E32%3C/text%3E%3Ctext x='50%25' y='73%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='54' letter-spacing='6' fill='%23ffffff'%3EDRIVE%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #ffffff; color: #0f172a; padding: 16px; max-width: 580px; margin: 0 auto; font-size: 17px; }
    .card { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
    .badge { background: #0f172a; color: #ffffff; font-weight: 800; padding: 8px 14px; border-radius: 999px; font-size: 15px; }
    .pill { background: #e2e8f0; color: #0f172a; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
    #map { width: 100%; height: 220px; border-radius: 12px; border: 2px solid #cbd5e1; margin-bottom: 14px; }
    label { display: block; font-size: 16px; color: #0f172a; margin-bottom: 6px; font-weight: 800; }
    input { width: 100%; background: #ffffff; border: 2px solid #94a3b8; color: #0f172a; padding: 13px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 18px; font-weight: 600; }
    input:focus { outline: none; border-color: #0f172a; }
    button { width: 100%; border: none; border-radius: 12px; padding: 15px; font-size: 18px; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
    button:last-child { margin-bottom: 0; }
    .btn-blue { background: #0f172a; color: #ffffff; }
    .btn-calc { background: #0284c7; color: #ffffff; }
    .btn-green { background: #15803d; color: #ffffff; }
    .btn-waze { background: #0ea5e9; color: #ffffff; }
    .btn-dark { background: #334155; color: #ffffff; }
    .resumo { background: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .resumo div { margin-bottom: 8px; font-size: 18px; color: #1e293b; font-weight: 600; }
    .resumo strong { color: #0f172a; font-size: 19px; }
    .total { font-size: 24px !important; font-weight: 900; color: #15803d !important; }
    .pix-box { background: #ffffff; border: 2px dashed #0f172a; border-radius: 12px; padding: 14px; margin-top: 12px; }
    .pix-box strong { font-size: 17px; color: #0f172a; }
    .pix-key { font-family: monospace; font-size: 16px; font-weight: 700; word-break: break-all; background: #f1f5f9; padding: 10px; border-radius: 10px; margin: 10px 0; color: #0f172a; border: 1px solid #cbd5e1; }
    .msg { font-size: 16px; font-weight: 700; color: #0284c7; margin-top: 8px; min-height: 22px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="badge">32 DRIVE • Cassino & Rio Grande</span>
      <span class="pill" id="gpsStatus">Pronto</span>
    </div>

    <div id="map"></div>

    <label for="pName">Nome do passageiro</label>
    <input id="pName" type="text" placeholder="Ex.: João Silva" />

    <label for="pPhone">Telefone do passageiro</label>
    <input id="pPhone" type="tel" placeholder="Ex.: 53 99999-9999" />

    <label for="pickup">Origem (endereço, bairro ou referência)</label>
    <input id="pickup" type="text" placeholder="Ex.: Cassino ou Av. Rio Grande" oninput="limparGpsSeEditar()" />

    <label for="dropoff">Destino (endereço, bairro ou referência)</label>
    <input id="dropoff" type="text" placeholder="Ex.: Supermercado Guanabara Cassino ou FURG" />

    <button type="button" class="btn-blue" onclick="usarGPS()">Usar meu GPS</button>
    <button type="button" class="btn-calc" onclick="calcularCorrida()">Calcular corrida</button>

    <div class="resumo">
      <div>Distância aprox.: <strong id="distVal">0,00 km</strong></div>
      <div>Faixa: <strong id="faixaVal">Até 3,5 km (R$ 7,99)</strong></div>
      <div class="total">Valor: <span id="valorVal">R$ 7,99</span></div>
    </div>

    <button type="button" class="btn-green" id="btnWhats" onclick="enviarWhatsMotorista()">
      Enviar corrida no WhatsApp do motorista
    </button>

    <button type="button" class="btn-waze" id="btnWaze" onclick="abrirWaze()">
      Abrir rota no Waze
    </button>

    <div class="pix-box">
      <strong>Chave Pix (Banco Inter - Aleatória)</strong>
      <div class="pix-key" id="pixTexto">45bd89b5-9dd7-4cda-8715-789257d06596</div>
      <button type="button" class="btn-dark" onclick="copiarPix()">Copiar chave Pix</button>
      <div class="msg" id="feedbackMsg"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CHAVE_PIX_INTER = "45bd89b5-9dd7-4cda-8715-789257d06596";
    const WHATS_MOTORISTA = "5553991357231";

    document.getElementById("pixTexto").textContent = CHAVE_PIX_INTER;

    const map = L.map("map").setView([-32.1830, -52.1640], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let marcadorOrigem = null;
    let marcadorDestino = null;
    let linhaRota = null;
    let distanciaAtual = 0;
    let valorAtual = 7.99;
    let coordsOrigem = null;

    const PONTOS_REAIS = [
      // Cassino
      { chaves: ["guanabara", "supermercado", "mercado"], lat: -32.1852, lon: -52.1654, zona: "cassino", nome: "Supermercado Guanabara (Cassino)" },
      { chaves: ["peruzzo"], lat: -32.1818, lon: -52.1628, zona: "cassino", nome: "Peruzzo (Cassino)" },
      { chaves: ["terminal cassino", "terminal"], lat: -32.1805, lon: -52.1670, zona: "cassino", nome: "Terminal Cassino" },
      { chaves: ["beira mar", "beira-mar", "praia", "iemanja", "iemanjá", "molhes"], lat: -32.1885, lon: -52.1585, zona: "cassino", nome: "Beira-Mar Cassino" },
      { chaves: ["querencia", "querência"], lat: -32.1660, lon: -52.1690, zona: "cassino", nome: "Querência (Cassino)" },
      { chaves: ["bolaxa"], lat: -32.1520, lon: -52.1720, zona: "cassino", nome: "Bolaxa" },
      { chaves: ["av rio grande", "av. rio grande", "avenida rio grande"], lat: -32.1830, lon: -52.1640, zona: "cassino", nome: "Av. Rio Grande (Cassino)" },
      { chaves: ["cassino", "balneario", "balneário"], lat: -32.1800, lon: -52.1660, zona: "cassino", nome: "Balneário Cassino" },

      // Rio Grande
      { chaves: ["furg", "pavilhao", "pavilhão", "carreiros", "universidade"], lat: -32.0736, lon: -52.1670, zona: "rg", nome: "FURG Carreiros" },
      { chaves: ["unicir", "vila unicir"], lat: -32.0650, lon: -52.1380, zona: "rg", nome: "Vila Unicir" },
      { chaves: ["parque marinha", "marinha"], lat: -32.0750, lon: -52.1420, zona: "rg", nome: "Parque Marinha" },
      { chaves: ["cidade nova"], lat: -32.0540, lon: -52.1180, zona: "rg", nome: "Cidade Nova" },
      { chaves: ["laranjeiras"], lat: -32.0880, lon: -52.1490, zona: "rg", nome: "Laranjeiras" },
      { chaves: ["getulio", "getúlio", "bgv"], lat: -32.0510, lon: -52.1090, zona: "rg", nome: "Getúlio Vargas" },
      { chaves: ["santa rosa"], lat: -32.0480, lon: -52.1250, zona: "rg", nome: "Santa Rosa" },
      { chaves: ["trevo"], lat: -32.0720, lon: -52.1480, zona: "rg", nome: "Trevo Rio Grande" },
      { chaves: ["quinta"], lat: -32.0050, lon: -52.2350, zona: "rg", nome: "Vila da Quinta" },
      { chaves: ["centro", "silva paes", "marechal floriano", "alfandega", "alfândega", "praca", "praça"], lat: -32.0352, lon: -52.0986, zona: "rg", nome: "Centro Rio Grande" }
    ];

    function setMsg(texto) {
      document.getElementById("feedbackMsg").textContent = texto;
    }

    function limparGpsSeEditar() {
      const val = document.getElementById("pickup").value;
      if (!val.startsWith("GPS (")) {
        coordsOrigem = null;
      }
    }

    function calcularTarifa(km) {
      const limpo = Math.max(0, Number(km) || 0);
      let base = limpo <= 3.5 ? 7.99 : limpo * 2.0;
      const hora = new Date().getHours();
      const noturno = hora >= 20 || hora < 6;
      if (noturno) {
        base = base * 1.25;
      }
      return {
        km: limpo,
        valor: Number(base.toFixed(2)),
        faixa: limpo <= 3.5
          ? (noturno ? "Até 3,5 km + Noturno 25%" : "Até 3,5 km (R$ 7,99)")
          : (noturno ? "Acima de 3,5 km (R$ 2/km) + Noturno 25%" : "Acima de 3,5 km (R$ 2/km)")
      };
    }

    function atualizarTela() {
      const calc = calcularTarifa(distanciaAtual);
      distanciaAtual = calc.km;
      valorAtual = calc.valor;
      document.getElementById("distVal").textContent = calc.km.toFixed(2).replace(".", ",") + " km";
      document.getElementById("faixaVal").textContent = calc.faixa;
      document.getElementById("valorVal").textContent = "R$ " + calc.valor.toFixed(2).replace(".", ",");
    }

    function distanciaLinhaRetaKm(a, b) {
      const R = 6371;
      const dLat = ((b.lat - a.lat) * Math.PI) / 180;
      const dLon = ((b.lon - a.lon) * Math.PI) / 180;
      const lat1 = (a.lat * Math.PI) / 180;
      const lat2 = (b.lat * Math.PI) / 180;
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function removerAcentos(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function resolverEndereco(texto) {
      const limpo = (texto || "").trim();
      const matchGps = limpo.match(/GPS\s*\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/i);
      if (matchGps) {
        const lat = parseFloat(matchGps[1]);
        const lon = parseFloat(matchGps[2]);
        return { lat, lon, zona: lat < -32.12 ? "cassino" : "rg", nome: "Meu GPS" };
      }

      const norm = removerAcentos(limpo);

      for (const ponto of PONTOS_REAIS) {
        if (ponto.chaves.some(k => norm.includes(removerAcentos(k)))) {
          return { lat: ponto.lat, lon: ponto.lon, zona: ponto.zona, nome: ponto.nome };
        }
      }

      if (norm.includes("rio grande") && !norm.includes("av") && !norm.includes("cassino")) {
        return { lat: -32.0352, lon: -52.0986, zona: "rg", nome: "Rio Grande" };
      }

      let hash = 0;
      for (let i = 0; i < norm.length; i++) {
        hash = (hash * 31 + norm.charCodeAt(i)) % 997;
      }
      const dLat = ((hash % 20) - 10) * 0.0005;
      const dLon = ((Math.floor(hash / 20) % 20) - 10) * 0.0005;
      return {
        lat: Number((-32.1825 + dLat).toFixed(5)),
        lon: Number((-52.1645 + dLon).toFixed(5)),
        zona: "cassino",
        nome: limpo
      };
    }

    function calcularCorrida() {
      const origemTexto = document.getElementById("pickup").value.trim();
      const destinoTexto = document.getElementById("dropoff").value.trim();

      if (!origemTexto || !destinoTexto) {
        setMsg("Preencha origem e destino antes de apertar Calcular corrida.");
        return;
      }

      const pOrigem = coordsOrigem ? { ...coordsOrigem, zona: coordsOrigem.lat < -32.12 ? "cassino" : "rg", nome: "Meu GPS" } : resolverEndereco(origemTexto);
      const pDestino = resolverEndereco(destinoTexto);

      if (marcadorOrigem) map.removeLayer(marcadorOrigem);
      if (marcadorDestino) map.removeLayer(marcadorDestino);
      if (linhaRota) map.removeLayer(linhaRota);

      marcadorOrigem = L.marker([pOrigem.lat, pOrigem.lon]).addTo(map).bindPopup(`Origem: ${pOrigem.nome}`);
      marcadorDestino = L.marker([pDestino.lat, pDestino.lon]).addTo(map).bindPopup(`Destino: ${pDestino.nome}`);

      linhaRota = L.polyline(
        [[pOrigem.lat, pOrigem.lon], [pDestino.lat, pDestino.lon]],
        { color: "#0f172a", weight: 5, dashArray: "8, 6" }
      ).addTo(map);

      map.fitBounds(linhaRota.getBounds(), { padding: [35, 35] });

      const retaKm = distanciaLinhaRetaKm(pOrigem, pDestino);
      let kmFinal = retaKm * 1.20;

      if (kmFinal < 0.8) {
        kmFinal = 1.0;
      }

      distanciaAtual = Number(kmFinal.toFixed(2));
      atualizarTela();
      setMsg(`Rota: ${pOrigem.nome} → ${pDestino.nome} (${distanciaAtual.toFixed(2).replace(".", ",")} km)`);
    }

    function usarGPS() {
      if (!navigator.geolocation) {
        setMsg("GPS não disponível neste aparelho.");
        return;
      }
      document.getElementById("gpsStatus").textContent = "Buscando GPS...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          coordsOrigem = { lat: latitude, lon: longitude };
          document.getElementById("gpsStatus").textContent = "GPS ativo";
          document.getElementById("pickup").value = `GPS (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`;
          map.setView([latitude, longitude], 14);
          setMsg("GPS capturado! Agora digite o destino e toque em Calcular corrida.");
        },
        () => {
          document.getElementById("gpsStatus").textContent = "GPS manual";
          setMsg("GPS indisponível. Digite origem e destino e toque em Calcular corrida.");
        }
      );
    }

    function enviarWhatsMotorista() {
      const nome = document.getElementById("pName").value.trim() || "Não informado";
      const tel = document.getElementById("pPhone").value.trim() || "Não informado";
      const origem = document.getElementById("pickup").value.trim() || "Não informado";
      const destino = document.getElementById("dropoff").value.trim() || "Não informado";
      const valorFmt = "R$ " + valorAtual.toFixed(2).replace(".", ",");
      const distFmt = distanciaAtual.toFixed(2).replace(".", ",") + " km";

      const texto = [
        "*NOVA CORRIDA - 32 DRIVE*",
        `Passageiro: ${nome}`,
        `Telefone: ${tel}`,
        `Origem: ${origem}`,
        `Destino: ${destino}`,
        `Distância aprox.: ${distFmt}`,
        `Valor: ${valorFmt}`,
        `Pix Inter: ${CHAVE_PIX_INTER}`
      ].join("\n");

      const url = `https://wa.me/${WHATS_MOTORISTA}?text=${encodeURIComponent(texto)}`;
      window.location.href = url;
    }

    function abrirWaze() {
      const destino = document.getElementById("dropoff").value.trim();
      const alvo = destino || "Cassino, Rio Grande - RS";
      const urlWaze = `https://waze.com/ul?q=${encodeURIComponent(alvo)}&navigate=yes`;
      window.location.href = urlWaze;
    }

    async function copiarPix() {
      const chave = CHAVE_PIX_INTER.trim();
      try {
        await navigator.clipboard.writeText(chave);
        setMsg("Chave Pix do Banco Inter copiada!");
      } catch (e) {
        const temp = document.createElement("textarea");
        temp.value = chave;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        setMsg("Chave Pix copiada para a área de transferência.");
      }
    }

    atualizarTela();
  </script>
</body>
</html>
