<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Drive • Painel Motorista</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b192c;
      --card: #ffffff;
      --navy: #0b192c;
      --navy-2: #13294b;
      --accent: #f59e0b;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --green: #059669;
      --red: #dc2626;
      --blue: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.5;
    }

    .topbar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      border-bottom: 3px solid var(--accent);
      padding: 14px 18px;
      color: #ffffff;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .badge-32 {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--navy);
      font-weight: 900;
      font-size: 20px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand h1 { font-size: 20px; font-weight: 900; color: var(--accent); }
    .brand p { font-size: 14px; color: #cbd5e1; }

    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      grid-template-columns: 1.05fr 1.15fr;
      gap: 14px;
      flex: 1;
    }

    @media (max-width: 960px) {
      .container { grid-template-columns: 1fr; }
    }

    .col { display: flex; flex-direction: column; gap: 14px; }

    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    }

    .card-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 11px 13px;
      border-radius: 9px;
      border: 1.5px solid #94a3b8;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      background: #ffffff;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    @media (max-width: 520px) {
      .row-2 { grid-template-columns: 1fr; }
    }

    #mapa-motorista {
      width: 100%;
      height: 250px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #e2e8f0;
      z-index: 1;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-sm { padding: 9px 13px; font-size: 15px; }
    .btn-accent { background: var(--accent); color: #0f172a; }
    .btn-green { background: var(--green); color: #ffffff; }
    .btn-red { background: var(--red); color: #ffffff; }
    .btn-blue { background: var(--blue); color: #ffffff; }
    .btn-outline { background: #e2e8f0; color: #0f172a; border: 1px solid #94a3b8; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }

    .resumo-box {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .resumo-box strong { color: var(--accent); }

    .lista-scroll {
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .corrida-box {
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 16px;
    }

    .corrida-box.ativa {
      border-color: var(--accent);
      background: #fffbeb;
    }

    .tag-status {
      font-size: 14px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #0f172a;
    }

    .tag-status.aguardando { background: #fef3c7; color: #92400e; }
    .tag-status.aceita { background: #d1fae5; color: #065f46; }
    .tag-status.recusada { background: #fee2e2; color: #991b1b; }

    .meta-small { font-size: 15px; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="badge-32">32</div>
      <div>
        <h1>32 DRIVE • MOTORISTA</h1>
        <p>Junior Costa • Balneário Cassino / Rio Grande</p>
      </div>
    </div>

      <button type="button" class="btn btn-accent btn-sm" id="btn-gps-motorista">Atualizar GPS</button>
      <span class="meta-small" id="status-firebase-mot" style="color:#fde68a;">Iniciando...</span>
    </div>
  </header>

        <div class="meta-small" id="coords-motorista">Localização: Balneário Cassino, Rio Grande - RS</div>

            <input id="mot-nome" type="text" value="Junior Costa" />
          </div>

            <label for="mot-veiculo">Veículo / Placa</label>
            <input id="mot-veiculo" type="text" value="VW Voyage 1.0 • IQD8060" />
          </div>
        </div>
