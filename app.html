<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>32 Drive - Rio Grande & Cassino</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #ffffff; color: #0f172a; padding: 16px; max-width: 580px; margin: 0 auto; font-size: 17px; }
    .card { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
    .badge { background: #0284c7; color: #ffffff; font-weight: 800; padding: 8px 12px; border-radius: 999px; font-size: 15px; }
    .pill { background: #e2e8f0; color: #0f172a; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 700; }
    #map { width: 100%; height: 230px; border-radius: 12px; border: 2px solid #cbd5e1; margin-bottom: 14px; }
    label { display: block; font-size: 16px; color: #0f172a; margin-bottom: 6px; font-weight: 800; }
    input { width: 100%; background: #ffffff; border: 2px solid #94a3b8; color: #0f172a; padding: 13px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 18px; font-weight: 600; }
    input:focus { outline: none; border-color: #0284c7; }
    button { width: 100%; border: none; border-radius: 12px; padding: 15px; font-size: 18px; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
    button:last-child { margin-bottom: 0; }
    .btn-blue { background: #0284c7; color: #ffffff; }
    .btn-green { background: #15803d; color: #ffffff; }
    .btn-waze { background: #0ea5e9; color: #ffffff; }
    .btn-dark { background: #1e293b; color: #ffffff; }
    .resumo { background: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .resumo div { margin-bottom: 8px; font-size: 18px; color: #1e293b; font-weight: 600; }
    .resumo strong { color: #0f172a; font-size: 19px; }
    .total { font-size: 24px !important; font-weight: 900; color: #15803d !important; }
    .pix-box { background: #ffffff; border: 2px dashed #0284c7; border-radius: 12px; padding: 14px; margin-top: 12px; }
    .pix-box strong { font-size: 17px; color: #0f172a; }
    .pix-key { font-family: monospace; font-size: 16px; font-weight: 700; word-break: break-all; background: #f1f5f9; padding: 10px; border-radius: 10px; margin: 10px 0; color: #0f172a; border: 1px solid #cbd5e1; }
    .msg { font-size: 16px; font-weight: 700; color: #0f172a; margin-top: 8px; min-height: 22px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="badge">32 DRIVE • Rio Grande & Cassino</span>
      <span class="pill" id="gpsStatus">GPS pronto</span>
    </div>

    <div id="map"></div>

    <label for="pName">Nome do passageiro</label>
    <input id="pName" type="text" placeholder="Ex.: João Silva" />

    <label for="pPhone">Telefone do passageiro</label>
    <input id="pPhone" type="tel" placeholder="Ex.: 53 99999-9999" />

    <label for="pickup">Origem (embarque / número / referência)</label>
    <input id="pickup" type="text" placeholder="Ex.: Centro, Rio Grande" />

    <label for="dropoff">Destino (entrega / número / referência)</label>
    <input id="dropoff" type="text" placeholder="Ex.: Cassino, Rio Grande" />

    <button type="button" class="btn-blue" onclick="usarGPS()">Usar meu GPS</button>
    <button type="button" class="btn-blue" onclick="calcularCorrida()">Calcular corrida</button>

    <div class="resumo">
      <div>Distância: <strong id="distVal">0,00 km</strong></div>
      <div>Faixa: <strong id="faixaVal">Até 3,5 km (R$ 7,99)</strong></div>
      <div class="total">Valor: <span id="valorVal">R$ 7,99</span></div>
    </div>

    <button type="button" class="btn-green" id="btnWhats" onclick="enviarWhatsMotorista()">
      Enviar corrida no WhatsApp do motorista
    </button>

    <button type="button" class="btn-waze" id="btnWaze" onclick="abrirWaze()">
      Abrir rota no Waze
    </button>

    <div class="pix-box">
      <strong>Chave Pix (Banco Inter - Aleatória)</strong>
      <div class="pix-key" id="pixTexto">45bd89b5-9dd7-4cda-8715-789257d06596</div>
      <button type="button" class="btn-dark" onclick="copiarPix()">Copiar chave Pix</button>
      <div class="msg" id="feedbackMsg"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CHAVE_PIX_INTER = "45bd89b5-9dd7-4cda-8715-789257d06596";
    const WHATS_MOTORISTA = "5553991357231";

    document.getElementById("pixTexto").textContent = CHAVE_PIX_INTER;

    const map = L.map("map").setView([-32.10, -52.12], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let marcadorOrigem = null;
    let marcadorDestino = null;
    let linhaRota = null;
    let distanciaAtual = 3.0;
    let valorAtual = 7.99;
    let coordsOrigem = null;

    function setMsg(texto) {
      document.getElementById("feedbackMsg").textContent = texto;
    }

    function calcularTarifa(km) {
      const limpo = Math.max(0.1, Number(km) || 0);
      let base = limpo <= 3.5 ? 7.99 : limpo * 2.0;
      const hora = new Date().getHours();
      const noturno = hora >= 20 || hora < 6;
      if (noturno) {
        base = base * 1.25;
      }
      return {
        km: limpo,
        valor: Number(base.toFixed(2)),
        faixa: limpo <= 3.5
          ? (noturno ? "Até 3,5 km + Noturno 25%" : "Até 3,5 km (fixo)")
          : (noturno ? "Acima de 3,5 km (R$ 2/km) + Noturno 25%" : "Acima de 3,5 km (R$ 2/km)")
      };
    }

    function atualizarTela() {
      const calc = calcularTarifa(distanciaAtual);
      distanciaAtual = calc.km;
      valorAtual = calc.valor;
      document.getElementById("distVal").textContent = calc.km.toFixed(2).replace(".", ",") + " km";
      document.getElementById("faixaVal").textContent = calc.faixa;
      document.getElementById("valorVal").textContent = "R$ " + calc.valor.toFixed(2).replace(".", ",");
    }

    function haversineKm(a, b) {
      const R = 6371;
      const dLat = ((b.lat - a.lat) * Math.PI) / 180;
      const dLon = ((b.lon - a.lon) * Math.PI) / 180;
      const lat1 = (a.lat * Math.PI) / 180;
      const lat2 = (b.lat * Math.PI) / 180;
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    async function buscarCoordenadas(texto) {
      const limpo = texto.trim();
      const matchGps = limpo.match(/GPS\s*\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/i);
      if (matchGps) {
        return { lat: parseFloat(matchGps[1]), lon: parseFloat(matchGps[2]) };
      }
      const lower = limpo.toLowerCase();
      if (lower.includes("cassino") && !lower.includes("centro")) {
        return { lat: -32.1835, lon: -52.1645 };
      }
      if ((lower.includes("centro") && lower.includes("rio grande")) || lower === "centro") {
        return { lat: -32.0352, lon: -52.0986 };
      }
      const query = lower.includes("rio grande") || lower.includes("cassino")
        ? `${limpo}, Rio Grande do Sul, Brasil`
        : `${limpo}, Rio Grande, RS, Brasil`;
      const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
      const dados = await resp.json();
      if (dados && dados.length > 0) {
        return { lat: parseFloat(dados[0].lat), lon: parseFloat(dados[0].lon) };
      }
      return null;
    }

    async function calcularCorrida() {
      const origem = document.getElementById("pickup").value.trim();
      const destino = document.getElementById("dropoff").value.trim();
      if (!origem || !destino) {
        setMsg("Preencha origem e destino para calcular.");
        return;
      }

      setMsg("Buscando rota real...");
      try {
        const cOrigem = coordsOrigem || await buscarCoordenadas(origem);
        const cDestino = await buscarCoordenadas(destino);

        if (!cOrigem || !cDestino) {
          setMsg("Não achei o endereço. Tente colocar bairro/cidade (ex.: Centro Rio Grande).");
          return;
        }

        if (marcadorOrigem) map.removeLayer(marcadorOrigem);
        if (marcadorDestino) map.removeLayer(marcadorDestino);
        if (linhaRota) map.removeLayer(linhaRota);

        marcadorOrigem = L.marker([cOrigem.lat, cOrigem.lon]).addTo(map).bindPopup("Origem");
        marcadorDestino = L.marker([cDestino.lat, cDestino.lon]).addTo(map).bindPopup("Destino");

        let kmRota = null;
        try {
          const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${cOrigem.lon},${cOrigem.lat};${cDestino.lon},${cDestino.lat}?overview=full&geometries=geojson`;
          const rResp = await fetch(osrmUrl);
          const rJson = await rResp.json();
          if (rJson && rJson.routes && rJson.routes.length > 0) {
            kmRota = rJson.routes[0].distance / 1000;
            const coordsGeo = rJson.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            linhaRota = L.polyline(coordsGeo, { color: "#0284c7", weight: 5 }).addTo(map);
            map.fitBounds(linhaRota.getBounds(), { padding: [24, 24] });
          }
        } catch (errRota) {
          kmRota = null;
        }

        if (!kmRota || kmRota <= 0) {
          kmRota = Number((haversineKm(cOrigem, cDestino) * 1.25).toFixed(2));
          linhaRota = L.polyline([[cOrigem.lat, cOrigem.lon], [cDestino.lat, cDestino.lon]], { color: "#0284c7", weight: 4 }).addTo(map);
          map.fitBounds(linhaRota.getBounds(), { padding: [24, 24] });
        }

        distanciaAtual = Number(kmRota.toFixed(2));
        atualizarTela();
        setMsg("Rota calculada com sucesso!");
      } catch (e) {
        setMsg("Erro ao consultar rota. Verifique a conexão e tente de novo.");
      }
    }

    function usarGPS() {
      if (!navigator.geolocation) {
        setMsg("GPS não disponível neste aparelho.");
        return;
      }
      document.getElementById("gpsStatus").textContent = "Buscando GPS...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          coordsOrigem = { lat: latitude, lon: longitude };
          document.getElementById("gpsStatus").textContent = "GPS ativo";
          map.setView([latitude, longitude], 15);
          if (marcadorOrigem) map.removeLayer(marcadorOrigem);
          marcadorOrigem = L.marker([latitude, longitude]).addTo(map);
          document.getElementById("pickup").value = `GPS (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`;
          setMsg("Localização capturada. Agora informe o destino.");
        },
        () => {
          document.getElementById("gpsStatus").textContent = "GPS bloqueado";
          setMsg("Não foi possível ler o GPS. Digite o endereço manualmente.");
        }
      );
    }

    function enviarWhatsMotorista() {
      const nome = document.getElementById("pName").value.trim() || "Não informado";
      const tel = document.getElementById("pPhone").value.trim() || "Não informado";
      const origem = document.getElementById("pickup").value.trim() || "Não informado";
      const destino = document.getElementById("dropoff").value.trim() || "Não informado";
      const valorFmt = "R$ " + valorAtual.toFixed(2).replace(".", ",");
      const distFmt = distanciaAtual.toFixed(2).replace(".", ",") + " km";

      const texto = [
        "*NOVA CORRIDA - 32 DRIVE*",
        `Passageiro: ${nome}`,
        `Telefone: ${tel}`,
        `Origem: ${origem}`,
        `Destino: ${destino}`,
        `Distância: ${distFmt}`,
        `Valor: ${valorFmt}`,
        `Pix Inter: ${CHAVE_PIX_INTER}`
      ].join("\n");

      const url = `https://wa.me/${WHATS_MOTORISTA}?text=${encodeURIComponent(texto)}`;
      window.location.href = url;
    }

    function abrirWaze() {
      const destino = document.getElementById("dropoff").value.trim();
      const alvo = destino || "Cassino, Rio Grande - RS";
      const urlWaze = `https://waze.com/ul?q=${encodeURIComponent(alvo)}&navigate=yes`;
      window.location.href = urlWaze;
    }

    async function copiarPix() {
      const chave = CHAVE_PIX_INTER.trim();
      try {
        await navigator.clipboard.writeText(chave);
        setMsg("Chave Pix do Banco Inter copiada!");
      } catch (e) {
        const temp = document.createElement("textarea");
        temp.value = chave;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        setMsg("Chave Pix copiada para a área de transferência.");
      }
    }

    atualizarTela();
  </script>
</body>
</html>
