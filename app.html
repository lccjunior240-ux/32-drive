<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entrega — Entregador V39</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 16px;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .topo {
      background: #0b192c;
      color: #ffffff;
      border-bottom: 4px solid #f59e0b;
      border-radius: 14px;
      padding: 16px;
    }
    .topo h1 {
      margin: 0;
      font-size: 20px;
      color: #f59e0b;
    }
    .diag {
      background: #0f172a;
      color: #f8fafc;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
    }
    .card {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-weight: 800;
      font-size: 15px;
      display: block;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 2px solid #64748b;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-ouro { background: #f59e0b; color: #0f172a; }
    .btn-verde { background: #059669; color: #ffffff; }
    .btn-laranja { background: #d97706; color: #ffffff; }
    .item {
      border: 2px solid #94a3b8;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8fafc;
    }
    .msg {
      font-weight: 800;
      color: #047857;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topo">
      <h1>32 Entrega — Entregador V39</h1>
      <div>Cassino &amp; Rio Grande</div>
    </div>

    <div class="diag" id="diag">Diag V39: iniciando...</div>

    <div class="card">
      <label for="nome-ent">Seu Nome</label>
      <input id="nome-ent" type="text" placeholder="Ex: Junior Costa" value="Junior Costa" />

      <label for="pix-ent">Sua Chave Pix</label>
      <input id="pix-ent" type="text" placeholder="Ex: 53999089980" />

      <label for="valor-ent">Valor da Entrega (R$)</label>
      <input id="valor-ent" type="number" step="0.5" min="1" placeholder="Ex: 20" />

      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <strong>Entrega em Andamento</strong>
      <div id="andamento">Nenhuma entrega aceita no momento.</div>
    </div>

    <div class="card">
      <strong>Chamados Aguardando</strong>
      <div id="chamados">Carregando...</div>
    </div>
  </div>

  <script type="module">
    const diagEl = document.getElementById("diag");
    const msgEl = document.getElementById("msg");
    const chamadosEl = document.getElementById("chamados");
    const andamentoEl = document.getElementById("andamento");
    const nomeEl = document.getElementById("nome-ent");
    const pixEl = document.getElementById("pix-ent");
    const valorEl = document.getElementById("valor-ent");

    let db = null;
    let fs = null;
    let corridaAtual = null;

    function setDiag(t) {
      if (diagEl) diagEl.textContent = t;
    }

    function setMsg(t) {
      if (msgEl) msgEl.textContent = t;
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (m) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
      });
    }

    function renderAndamento() {
      if (!andamentoEl) return;
      if (!corridaAtual) {
        andamentoEl.innerHTML = "Nenhuma entrega aceita no momento.";
        return;
      }
      const c = corridaAtual;
      andamentoEl.innerHTML =
        '<div class="item">' +
          '<div><strong>' + esc(c.codigo) + '</strong> • ' + esc(c.passageiro || "Cliente") + ' • Status: <strong>' + esc(c.status) + '</strong></div>' +
          '<div>Retirada: ' + esc(c.origem) + '<br/>Destino: ' + esc(c.destino) + '</div>' +
          '<div>Valor atual: <strong>' + (c.valorBruto ? "R$ " + Number(c.valorBruto).toFixed(2).replace(".", ",") : "Não enviado") + '</strong></div>' +
          '<button class="btn-verde" type="button" id="btn-enviar-cliente">Enviar Valor e Aceite ao Cliente</button>' +
          '<button class="btn-laranja" type="button" id="btn-finalizar">Finalizar Entrega</button>' +
        '</div>';

      const btnEnv = document.getElementById("btn-enviar-cliente");
      if (btnEnv) {
        btnEnv.onclick = async function () {
          const valNum = Number(valorEl && valorEl.value);
          const nomeEnt = (nomeEl && nomeEl.value ? nomeEl.value : "").trim() || "Junior Costa";
          const pixEnt = (pixEl && pixEl.value ? pixEl.value : "").trim();
          const payload = {
            status: "Aceita",
            motorista: { nome: nomeEnt, chavePix: pixEnt },
            chavePixMotorista: pixEnt,
            tempoChegadaMin: 6,
            modoTempoChegada: "manual",
            enviadoAoCliente: true
          };
          if (Number.isFinite(valNum) && valNum > 0) {
            payload.valorBruto = Number(valNum.toFixed(2));
          }
          try {
            setDiag("Diag V39: gravando envio ID=" + c.docId + "...");
            await fs.updateDoc(fs.doc(db, "corridas", c.docId), payload);
            corridaAtual = Object.assign({}, c, payload);
            renderAndamento();
            setDiag("Diag V39: OK gravado ID=" + c.docId + " | val=" + (payload.valorBruto || ""));
            setMsg("Enviado ao cliente!");
          } catch (e) {
            setDiag("Diag V39 ERR enviar: " + (e.code || e.message));
            setMsg("Erro ao enviar.");
          }
        };
      }

      const btnFin = document.getElementById("btn-finalizar");
      if (btnFin) {
        btnFin.onclick = async function () {
          try {
            await fs.updateDoc(fs.doc(db, "corridas", c.docId), { status: "Finalizada" });
            corridaAtual = null;
            renderAndamento();
            setMsg("Entrega finalizada.");
          } catch (e) {
            setDiag("Diag V39 ERR finalizar: " + (e.code || e.message));
          }
        };
      }
    }

    function renderChamados(lista) {
      if (!chamadosEl) return;
      if (!lista.length) {
        chamadosEl.innerHTML = "Nenhum chamado aguardando no momento.";
        return;
      }
      chamadosEl.innerHTML = lista.map(function (c) {
        return (
          '<div class="item">' +
            '<div><strong>' + esc(c.codigo) + '</strong> • ' + esc(c.passageiro || "Cliente") + '</div>' +
            '<div>Retirada: ' + esc(c.origem) + '<br/>Destino: ' + esc(c.destino) + '</div>' +
            '<button class="btn-ouro" type="button" data-aceitar="' + esc(c.docId) + '">Aceitar Entrega</button>' +
          '</div>'
        );
      }).join("");

      chamadosEl.querySelectorAll("button[data-aceitar]").forEach(function (btn) {
        btn.onclick = async function () {
          const id = btn.getAttribute("data-aceitar");
          const escolhido = lista.find(function (x) { return x.docId === id; });
          if (!escolhido) return;
          const nomeEnt = (nomeEl && nomeEl.value ? nomeEl.value : "").trim() || "Junior Costa";
          const pixEnt = (pixEl && pixEl.value ? pixEl.value : "").trim();
          const valNum = Number(valorEl && valorEl.value);
          const payload = {
            status: "Aceita",
            motorista: { nome: nomeEnt, chavePix: pixEnt },
            chavePixMotorista: pixEnt,
            tempoChegadaMin: 6,
            modoTempoChegada: "manual"
          };
          if (Number.isFinite(valNum) && valNum > 0) {
            payload.valorBruto = Number(valNum.toFixed(2));
          }
          try {
            setDiag("Diag V39: aceitando ID=" + id + "...");
            await fs.updateDoc(fs.doc(db, "corridas", id), payload);
            corridaAtual = Object.assign({ docId: id }, escolhido, payload);
            renderAndamento();
            setDiag("Diag V39: OK aceita ID=" + id);
            setMsg("Entrega aceita! Agora clique em Enviar Valor e Aceite ao Cliente.");
          } catch (e) {
            setDiag("Diag V39 ERR aceitar: " + (e.code || e.message));
            setMsg("Erro ao aceitar.");
          }
        };
      });
    }

    async function iniciar() {
      try {
        setDiag("Diag V39: importando firebase-config.js...");
        let cfg = null;
        try {
          cfg = await import("./firebase-config.js");
        } catch (_) {
          cfg = await import("../firebase-config.js");
        }
        fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        db = cfg.db;
        if (!db) throw new Error("db ausente");

        setDiag("Diag V39: conectado! Escutando corridas...");

        fs.onSnapshot(fs.collection(db, "corridas"), function (snap) {
          const aguardando = [];
          let ativa = null;
          snap.forEach(function (docSnap) {
            const d = docSnap.data();
            const st = String(d.status || "");
            if (st === "Finalizada" || st === "Cancelada") return;
            const item = Object.assign({ docId: docSnap.id }, d);
            if (st === "Aguardando motorista") {
              aguardando.push(item);
            } else if (!ativa) {
              ativa = item;
            }
          });
          if (ativa) {
            corridaAtual = ativa;
            setDiag("Diag V39: ATIVA ID=" + ativa.docId + " | cod=" + (ativa.codigo || "") + " | st=" + (ativa.status || "") + " | val=" + (ativa.valorBruto || ""));
          } else {
            setDiag("Diag V39: online (" + aguardando.length + " aguardando)");
          }
          renderChamados(aguardando);
          renderAndamento();
        }, function (err) {
          setDiag("Diag V39 ERR snapshot: " + (err.code || err.message));
        });
      } catch (e) {
        setDiag("Diag V39 ERR init: " + (e && e.message ? e.message : e));
      }
    }

    iniciar();
  </script>
</body>
</html>
