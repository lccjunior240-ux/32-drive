<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b192c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Motorista</title>
  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1d;
      --navy-card: linear-gradient(145deg, #0b192c 0%, #13294b 65%, #0c1e38 100%);
      --navy-border: #1e3f6e;
      --card-elevated: rgba(255, 255, 255, 0.06);
      --border: #2c2c32;
      --text: #f5f5f7;
      --muted: #b4b4be;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #13233b 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 17px;
      line-height: 1.45;
    }
    header {
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid var(--navy-border);
    }
    .badge {
      background: var(--accent);
      color: #111;
      font-weight: 800;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    h1 { font-size: 19px; font-weight: 900; }
    .subtitle { font-size: 15px; color: var(--muted); }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    .hero-card {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-title {
      font-size: 24px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .hero-sub {
      font-size: 15px;
      color: #dbeafe;
      margin-top: 3px;
    }
    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.16);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .online-pill.offline {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
    }
    .online-pill.offline .dot {
      background: var(--red);
    }
    .driver-box {
      background: var(--card-elevated);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .driver-name { font-size: 19px; font-weight: 800; color: #ffffff; }
    .driver-car { font-size: 16px; color: #dbeafe; margin-top: 3px; }
    .plate-box {
      background: #f8fafc;
      color: #0f172a;
      border: 2px solid #0284c7;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 16px;
      min-width: 118px;
    }
    .plate-label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: #0284c7;
      letter-spacing: 0.8px;
      margin-bottom: 2px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-title {
      font-size: 19px;
      font-weight: 800;
    }
    .count-badge {
      background: #252529;
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 15px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
    }
    .lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pedido-card {
      background: #131316;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pedido-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .pedido-id {
      font-weight: 800;
      font-size: 18px;
    }
    .pedido-valor {
      font-weight: 900;
      font-size: 22px;
      color: var(--green);
    }
    .pedido-info {
      font-size: 17px;
      line-height: 1.5;
      color: var(--text);
    }
    .muted { color: var(--muted); }
    .status-tag {
      display: inline-block;
      font-size: 14px;
      font-weight: 800;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.14);
      color: var(--accent);
      width: fit-content;
    }
    .status-tag.aceita {
      background: rgba(16, 185, 129, 0.14);
      color: var(--green);
    }
    .status-tag.recusada {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
    }
    .eta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .eta-chip {
      padding: 9px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1e1e24;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .eta-chip.ativo {
      background: var(--green);
      color: #062117;
      border-color: var(--green);
    }
    .eta-input {
      width: 104px;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f0f12;
      color: var(--text);
      font-size: 16px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }
    .btn {
      padding: 15px 12px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-status-toggle {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .btn-aceitar {
      background: var(--green);
      color: #062117;
    }
    .btn-recusar {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-finalizar {
      background: var(--accent);
      color: #111;
    }
    .btn-limpar {
      background: #252529;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-remover {
      background: rgba(239, 68, 68, 0.14);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .offline-notice {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fecaca;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
    }
    .offline-notice.visivel {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 Drive — Motorista</h1>
        <div class="subtitle">Painel de Solicitações</div>
      </div>
    </div>
    <span class="badge">PAINEL</span>
  </header>

  <main>
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-title">32 DRIVE</div>
          <div class="hero-sub">Mobilidade Urbana Local • Cassino &amp; Rio Grande</div>
        </div>
        <span class="online-pill" id="status-pill"><span class="dot"></span><span id="status-pill-text">Em Operação</span></span>
      </div>

      <div class="driver-box">
        <div>
          <div class="driver-name">Luíz Carlos Costa Jr.</div>
          <div class="driver-car">VW Voyage 2010</div>
        </div>
        <div class="plate-box">
          <span class="plate-label">BRASIL</span>
          IQD8060
        </div>
      </div>

      <button class="btn btn-status-toggle" type="button" id="btn-alternar-online">Ficar Offline</button>
      <div class="offline-notice" id="offline-notice">
        Você está Offline. O painel do passageiro também foi avisado e novos pedidos estão pausados.
      </div>
    </section>

    <div class="card">
      <div class="section-head">
        <div class="section-title">Corridas solicitadas</div>
        <span class="count-badge" id="contador">0</span>
      </div>
      <div class="lista" id="lista-motorista"></div>
      <button class="btn btn-limpar" type="button" id="btn-limpar-historico">Limpar histórico</button>
    </div>
  </main>

  <script>
    (function () {
      const CHAVE_CORRIDAS = "32drive_corridas";
      const CHAVE_VISTOS = "32drive_vistos_nuvem";
      const CHAVE_ONLINE = "32drive_motorista_online";
      const TOPICO_PEDIDOS = "32drive_cassino_jr_pedidos_v2";
      const TOPICO_RESPOSTAS = "32drive_cassino_jr_respostas_v2";
      const TOPICO_STATUS = "32drive_cassino_jr_status_v2";
      const temposSelecionados = {};

      let estaOnline = localStorage.getItem(CHAVE_ONLINE) !== "false";

      function publicarStatusNaNuvem(online) {
        return fetch("https://ntfy.sh/" + TOPICO_STATUS, {
          method: "POST",
          body: JSON.stringify({
            online: Boolean(online),
            atualizadoEm: Date.now()
          })
        }).catch(function () {});
      }

      function atualizarEstadoOnlineUI() {
        const pill = document.getElementById("status-pill");
        const pillText = document.getElementById("status-pill-text");
        const btnToggle = document.getElementById("btn-alternar-online");
        const notice = document.getElementById("offline-notice");

        if (pill) {
          pill.classList.toggle("offline", !estaOnline);
        }
        if (pillText) {
          pillText.textContent = estaOnline ? "Em Operação" : "Offline";
        }
        if (btnToggle) {
          btnToggle.textContent = estaOnline ? "Ficar Offline" : "Ficar Online";
        }
        if (notice) {
          notice.classList.toggle("visivel", !estaOnline);
        }
      }

      function alternarOnline() {
        estaOnline = !estaOnline;
        localStorage.setItem(CHAVE_ONLINE, String(estaOnline));
        atualizarEstadoOnlineUI();
        publicarStatusNaNuvem(estaOnline);
      }

      function lerCorridas() {
        try {
          return JSON.parse(localStorage.getItem(CHAVE_CORRIDAS) || "[]");
        } catch (e) {
          return [];
        }
      }

      function salvarCorridas(lista) {
        localStorage.setItem(CHAVE_CORRIDAS, JSON.stringify(lista));
      }

      function lerVistos() {
        try {
          return JSON.parse(localStorage.getItem(CHAVE_VISTOS) || "[]");
        } catch (e) {
          return [];
        }
      }

      function marcarVisto(id) {
        const vistos = lerVistos();
        if (!vistos.includes(id)) {
          vistos.push(id);
          localStorage.setItem(CHAVE_VISTOS, JSON.stringify(vistos.slice(-100)));
        }
      }

      function publicarRespostaNaNuvem(resposta) {
        return fetch("https://ntfy.sh/" + TOPICO_RESPOSTAS, {
          method: "POST",
          body: JSON.stringify(resposta)
        }).catch(function () {});
      }

      function adicionarPedidoSeNovo(pedido) {
        if (!estaOnline) return;
        if (!pedido || !pedido.id) return;
        const vistos = lerVistos();
        if (vistos.includes(pedido.id)) return;

        const lista = lerCorridas();
        const existe = lista.some(function (p) { return p.id === pedido.id; });
        if (!existe) {
          lista.unshift(pedido);
          salvarCorridas(lista);
          renderizar();
        }
        marcarVisto(pedido.id);
      }

      function aceitarCorrida(id) {
        const inputMin = document.getElementById("eta-input-" + id);
        const digitado = inputMin ? String(inputMin.value || "").trim() : "";
        const tempoChegada = digitado || temposSelecionados[id] || "5";

        const lista = lerCorridas().map(function (p) {
          if (p.id === id) {
            return Object.assign({}, p, {
              status: "Corrida aceita",
              tempoChegada: tempoChegada
            });
          }
          return p;
        });
        salvarCorridas(lista);
        renderizar();

        publicarRespostaNaNuvem({
          id: id,
          status: "Corrida aceita",
          tempoChegada: tempoChegada
        });
      }

      function recusarCorrida(id) {
        const lista = lerCorridas().map(function (p) {
          if (p.id === id) {
            return Object.assign({}, p, {
              status: "Corrida recusada",
              tempoChegada: null
            });
          }
          return p;
        });
        salvarCorridas(lista);
        renderizar();

        publicarRespostaNaNuvem({
          id: id,
          status: "Corrida recusada",
          tempoChegada: null
        });
      }

      function atualizarStatus(id, novoStatus) {
        const lista = lerCorridas().map(function (p) {
          if (p.id === id) {
            return Object.assign({}, p, { status: novoStatus });
          }
          return p;
        });
        salvarCorridas(lista);
        renderizar();

        publicarRespostaNaNuvem({
          id: id,
          status: novoStatus
        });
      }

      function removerPedido(id) {
        marcarVisto(id);
        const lista = lerCorridas().filter(function (p) {
          return p.id !== id;
        });
        salvarCorridas(lista);
        renderizar();
      }

      function renderizar() {
        const container = document.getElementById("lista-motorista");
        const contador = document.getElementById("contador");
        const lista = lerCorridas();

        if (contador) contador.textContent = String(lista.length);
        if (!container) return;

        if (!lista.length) {
          container.innerHTML =
            '<div class="pedido-card"><span class="muted">Nenhuma corrida recebida no painel ainda.</span></div>';
          return;
        }

        container.innerHTML = lista
          .map(function (p) {
            const statusAtual = p.status || "Aguardando motorista";
            const isAceita = statusAtual === "Corrida aceita" || statusAtual === "Corrida finalizada";
            const isRecusada = statusAtual === "Corrida recusada";
            const badgeClass = isAceita ? "status-tag aceita" : (isRecusada ? "status-tag recusada" : "status-tag");
            const etaAtual = temposSelecionados[p.id] || p.tempoChegada || "5";
            const etaInfo = p.tempoChegada
              ? '<br/><strong style="color:var(--green);">Chegada informada: ' + p.tempoChegada + " min</strong>"
              : "";

            return (
              '<div class="pedido-card">' +
              '<div class="pedido-top">' +
              '<span class="pedido-id">' + p.id + " • " + (p.passageiro || "Passageiro") + "</span>" +
              '<span class="pedido-valor">' + p.valor + "</span>" +
              "</div>" +
              '<span class="' + badgeClass + '">' + statusAtual + "</span>" +
              '<div class="pedido-info">' +
              '<span class="muted">Embarque:</span> ' + p.origem + "<br/>" +
              '<span class="muted">Destino:</span> ' + p.destino + "<br/>" +
              '<span class="muted">Distância / Pagto:</span> ' + (p.km || "-") + " km • " + (p.pagamento || "Pix / Dinheiro") +
              (p.criadoEm ? ' <span class="muted">(' + p.criadoEm + ")</span>" : "") +
              etaInfo +
              "</div>" +
              '<div class="eta-box">' +
              '<span class="muted" style="font-size:15px;">Tempo de chegada:</span>' +
              ["3", "5", "8", "12"].map(function (min) {
                const ativo = String(etaAtual) === min ? " eta-chip ativo" : " eta-chip";
                return '<button class="' + ativo + '" type="button" data-acao="set-eta" data-id="' + p.id + '" data-min="' + min + '">' + min + " min</button>";
              }).join("") +
              '<input class="eta-input" id="eta-input-' + p.id + '" type="number" min="1" max="60" value="' + etaAtual + '" aria-label="Minutos" />' +
              "</div>" +
              '<div class="actions">' +
              '<button class="btn btn-aceitar" type="button" data-acao="aceitar" data-id="' + p.id + '">Aceitar</button>' +
              '<button class="btn btn-recusar" type="button" data-acao="recusar" data-id="' + p.id + '">Recusar</button>' +
              '<button class="btn btn-finalizar" type="button" data-acao="finalizar" data-id="' + p.id + '">Finalizar</button>' +
              "</div>" +
              '<button class="btn btn-remover" type="button" data-acao="remover" data-id="' + p.id + '">Remover pedido</button>' +
              "</div>"
            );
          })
          .join("");
      }

      function buscarDaNuvem() {
        if (!estaOnline) return;
        fetch("https://ntfy.sh/" + TOPICO_PEDIDOS + "/json?poll=1&since=10m")
          .then(function (r) { return r.text(); })
          .then(function (texto) {
            if (!texto) return;
            const linhas = texto.split("\n");
            for (let i = 0; i < linhas.length; i++) {
              const linha = linhas[i].trim();
              if (!linha) continue;
              try {
                const msg = JSON.parse(linha);
                if (msg && msg.event === "message" && msg.message) {
                  const pedido = JSON.parse(msg.message);
                  adicionarPedidoSeNovo(pedido);
                }
              } catch (e) {}
            }
          })
          .catch(function () {});
      }

      document.addEventListener("click", function (ev) {
        const btn = ev.target.closest("button[data-acao]");
        if (!btn) return;
        const acao = btn.getAttribute("data-acao");
        const id = btn.getAttribute("data-id");
        if (acao === "set-eta") {
          const min = btn.getAttribute("data-min");
          temposSelecionados[id] = min;
          const inp = document.getElementById("eta-input-" + id);
          if (inp) inp.value = min;
          renderizar();
        }
        if (acao === "aceitar") aceitarCorrida(id);
        if (acao === "recusar") recusarCorrida(id);
        if (acao === "finalizar") atualizarStatus(id, "Corrida finalizada");
        if (acao === "remover") removerPedido(id);
      });

      const btnOnline = document.getElementById("btn-alternar-online");
      if (btnOnline) {
        btnOnline.addEventListener("click", alternarOnline);
      }

      const btnLimpar = document.getElementById("btn-limpar-historico");
      if (btnLimpar) {
        btnLimpar.addEventListener("click", function () {
          const atuais = lerCorridas();
          atuais.forEach(function (p) { marcarVisto(p.id); });
          salvarCorridas([]);
          renderizar();
        });
      }

      window.addEventListener("storage", function (ev) {
        if (ev.key === CHAVE_CORRIDAS) renderizar();
        if (ev.key === CHAVE_ONLINE) {
          estaOnline = localStorage.getItem(CHAVE_ONLINE) !== "false";
          atualizarEstadoOnlineUI();
        }
      });

      atualizarEstadoOnlineUI();
      publicarStatusNaNuvem(estaOnline);
      buscarDaNuvem();
      setInterval(buscarDaNuvem, 2500);
      setInterval(renderizar, 1500);
      renderizar();
    })();
  </script>
</body>
</html>
