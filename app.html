<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="32 DRIVE Motorista">
  <title>32 DRIVE - Painel do Motorista</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #081220;
      color: #ffffff;
      margin: 0;
      padding: 14px;
    }
    .card {
      max-width: 520px;
      margin: 0 auto;
      background: #0f1d33;
      border: 2px solid #ff7a00;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .topo {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 122, 0, 0.35);
    }
    .marca {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .selo {
      background: #ff7a00;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 7px;
      margin-right: 6px;
    }
    .sub {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 6px;
    }
    .status-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-status {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid transparent;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-online {
      background: #14532d;
      color: #dcfce7;
      border-color: #22c55e;
    }
    .btn-offline {
      background: #7f1d1d;
      color: #fee2e2;
      border-color: #ef4444;
    }
    .aviso-offline {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid #ef4444;
      color: #fecaca;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .secao-titulo {
      margin-top: 18px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #ff9d42;
      border-bottom: 1px solid rgba(255, 122, 0, 0.25);
      padding-bottom: 6px;
    }
    .pedido-card {
      margin-top: 12px;
      background: #081220;
      border: 1px solid #ff7a00;
      border-radius: 12px;
      padding: 12px;
      line-height: 1.45;
      font-size: 0.88rem;
    }
    .min-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .btn-min {
      padding: 9px 4px;
      background: #ff7a00;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.84rem;
    }
    .btn-recusar {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: #1e293b;
      color: #fca5a5;
      border: 1px solid #ef4444;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }
    .util-row {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-util {
      flex: 1;
      padding: 10px;
      background: #1e293b;
      color: #ffffff;
      border: 1px solid #ff7a00;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.84rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="topo">
      <div class="marca"><span class="selo">32</span>DRIVE</div>
      <div class="sub">Painel do Motorista &middot; Luiz Carlos Costa Junior &middot; Voyage IQD 8060</div>
    </div>

    <div class="status-row">
      <button type="button" class="btn-status btn-online" onclick="definirStatus('ONLINE')">FICAR ONLINE</button>
      <button type="button" class="btn-status btn-offline" onclick="definirStatus('OFFLINE')">FICAR OFFLINE</button>
    </div>
    <div id="statusAtual" style="text-align:center;margin-top:8px;font-size:0.88rem;color:#cbd5e1;">Status: carregando...</div>
    <div id="avisoOffline" class="aviso-offline">Voce esta OFFLINE — passageiros veem indisponivel.</div>

    <div class="secao-titulo">Pedidos dos Passageiros (Tempo Real)</div>
    <div id="listaPedidos">
      <div style="margin-top:10px;color:#94a3b8;font-size:0.86rem;">Nenhum pedido pendente no momento.</div>
    </div>

    <div class="util-row">
      <button type="button" class="btn-util" onclick="meuGps()">Meu GPS</button>
      <button type="button" class="btn-util" onclick="copiarPix()">Copiar Pix Inter</button>
    </div>
  </div>

  <script>
    const DB_URL = 'https://drive-4745f-default-rtdb.firebaseio.com'.replace(/\/+$/, '');
    const PIX = '45bd89b5-9dd7-4cda-8715-789257d06596';
    const MINUTOS_OPCOES = [2, 3, 4, 5, 6, 8, 10, 15];

    async function definirStatus(novoStatus) {
      await fetch(DB_URL + '/status.json', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: novoStatus })
      });
      atualizarTelaStatus(novoStatus);
    }

    function atualizarTelaStatus(st) {
      document.getElementById('statusAtual').textContent = 'Status atual: ' + st;
      document.getElementById('avisoOffline').style.display = st === 'OFFLINE' ? 'block' : 'none';
    }

    async function responderPedido(id, statusResp, min) {
      await fetch(DB_URL + '/corridas/' + encodeURIComponent(id) + '.json', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          status: statusResp,
          minutos: min ? String(min) : ''
        })
      });
      carregarPedidos();
    }

    async function carregarPedidos() {
      try {
        const resSt = await fetch(DB_URL + '/status.json');
        if (resSt.ok) {
          const stObj = await resSt.json();
          if (stObj && stObj.status) {
            atualizarTelaStatus(stObj.status);
          }
        }

        const res = await fetch(DB_URL + '/corridas.json');
        if (!res.ok) return;
        const dados = await res.json();
        const container = document.getElementById('listaPedidos');

        if (!dados) {
          container.innerHTML = '<div style="margin-top:10px;color:#94a3b8;font-size:0.86rem;">Nenhum pedido pendente no momento.</div>';
          return;
        }

        const pendentes = Object.values(dados).filter(function (p) {
          return p && p.status === 'pendente';
        });

        if (pendentes.length === 0) {
          container.innerHTML = '<div style="margin-top:10px;color:#94a3b8;font-size:0.86rem;">Nenhum pedido pendente no momento.</div>';
          return;
        }

        container.innerHTML = pendentes.map(function (p) {
          const botoesMin = MINUTOS_OPCOES.map(function (m) {
            return '<button type="button" class="btn-min" onclick="responderPedido(\'' + p.id + '\', \'aceito\', ' + m + ')">' + m + ' min</button>';
          }).join('');

          const linkMapa = p.gps
            ? '<br><a href="' + p.gps + '" target="_blank" style="color:#ff9d42;">Abrir GPS do passageiro</a>'
            : '';

          return (
            '<div class="pedido-card">' +
              '<strong>Passageiro:</strong> ' + p.passageiro + ' (' + p.criadoEm + ')<br>' +
              '<strong>Origem:</strong> ' + p.origem + linkMapa + '<br>' +
              '<strong>Destino:</strong> ' + p.destino + '<br>' +
              '<strong>Distancia / Valor:</strong> ' + p.km + ' km &middot; <span style="color:#ff9d42;font-weight:bold;">' + p.valor + '</span>' +
              '<div class="min-grid">' + botoesMin + '</div>' +
              '<button type="button" class="btn-recusar" onclick="responderPedido(\'' + p.id + '\', \'recusado\', \'\')">Recusar / Indisponivel</button>' +
            '</div>'
          );
        }).join('');
      } catch (e) {
        console.log('Erro ao carregar pedidos:', e);
      }
    }

    function meuGps() {
      if (!navigator.geolocation) {
        alert('GPS nao disponivel.');
        return;
      }
      navigator.geolocation.getCurrentPosition(function (pos) {
        const lat = pos.coords.latitude.toFixed(6);
        const lon = pos.coords.longitude.toFixed(6);
        window.open('https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon + '#map=16/' + lat + '/' + lon, '_blank');
      });
    }

    function copiarPix() {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(PIX).catch(function () {});
      }
      alert('Chave Pix do Banco Inter copiada!');
    }

    carregarPedidos();
    setInterval(carregarPedidos, 2500);
  </script>
</body>
</html>
