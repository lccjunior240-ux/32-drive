<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b192c" />
  <link rel="manifest" href="manifest.json?v=39" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Entrega — Entregador</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 70%, #0c1e38 100%);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #f59e0b;
      --green: #059669;
      --blue: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.45;
    }
    header {
      background: var(--navy-header);
      border-bottom: 3px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 2px solid var(--accent);
      background: #ffffff;
    }
    h1 { font-size: 20px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #dbeafe; }
    .badge {
      background: #10b981;
      color: #052e16;
      font-weight: 800;
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #f59e0b;
      color: #78350f;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
    }
    .aviso-chuva {
      display: none;
      background: #e0f2fe;
      border: 2px solid #0284c7;
      color: #0c4a6e;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 800;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title { font-size: 19px; font-weight: 900; color: #0f172a; }
    label { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; display: block; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #94a3b8;
      background: #ffffff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-modo {
      padding: 11px 12px;
      border-radius: 10px;
      border: 2px solid #94a3b8;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-modo.ativo {
      background: #0b192c;
      border-color: #0b192c;
      color: #ffffff;
    }
    .minutos-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn-min {
      padding: 11px 8px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-min.ativo {
      background: var(--accent);
      border-color: #d97706;
      color: #0f172a;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-sm {
      padding: 9px 12px;
      font-size: 14px;
      width: auto;
    }
    .btn-primary { background: #0b192c; color: #ffffff; }
    .btn-green { background: #10b981; color: #052e16; }
    .btn-accent { background: var(--accent); color: #0f172a; }
    .btn-blue { background: var(--blue); color: #ffffff; }
    .btn-outline { background: #e2e8f0; color: #0f172a; border: 2px solid #94a3b8; }
    .status-msg { font-size: 16px; font-weight: 800; color: #047857; text-align: center; min-height: 20px; }
    .corrida-card {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .corrida-ativa {
      background: #ecfdf5;
      border: 2px solid #10b981;
    }
    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      background: #e2e8f0;
      color: #0f172a;
    }
    .tag-chuva {
      background: #0284c7;
      color: #ffffff;
    }
    .valor-destaque {
      font-size: 22px;
      font-weight: 900;
      color: var(--green);
    }
  </style>
</head>
