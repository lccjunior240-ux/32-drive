<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>32 Entrega — Entregador V39</title>

    :root {
      --bg: #ffffff;

      --border: #cbd5e1;

      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.45;
    }
    header {
      background: var(--navy-header);
      border-bottom: 3px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;

      background: #ffffff;
      flex-shrink: 0;
    }
    h1 { font-size: 19px; font-weight: 900; color: var(--accent); }

      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-colar-topo:active {
      background: var(--accent);
      color: #0f172a;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .box-colar-rapido {
      display: none;
      background: #f8fafc;
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 12px;
      flex-direction: column;
      gap: 8px;
    }
    .box-colar-rapido.ativo { display: flex; }
    .box-colar-rapido textarea {

      color: #0f172a;
      font-size: 15px;
      font-family: monospace;
      resize: vertical;

    .aviso-firebase {

      font-weight: 700;

    .diag-box {

      font-size: 14px;
      font-family: monospace;
      word-break: break-all;

      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);

      font-size: 17px;
      font-weight: 600;
    }

      font-weight: 800;
      cursor: pointer;
    }
    .btn-modo.ativo {
      background: var(--accent);

      color: #0f172a;
    }

    }
    .btn-min {
      padding: 11px 8px;

      border: 2px solid #64748b;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-min.ativo {
      background: var(--accent);
      border-color: #b45309;
      color: #0f172a;
    }

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
