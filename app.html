<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="apple-mobile-web-app-title" content="32 Drive" />
  <title>32 Drive</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230f172a'/%3E%3Ctext x='50%25' y='48%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='900' font-size='210' fill='%23ffffff'%3E32%3C/text%3E%3Ctext x='50%25' y='73%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='54' letter-spacing='6' fill='%23ffffff'%3EDRIVE%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230f172a'/%3E%3Ctext x='50%25' y='48%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='900' font-size='210' fill='%23ffffff'%3E32%3C/text%3E%3Ctext x='50%25' y='73%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='54' letter-spacing='6' fill='%23ffffff'%3EDRIVE%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #ffffff; color: #0f172a; padding: 16px; max-width: 580px; margin: 0 auto; font-size: 17px; }
    .card { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    .top { display: flex; justify-content: flex-start; align-items: center; margin-bottom: 14px; }
    .badge { background: #0f172a; color: #ffffff; font-weight: 800; padding: 8px 14px; border-radius: 999px; font-size: 15px; }
    #map { width: 100%; height: 220px; border-radius: 12px; border: 2px solid #cbd5e1; margin-bottom: 14px; }
    label { display: block; font-size: 16px; color: #0f172a; margin-bottom: 6px; font-weight: 800; }
    input { width: 100%; background: #ffffff; border: 2px solid #94a3b8; color: #0f172a; padding: 13px 14px; border-radius: 12px; margin-bottom: 14px; font-size: 18px; font-weight: 600; }
    input:focus { outline: none; border-color: #0f172a; }
    button, .btn-link { display: block; width: 100%; border: none; border-radius: 12px; padding: 15px; font-size: 18px; font-weight: 800; cursor: pointer; margin-bottom: 12px; text-align: center; text-decoration: none; }
    button:last-child, .btn-link:last-child { margin-bottom: 0; }
    .btn-blue { background: #0f172a; color: #ffffff; }
    .btn-calc { background: #0284c7; color: #ffffff; }
    .btn-green { background: #15803d; color: #ffffff; }
    .btn-dark { background: #334155; color: #ffffff; }
    .resumo { display: none; background: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .resumo.visivel { display: block; }
    .resumo div { margin-bottom: 8px; font-size: 18px; color: #1e293b; font-weight: 600; }
    .resumo div:last-child { margin-bottom: 0; }
    .resumo strong { color: #0f172a; font-size: 19px; }
    .total { font-size: 26px !important; font-weight: 900; color: #15803d !important; }
    .pix-box { background: #ffffff; border: 2px dashed #0f172a; border-radius: 12px; padding: 14px; margin-top: 12px; }
    .pix-box strong { font-size: 17px; color: #0f172a; }
    .pix-key { font-family: monospace; font-size: 16px; font-weight: 700; word-break: break-all; background: #f1f5f9; padding: 10px; border-radius: 10px; margin: 10px 0; color: #0f172a; border: 1px solid #cbd5e1; }
    .msg { font-size: 16px; font-weight: 700; color: #0284c7; margin-top: 8px; min-height: 22px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="badge">32 DRIVE • Cassino & Rio Grande</span>
    </div>

    <div id="map"></div>

    <label for="pName">Nome do passageiro</label>
    <input id="pName" type="text" placeholder="Ex.: João Silva" oninput="atualizarLinkWhats()" />

    <label for="pPhone">Telefone do passageiro</label>
    <input id="pPhone" type="tel" placeholder="Ex.: 53 99999-9999" oninput="atualizarLinkWhats()" />

    <label for="pickup">Origem (bairro, empresa ou referência)</label>
    <input id="pickup" type="text" placeholder="Ex.: Cassino, Querência, Parque Guanabara, ABC" oninput="limparGpsSeEditar(); atualizarLinkWhats();" />

    <label for="dropoff">Destino (bairro, empresa ou referência)</label>
    <input id="dropoff" type="text" placeholder="Ex.: Parque Marinha, Cidade Nova, Lar Gaúcho, Centro" oninput="atualizarLinkWhats()" />

    <button type="button" class="btn-blue" onclick="usarGPS()">Usar meu GPS</button>
    <button type="button" class="btn-calc" onclick="calcularCorrida()">Calcular corrida</button>

    <div class="resumo" id="boxResumo">
      <div>Distância aprox.: <strong id="distVal">0,00 km</strong></div>
      <div class="total">Valor da viagem: <span id="valorVal">R$ 7,99</span></div>
    </div>

    <a class="btn-link btn-green" id="btnWhats" href="https://wa.me/5553991357231" target="_top" rel="noopener noreferrer">
      Enviar corrida no WhatsApp do motorista
    </a>

    <div class="pix-box">
      <strong>Chave Pix (Banco Inter - Aleatória)</strong>
      <div class="pix-key" id="pixTexto">45bd89b5-9dd7-4cda-8715-789257d06596</div>
      <button type="button" class="btn-dark" onclick="copiarPix()">Copiar chave Pix</button>
      <div class="msg" id="feedbackMsg"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Configura manifest dinâmico para instalação como aplicativo (PWA)
    (function configurarPWA() {
      const iconeSvg = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230f172a'/%3E%3Ctext x='50%25' y='48%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='900' font-size='210' fill='%23ffffff'%3E32%3C/text%3E%3Ctext x='50%25' y='73%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,-apple-system,sans-serif' font-weight='800' font-size='54' letter-spacing='6' fill='%23ffffff'%3EDRIVE%3C/text%3E%3C/svg%3E";
      const manifestObj = {
        name: "32 Drive",
        short_name: "32 Drive",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#ffffff",
        theme_color: "#0f172a",
        icons: [
          { src: iconeSvg, sizes: "192x192", type: "image/svg+xml" },
          { src: iconeSvg, sizes: "512x512", type: "image/svg+xml" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifestObj)], { type: "application/manifest+json" });
      document.getElementById("pwaManifest").setAttribute("href", URL.createObjectURL(blob));
    })();

    const CHAVE_PIX_INTER = "45bd89b5-9dd7-4cda-8715-789257d06596";
    const WHATS_MOTORISTA = "5553991357231";

    document.getElementById("pixTexto").textContent = CHAVE_PIX_INTER;

    const map = L.map("map").setView([-32.1400, -52.1450], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    let marcadorOrigem = null;
    let marcadorDestino = null;
    let linhaRota = null;
    let distanciaAtual = 0;
    let valorAtual = 7.99;
    let coordsOrigem = null;
    let corridaCalculada = false;

    const PONTOS_REAIS = [
      // Bairros e pontos do Cassino
      { chaves: ["parque guanabara", "pq guanabara"], lat: -32.1745, lon: -52.1710, nome: "Parque Guanabara (Cassino)" },
      { chaves: ["abc", "bairro abc"], lat: -32.1775, lon: -52.1755, nome: "Bairro ABC (Cassino)" },
      { chaves: ["querencia", "querência"], lat: -32.1610, lon: -52.1695, nome: "Bairro Querência" },
      { chaves: ["bolaxa"], lat: -32.1480, lon: -52.1730, nome: "Bolaxa" },
      { chaves: ["senandes"], lat: -32.2150, lon: -52.1850, nome: "Senandes" },
      { chaves: ["barracao", "barracão"], lat: -32.1700, lon: -52.1745, nome: "Barracão (Cassino)" },
      { chaves: ["supermercado cassino", "mercado cassino"], lat: -32.1815, lon: -52.1635, nome: "Supermercado Cassino" },
      { chaves: ["guanabara"], lat: -32.1856, lon: -52.1656, nome: "Supermercado Guanabara (Cassino)" },
      { chaves: ["peruzzo"], lat: -32.1818, lon: -52.1628, nome: "Peruzzo (Cassino)" },
      { chaves: ["terminal cassino", "terminal"], lat: -32.1805, lon: -52.1670, nome: "Terminal Cassino" },
      { chaves: ["beira mar", "beira-mar", "praia", "iemanja", "iemanjá", "molhes"], lat: -32.1890, lon: -52.1580, nome: "Beira-Mar Cassino" },
      { chaves: ["av rio grande", "av. rio grande", "avenida rio grande"], lat: -32.1830, lon: -52.1640, nome: "Av. Rio Grande (Cassino)" },
      { chaves: ["cassino", "balneario", "balneário"], lat: -32.1825, lon: -52.1645, nome: "Balneário Cassino" },

      // Barra / Quarta Secção da Barra / Empresas Portuárias
      { chaves: ["quarta seccao", "4 seccao", "4ª seccao", "quarta seção", "4 seção", "4ª seção", "barra"], lat: -32.1420, lon: -52.1040, nome: "Quarta Secção da Barra" },
      { chaves: ["termasa"], lat: -32.1140, lon: -52.1075, nome: "Termasa" },
      { chaves: ["tergrasa"], lat: -32.1115, lon: -52.1070, nome: "Tergrasa" },
      { chaves: ["tecon", "terminal de conteineres", "conteineres", "contêineres"], lat: -32.1210, lon: -52.1085, nome: "Tecon Rio Grande" },
      { chaves: ["bianchini"], lat: -32.1050, lon: -52.1120, nome: "Bianchini" },
      { chaves: ["superporto", "distrito industrial"], lat: -32.1150, lon: -52.1100, nome: "Superporto / Distrito Industrial" },
      { chaves: ["porto de rio grande", "porto novo", "porto"], lat: -32.0460, lon: -52.0780, nome: "Porto de Rio Grande" },

      // Bairros cadastrados de Rio Grande
      { chaves: ["parque sao pedro", "parque são pedro"], lat: -32.0810, lon: -52.1540, nome: "Parque São Pedro" },
      { chaves: ["sao pedro", "são pedro"], lat: -32.0790, lon: -52.1510, nome: "Bairro São Pedro" },
      { chaves: ["parque marinha", "marinha"], lat: -32.0750, lon: -52.1420, nome: "Parque Marinha" },
      { chaves: ["furg", "pavilhao", "pavilhão", "carreiros", "universidade"], lat: -32.0736, lon: -52.1670, nome: "FURG Carreiros" },
      { chaves: ["trevo"], lat: -32.0720, lon: -52.1480, nome: "Trevo Rio Grande" },
      { chaves: ["unicir", "vila unicir"], lat: -32.0650, lon: -52.1380, nome: "Vila Unicir" },
      { chaves: ["cidade nova"], lat: -32.0540, lon: -52.1180, nome: "Cidade Nova" },
      { chaves: ["sao joao", "são joão"], lat: -32.0560, lon: -52.1260, nome: "Bairro São João" },
      { chaves: ["sao miguel", "são miguel"], lat: -32.0590, lon: -52.1320, nome: "Bairro São Miguel" },
      { chaves: ["profilurb"], lat: -32.0620, lon: -52.1360, nome: "Bairro Profilurb" },
      { chaves: ["lar gaucho", "lar gaúcho"], lat: -32.0580, lon: -52.1140, nome: "Lar Gaúcho" },
      { chaves: ["santa rosa"], lat: -32.0480, lon: -52.1250, nome: "Santa Rosa" },
      { chaves: ["castelo branco"], lat: -32.0460, lon: -52.1190, nome: "Castelo Branco" },
      { chaves: ["vila santa tereza", "santa tereza", "santa teresa"], lat: -32.0420, lon: -52.1080, nome: "Vila Santa Tereza" },
      { chaves: ["navegantes"], lat: -32.0310, lon: -52.0890, nome: "Bairro Navegantes" },
      { chaves: ["getulio", "getúlio", "bgv"], lat: -32.0510, lon: -52.1090, nome: "Getúlio Vargas" },
      { chaves: ["av pelotas", "av. pelotas", "avenida pelotas"], lat: -32.0430, lon: -52.1120, nome: "Av. Pelotas (Rio Grande)" },
      { chaves: ["laranjeiras"], lat: -32.0880, lon: -52.1490, nome: "Laranjeiras" },
      { chaves: ["quinta"], lat: -32.0050, lon: -52.2350, nome: "Vila da Quinta" },
      { chaves: ["centro", "silva paes", "marechal floriano", "alfandega", "alfândega", "praca", "praça"], lat: -32.0352, lon: -52.0986, nome: "Centro Rio Grande" }
    ];

    function setMsg(texto) {
      document.getElementById("feedbackMsg").textContent = texto;
    }

    function limparGpsSeEditar() {
      const val = document.getElementById("pickup").value;
      if (!val.startsWith("GPS (")) {
        coordsOrigem = null;
      }
    }

    function calcularTarifa(km) {
      const limpo = Math.max(0, Number(km) || 0);
      let base = limpo <= 3.5 ? 7.99 : limpo * 2.0;
      const hora = new Date().getHours();
      const noturno = hora >= 20 || hora < 6;
      if (noturno) {
        base = base * 1.25;
      }
      return {
        km: limpo,
        valor: Number(base.toFixed(2))
      };
    }

    function atualizarLinkWhats() {
      const nome = document.getElementById("pName").value.trim() || "Não informado";
      const tel = document.getElementById("pPhone").value.trim() || "Não informado";
      const origem = document.getElementById("pickup").value.trim() || "Não informado";
      const destino = document.getElementById("dropoff").value.trim() || "Não informado";
      const valorFmt = "R$ " + valorAtual.toFixed(2).replace(".", ",");
      const distFmt = distanciaAtual.toFixed(2).replace(".", ",") + " km";

      const linhas = [
        "*NOVA CORRIDA - 32 DRIVE*",
        `Passageiro: ${nome}`,
        `Telefone: ${tel}`,
        `Origem: ${origem}`,
        `Destino: ${destino}`
      ];

      if (corridaCalculada) {
        linhas.push(`Distância aprox.: ${distFmt}`);
        linhas.push(`Valor: ${valorFmt}`);
      }

      linhas.push(`Pix Inter: ${CHAVE_PIX_INTER}`);

      document.getElementById("btnWhats").href = `https://wa.me/${WHATS_MOTORISTA}?text=${encodeURIComponent(linhas.join("\n"))}`;
    }

    function atualizarTela() {
      const calc = calcularTarifa(distanciaAtual);
      distanciaAtual = calc.km;
      valorAtual = calc.valor;
      document.getElementById("distVal").textContent = calc.km.toFixed(2).replace(".", ",") + " km";
      document.getElementById("valorVal").textContent = "R$ " + calc.valor.toFixed(2).replace(".", ",");
      if (corridaCalculada) {
        document.getElementById("boxResumo").classList.add("visivel");
      }
      atualizarLinkWhats();
    }

    function distanciaLinhaRetaKm(a, b) {
      const R = 6371;
      const dLat = ((b.lat - a.lat) * Math.PI) / 180;
      const dLon = ((b.lon - a.lon) * Math.PI) / 180;
      const lat1 = (a.lat * Math.PI) / 180;
      const lat2 = (b.lat * Math.PI) / 180;
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function removerAcentos(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    async function buscarRuaNoMapa(textoOriginal) {
      const semNum = textoOriginal
        .replace(/\(.*?\)/g, " ")
        .replace(/\b(n[úu]mero|n[ºo°]|prox|pr[óo]ximo|ao lado|frente|ref)\b.*$/i, " ")
        .replace(/,\s*\d+\b/g, " ")
        .replace(/\s+\d+\b/g, " ")
        .trim();

      const consulta = semNum.toLowerCase().includes("rio grande")
        ? `${semNum}, RS, Brasil`
        : `${semNum}, Rio Grande, RS, Brasil`;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1&viewbox=-52.26,-31.98,-52.05,-32.25&q=${encodeURIComponent(consulta)}`;
        const resp = await fetch(url);
        if (resp.ok) {
          const dados = await resp.json();
          if (Array.isArray(dados) && dados.length > 0) {
            return {
              lat: parseFloat(dados[0].lat),
              lon: parseFloat(dados[0].lon),
              nome: textoOriginal
            };
          }
        }
      } catch (e) {}
      return null;
    }

    async function resolverEndereco(texto) {
      const limpo = (texto || "").trim();
      const matchGps = limpo.match(/GPS\s*\(\s*([-\d.]+)\s*,\s*([-\d.]+)\s*\)/i);
      if (matchGps) {
        return { lat: parseFloat(matchGps[1]), lon: parseFloat(matchGps[2]), nome: "Meu GPS" };
      }

      const norm = removerAcentos(limpo);

      for (const ponto of PONTOS_REAIS) {
        if (ponto.chaves.some(k => norm.includes(removerAcentos(k)))) {
          return { lat: ponto.lat, lon: ponto.lon, nome: ponto.nome };
        }
      }

      const achouRua = await buscarRuaNoMapa(limpo);
      if (achouRua) {
        return achouRua;
      }

      if (norm.includes("cassino")) {
        return { lat: -32.1830, lon: -52.1640, nome: "Balneário Cassino" };
      }

      return { lat: -32.1820, lon: -52.1650, nome: limpo };
    }

    async function calcularCorrida() {
      const origemTexto = document.getElementById("pickup").value.trim();
      const destinoTexto = document.getElementById("dropoff").value.trim();

      if (!origemTexto || !destinoTexto) {
        setMsg("Preencha origem e destino antes de apertar Calcular corrida.");
        return;
      }

      setMsg("Localizando pontos e calculando...");

      const pOrigem = coordsOrigem ? { ...coordsOrigem, nome: "Meu GPS" } : await resolverEndereco(origemTexto);
      const pDestino = await resolverEndereco(destinoTexto);

      if (marcadorOrigem) map.removeLayer(marcadorOrigem);
      if (marcadorDestino) map.removeLayer(marcadorDestino);
      if (linhaRota) map.removeLayer(linhaRota);

      marcadorOrigem = L.marker([pOrigem.lat, pOrigem.lon]).addTo(map).bindPopup(`Origem: ${pOrigem.nome}`);
      marcadorDestino = L.marker([pDestino.lat, pDestino.lon]).addTo(map).bindPopup(`Destino: ${pDestino.nome}`);

      linhaRota = L.polyline(
        [[pOrigem.lat, pOrigem.lon], [pDestino.lat, pDestino.lon]],
        { color: "#0f172a", weight: 5, dashArray: "8, 6" }
      ).addTo(map);

      map.fitBounds(linhaRota.getBounds(), { padding: [35, 35] });

      const retaKm = distanciaLinhaRetaKm(pOrigem, pDestino);
      let kmFinal = retaKm * 1.22;

      if (kmFinal < 0.8) {
        kmFinal = 1.0;
      }

      distanciaAtual = Number(kmFinal.toFixed(2));
      corridaCalculada = true;
      atualizarTela();
      setMsg(`${pOrigem.nome} → ${pDestino.nome}`);
    }

    function usarGPS() {
      if (!navigator.geolocation) {
        setMsg("GPS não disponível neste aparelho.");
        return;
      }
      setMsg("Buscando localização pelo GPS...");
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          coordsOrigem = { lat: latitude, lon: longitude };
          document.getElementById("pickup").value = `GPS (${latitude.toFixed(5)}, ${longitude.toFixed(5)})`;
          map.setView([latitude, longitude], 14);
          atualizarLinkWhats();
          setMsg("GPS capturado! Digite o destino e toque em Calcular corrida.");
        },
        () => {
          setMsg("GPS indisponível. Digite origem e destino e toque em Calcular corrida.");
        }
      );
    }

    async function copiarPix() {
      const chave = CHAVE_PIX_INTER.trim();
      try {
        await navigator.clipboard.writeText(chave);
        setMsg("Chave Pix do Banco Inter copiada!");
      } catch (e) {
        const temp = document.createElement("textarea");
        temp.value = chave;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        setMsg("Chave Pix copiada para a área de transferência.");
      }
    }

    atualizarLinkWhats();
  </script>
</body>
</html>
