<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b192c" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Motorista</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 70%, #0c1e38 100%);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #f59e0b;
      --green: #059669;
      --red: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.45;
    }
    header {
      background: var(--navy-header);
      border-bottom: 3px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 2px solid var(--accent);
      background: #ffffff;
    }
    h1 { font-size: 20px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #dbeafe; }
    .badge {
      background: var(--accent);
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #f59e0b;
      color: #78350f;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .card-title { font-size: 19px; font-weight: 900; color: #0f172a; }
    label { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; display: block; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #94a3b8;
      background: #ffffff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-primary { background: #0b192c; color: #ffffff; }
    .btn-green { background: #10b981; color: #052e16; }
    .btn-accent { background: var(--accent); color: #0f172a; }
    .status-msg { font-size: 16px; font-weight: 800; color: #047857; text-align: center; min-height: 20px; }
    .corrida-card {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 DRIVE — Motorista</h1>
        <div class="subtitle">Aceitar Corridas • Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <span class="badge" id="badge-motorista">Offline</span>
  </header>

  <main>
    <div class="aviso-firebase" id="aviso-firebase"></div>

    <section class="card">
      <div class="card-title">Identificação do Motorista</div>
      <div>
        <label for="mot-codigo">Seu Código de Motorista</label>
        <input id="mot-codigo" type="text" placeholder="Ex: MOT-01" />
      </div>
      <div>
        <label for="mot-nome">Seu Nome</label>
        <input id="mot-nome" type="text" placeholder="Ex: Junior Costa" />
      </div>
      <div>
        <label for="mot-veiculo">Veículo e Placa</label>
        <input id="mot-veiculo" type="text" placeholder="Ex: VW Voyage 2010 • IQD8060" />
      </div>
      <button class="btn btn-green" type="button" id="btn-ficar-online">
        Ficar Online para Corridas
      </button>
      <div class="status-msg" id="msg-motorista"></div>
    </section>

    <section class="card">
      <div class="card-title">Corridas Disponíveis</div>
      <div id="lista-corridas-motorista" style="display:flex;flex-direction:column;gap:12px;">
        <div class="corrida-card" style="color:var(--muted);">
          Nenhuma corrida disponível no momento.
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    const badgeMotorista = document.getElementById("badge-motorista");
    const avisoFirebase = document.getElementById("aviso-firebase");
    const msgMotorista = document.getElementById("msg-motorista");
    const listaCorridasEl = document.getElementById("lista-corridas-motorista");

    let db = null;
    let fs = null;
    let online = false;

    function mostrarAvisoFirebase(texto) {
      if (!avisoFirebase) return;
      avisoFirebase.textContent = texto;
      avisoFirebase.style.display = texto ? "block" : "none";
    }

    function formatarMoeda(valor) {
      return "R$ " + Number(valor || 0).toFixed(2).replace(".", ",");
    }

    function alternarOnline() {
      const codigo = (document.getElementById("mot-codigo").value || "").trim().toUpperCase();
      const nome = (document.getElementById("mot-nome").value || "").trim();
      if (!codigo || !nome) {
        msgMotorista.textContent = "Preencha seu Código e Nome para ficar online.";
        return;
      }
      online = !online;
      badgeMotorista.textContent = online ? "Online" : "Offline";
      badgeMotorista.style.background = online ? "#10b981" : "#f59e0b";
      badgeMotorista.style.color = online ? "#052e16" : "#0f172a";
      document.getElementById("btn-ficar-online").textContent = online
        ? "Ficar Offline"
        : "Ficar Online para Corridas";
      msgMotorista.textContent = online
        ? "Você está ONLINE como " + nome + " (" + codigo + ")."
        : "Você ficou OFFLINE.";
    }

    function renderizarCorridas(itens) {
      if (!itens.length) {
        listaCorridasEl.innerHTML =
          '<div class="corrida-card" style="color:var(--muted);">Nenhuma corrida disponível no momento.</div>';
        return;
      }
      listaCorridasEl.innerHTML = itens
        .map((c) => {
          const bruto = Number(c.valorBruto || 0);
          return (
            '<div class="corrida-card">' +
            "<div><strong>" + (c.codigo || "Corrida") + " • " + (c.passageiro || "Passageiro") + "</strong> — <strong>" + formatarMoeda(bruto) + "</strong></div>" +
            "<div><strong>Embarque:</strong> " + (c.origem || "—") + "<br/><strong>Destino:</strong> " + (c.destino || "—") + "<br/><strong>Pagamento:</strong> " + (c.pagamento || "Pix") + " • <strong>Status:</strong> " + (c.status || "Aguardando") + "</div>" +
            '<button class="btn btn-accent" type="button" data-aceitar="' + c.docId + '">Aceitar Corrida</button>' +
            "</div>"
          );
        })
        .join("");
    }

    async function aceitarCorrida(docId) {
      if (!db || !fs || !docId) {
        msgMotorista.textContent = "Conecte o firebase-config.js para aceitar corridas na nuvem.";
        return;
      }
      const nome = (document.getElementById("mot-nome").value || "Motorista 32 Drive").trim();
      const veiculo = (document.getElementById("mot-veiculo").value || "Veículo 32 Drive").trim();
      await fs.updateDoc(fs.doc(db, "corridas", docId), {
        status: "Motorista a caminho",
        motorista: { nome, veiculo, placa: "32D" }
      });
      msgMotorista.textContent = "Corrida aceita com sucesso!";
    }

    document.getElementById("btn-ficar-online").addEventListener("click", alternarOnline);
    listaCorridasEl.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-aceitar]");
      if (!btn) return;
      aceitarCorrida(btn.getAttribute("data-aceitar"));
    });

    try {
      const configModulo = await import("./firebase-config.js");
      fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      db = configModulo.db;
      if (!db) throw new Error("db não exportado");

      mostrarAvisoFirebase("");
      fs.onSnapshot(fs.collection(db, "corridas"), (snapshot) => {
        const itens = [];
        snapshot.forEach((docSnap) => {
          const dados = docSnap.data();
          if (dados.status === "Aguardando motorista") {
            itens.push({ docId: docSnap.id, ...dados });
          }
        });
        renderizarCorridas(itens);
      });
    } catch (erro) {
      console.error(erro);
      mostrarAvisoFirebase(
        "Painel do Motorista carregado. O arquivo firebase-config.js ainda não foi encontrado no repositório."
      );
    }
  </script>
</body>
</html>
