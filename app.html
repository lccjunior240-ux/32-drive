<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.json?v=39" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Entrega — Entregador V39</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8fafc;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 75%, #0c1e38 100%);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #334155;
      --accent: #f59e0b;
      --green: #047857;
      --blue: #0369a1;
      --red: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.45;
    }
    header {
      background: var(--navy-header);
      border-bottom: 3px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 2px solid var(--accent);
      background: #ffffff;
      flex-shrink: 0;
    }
    h1 { font-size: 19px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 14px; color: #e2e8f0; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .badge {
      background: #10b981;
      color: #052e16;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .btn-colar-topo {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-colar-topo:active {
      background: var(--accent);
      color: #0f172a;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .box-colar-rapido {
      display: none;
      background: #f8fafc;
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 12px;
      flex-direction: column;
      gap: 8px;
    }
    .box-colar-rapido.ativo { display: flex; }
    .box-colar-rapido textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #64748b;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      font-family: monospace;
      resize: vertical;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #d97706;
      color: #78350f;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
    }
    .diag-box {
      background: #0f172a;
      color: #f8fafc;
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: monospace;
      word-break: break-all;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-title { font-size: 19px; font-weight: 900; color: #0f172a; }
    label { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; display: block; }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #64748b;
      background: #ffffff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
    }
    input::placeholder { color: #64748b; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modo-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-modo {
      padding: 11px 12px;
      border-radius: 10px;
      border: 2px solid #64748b;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-modo.ativo {
      background: var(--accent);
      border-color: #b45309;
      color: #0f172a;
    }
    .minutos-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn-min {
      padding: 11px 8px;
      border-radius: 10px;
      border: 2px solid #64748b;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-min.ativo {
      background: var(--accent);
      border-color: #b45309;
      color: #0f172a;
    }
    .tabela-valores-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn-valor-rapido {
      padding: 10px 6px;
      border-radius: 10px;
      border: 2px solid #b91c1c;
      background: #ffffff;
      color: #b91c1c;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-valor-rapido.pendente {
      background: #dc2626;
      border-color: #991b1b;
      color: #ffffff;
    }
    .btn-valor-rapido.enviado {
      background: #059669;
      border-color: #047857;
      color: #ffffff;
    }
    .status-envio-valor {
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 900;
      font-size: 15px;
      text-align: center;
    }
    .status-envio-valor.vermelho {
      background: #fef2f2;
      border: 2px solid #dc2626;
      color: #991b1b;
    }
    .status-envio-valor.verde {
      background: #ecfdf5;
      border: 2px solid #059669;
      color: #064e3b;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-sm {
      padding: 9px 12px;
      font-size: 14px;
      width: auto;
    }
    .btn-primary { background: #1e293b; color: #ffffff; border: 2px solid #0f172a; }
    .btn-green { background: #059669; color: #ffffff; }
    .btn-accent { background: var(--accent); color: #0f172a; border: 2px solid #b45309; }
    .btn-blue { background: var(--blue); color: #ffffff; }
    .btn-danger { background: var(--red); color: #ffffff; }
    .btn-outline { background: #ffffff; color: #0f172a; border: 2px solid #64748b; }
    .status-msg { font-size: 16px; font-weight: 800; color: #047857; text-align: center; min-height: 20px; }
    .corrida-card {
      background: #ffffff;
      border: 2px solid #94a3b8;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #0f172a;
    }
    .corrida-ativa {
      background: #ecfdf5;
      border: 2px solid #059669;
      color: #064e3b;
    }
    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      background: #e2e8f0;
      color: #0f172a;
    }
    .valor-destaque {
      font-size: 22px;
      font-weight: 900;
      color: #b91c1c;
    }
    .valor-destaque.enviado {
      color: #047857;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Entrega" />
      <div>
        <h1>32 Entrega — Entregador</h1>
        <div class="subtitle">V39 • Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-colar-topo" type="button" id="btn-colar-topo" onclick="window.acionarColarTopoV39 && window.acionarColarTopoV39()" title="Colar texto ou código">
        <span>📥</span>
        <span id="txt-colar-topo">Colar</span>
      </button>
      <span class="badge" id="badge-motorista">Ativo</span>
    </div>
  </header>

  <main>
    <div class="diag-box" id="diag-v39">Diag V39: aguardando conexão...</div>

    <div class="box-colar-rapido" id="box-colar-rapido">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <strong style="font-size:15px;color:#b45309;">Área para Colar</strong>
        <button class="btn btn-outline btn-sm" type="button" id="btn-fechar-colar" onclick="window.fecharBoxColarV39 && window.fecharBoxColarV39()">Fechar</button>
      </div>
      <textarea id="area-colar-texto" placeholder="Cole aqui o texto ou código da área de transferência..."></textarea>
    </div>

    <div class="aviso-firebase" id="aviso-firebase"></div>

    <section class="card">
      <div class="card-header">
        <div class="card-title">Alerta Sonoro (Bip de Mensagem)</div>
        <button class="btn btn-blue btn-sm" type="button" id="btn-testar-bip" onclick="window.testarBipV39 && window.testarBipV39()">
          🔔 Testar Bip
        </button>
      </div>
      <div id="status-som-bip" style="font-size:15px;font-weight:700;color:var(--muted);">
        Emite um bip sonoro quando chega mensagem ou atualização do cliente. Toque em "Testar Bip" para liberar o áudio.
      </div>
    </section>

    <section class="card">
      <div class="card-title">Identificação &amp; Pix do Entregador</div>
      <div class="grid-2">
        <div>
          <label for="mot-codigo">Código</label>
          <input id="mot-codigo" type="text" placeholder="Ex: ENT-01" />
        </div>
        <div>
          <label for="mot-placa">Placa</label>
          <input id="mot-placa" type="text" placeholder="Ex: IQD8060" />
        </div>
      </div>
      <div>
        <label for="mot-nome">Nome do Entregador</label>
        <input id="mot-nome" type="text" placeholder="Ex: Junior Costa" />
      </div>
      <div class="grid-2">
        <div>
          <label for="mot-modalidade">Modalidade</label>
          <select id="mot-modalidade">
            <option value="Carro">Carro</option>
            <option value="Moto">Moto</option>
            <option value="Bike / Utilitário">Bike / Utilitário</option>
          </select>
        </div>
        <div>
          <label for="mot-veiculo">Veículo</label>
          <input id="mot-veiculo" type="text" placeholder="Ex: VW Voyage 1.0 Prata" />
        </div>
      </div>
      <div>
        <label for="mot-pix">Sua Chave Pix</label>
        <input id="mot-pix" type="text" placeholder="CPF, celular, e-mail ou chave aleatória" />
        <button class="btn btn-blue" style="margin-top:8px;" type="button" id="btn
