<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b192c" />
  <link rel="manifest" href="manifest-passageiro.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Passageiro</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 70%, #0c1e38 100%);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #f59e0b;
      --green: #059669;
      --blue: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.45;
    }
    header {
      background: var(--navy-header);
      border-bottom: 3px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 2px solid var(--accent);
      background: #ffffff;
    }
    h1 { font-size: 20px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #dbeafe; }
    .badge {
      background: var(--accent);
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #f59e0b;
      color: #78350f;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .card-title { font-size: 19px; font-weight: 900; color: #0f172a; }
    label { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; display: block; }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #94a3b8;
      background: #ffffff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chuva-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #f0f9ff;
      border: 2px solid #7dd3fc;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .chuva-toggle.ativo {
      background: #0284c7;
      border-color: #0369a1;
      color: #ffffff;
    }
    .chuva-toggle input {
      width: 22px;
      height: 22px;
      accent-color: #0b192c;
    }
    .estimativa-box {
      background: #f1f5f9;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .estimativa-lbl { font-size: 15px; font-weight: 800; color: #0f172a; }
    .estimativa-val { font-size: 26px; font-weight: 900; color: var(--green); }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-accent { background: var(--accent); color: #0f172a; }
    .status-msg { font-size: 16px; font-weight: 800; color: #047857; text-align: center; min-height: 20px; }
    .corrida-box {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 DRIVE — Passageiro</h1>
        <div class="subtitle">Pedir Corrida • Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <span class="badge" id="badge-passageiro">Passageiro</span>
  </header>

  <main>
    <div class="aviso-firebase" id="aviso-firebase"></div>

    <section class="card">
      <div class="card-title">Solicitar Corrida</div>

      <div>
        <label for="pas-nome">Seu Nome</label>
        <input id="pas-nome" type="text" placeholder="Ex: Maria Clara" />
      </div>

      <div>
        <label for="pas-origem">Ponto de Embarque (Origem)</label>
        <input id="pas-origem" type="text" placeholder="Ex: Av. Rio Grande, 450 — Cassino" />
      </div>

      <div>
        <label for="pas-destino">Destino</label>
        <input id="pas-destino" type="text" placeholder="Ex: Centro — Rio Grande" />
      </div>

      <div class="grid-2">
        <div>
          <label for="pas-distancia">Distância (km)</label>
          <input id="pas-distancia" type="number" min="0.5" max="150" step="0.1" value="3.5" />
        </div>
        <div>
          <label for="pas-pagamento">Pagamento</label>
          <select id="pas-pagamento">
            <option value="Pix">Pix</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Cartão">Cartão</option>
          </select>
        </div>
      </div>

      <label class="chuva-toggle" id="box-chuva-toggle" for="pas-chuva">
        <div>
          <strong>Adicional Dia de Chuva (+25%)</strong>
          <div style="font-size:14px;opacity:0.9;" id="txt-chuva-status">Desativado (tarifa normal)</div>
        </div>
        <input id="pas-chuva" type="checkbox" />
      </label>

      <div class="estimativa-box">
        <div>
          <div class="estimativa-lbl">Valor da Corrida</div>
          <div id="detalhe-tarifa" style="font-size:14px;color:var(--muted);">Até 3,5 km: fixo R$ 7,99</div>
        </div>
        <div class="estimativa-val" id="pas-valor-estimado">R$ 7,99</div>
      </div>

      <button class="btn btn-accent" type="button" id="btn-solicitar-corrida">
        Chamar Motorista
      </button>
      <div class="status-msg" id="msg-passageiro"></div>
    </section>

    <section class="card">
      <div class="card-title">Acompanhamento da Corrida</div>
      <div id="box-corrida-ativa" class="corrida-box">
        Nenhuma corrida solicitada ainda.
      </div>
    </section>
  </main>

  <script type="module">
    const badgePassageiro = document.getElementById("badge-passageiro");
    const avisoFirebase = document.getElementById("aviso-firebase");
    const msgPassageiro = document.getElementById("msg-passageiro");
    const boxCorridaAtiva = document.getElementById("box-corrida-ativa");
    const elDistancia = document.getElementById("pas-distancia");
    const elChuva = document.getElementById("pas-chuva");
    const boxChuvaToggle = document.getElementById("box-chuva-toggle");
    const txtChuvaStatus = document.getElementById("txt-chuva-status");
    const elValorEstimado = document.getElementById("pas-valor-estimado");
    const elDetalheTarifa = document.getElementById("detalhe-tarifa");

    let db = null;
    let fs = null;
    let corridaAtualId = localStorage.getItem("32drive_corrida_id") || "";

    function mostrarAvisoFirebase(texto) {
      if (!avisoFirebase) return;
      avisoFirebase.textContent = texto;
      avisoFirebase.style.display = texto ? "block" : "none";
    }

    function formatarMoeda(valor) {
      return "R$ " + Number(valor || 0).toFixed(2).replace(".", ",");
    }

    function atualizarVisualChuva(ativo) {
      elChuva.checked = Boolean(ativo);
      boxChuvaToggle.classList.toggle("ativo", Boolean(ativo));
      txtChuvaStatus.textContent = ativo
        ? "Ativo: +25% aplicado no valor"
        : "Desativado (tarifa normal)";
    }

    function calcularEstimativa() {
      const textoKm = String(elDistancia.value || "").replace(",", ".");
      const km = Math.max(0.1, Number(textoKm) || 0);
      const chuvaAtiva = Boolean(elChuva.checked);

      let baseValor = 0;
      let regraTexto = "";

      if (km <= 3.5) {
        baseValor = 7.99;
        regraTexto = km.toFixed(1).replace(".", ",") + " km • Fixo até 3,5 km";
      } else {
        baseValor = km * 2.0;
        regraTexto = km.toFixed(1).replace(".", ",") + " km × R$ 2,00/km";
      }

      const total = chuvaAtiva ? baseValor * 1.25 : baseValor;
      const arredondado = Number(total.toFixed(2));

      elValorEstimado.textContent = formatarMoeda(arredondado);
      elDetalheTarifa.textContent = chuvaAtiva
        ? regraTexto + " + 25% chuva"
        : regraTexto;

      return arredondado;
    }

    function renderizarCorrida(c) {
      if (!c) {
        boxCorridaAtiva.innerHTML = "Nenhuma corrida solicitada ainda.";
        return;
      }
      const motTexto = c.motorista && c.motorista.nome
        ? c.motorista.nome + " • " + (c.motorista.veiculo || "") + " (" + (c.motorista.placa || "") + ")"
        : "Aguardando motorista aceitar...";

      boxCorridaAtiva.innerHTML =
        "<div><strong>Código:</strong> " + (c.codigo || "—") + " • <strong>Status:</strong> " + (c.status || "Solicitada") + "</div>" +
        "<div><strong>Passageiro:</strong> " + (c.passageiro || "—") + " • <strong>Valor:</strong> " + formatarMoeda(c.valorBruto) + "</div>" +
        "<div><strong>Trecho:</strong> " + (c.origem || "—") + " → " + (c.destino || "—") + "</div>" +
        "<div><strong>Pagamento:</strong> " + (c.pagamento || "Pix") + "</div>" +
        "<div><strong>Motorista:</strong> " + motTexto + "</div>";
    }

    async function solicitarCorrida() {
      const nome = (document.getElementById("pas-nome").value || "").trim();
      const origem = (document.getElementById("pas-origem").value || "").trim();
      const destino = (document.getElementById("pas-destino").value || "").trim();
      const pagamento = document.getElementById("pas-pagamento").value || "Pix";
      const valorBruto = calcularEstimativa();

      if (!nome || !origem || !destino) {
        msgPassageiro.textContent = "Preencha seu nome, embarque e destino.";
        return;
      }

      const codigo = "32D-" + Math.floor(1000 + Math.random() * 9000);
      const corridaLocal = {
        codigo,
        passageiro: nome,
        origem,
        destino,
        pagamento,
        valorBruto,
        chuva: Boolean(elChuva.checked),
        status: "Aguardando motorista",
        motorista: null,
        criadoEmTimestamp: Date.now()
      };

      renderizarCorrida(corridaLocal);

      if (!db || !fs) {
        msgPassageiro.textContent = "Simulação local exibida. Configure o firebase-config.js para enviar ao motorista.";
        return;
      }

      try {
        msgPassageiro.textContent = "Enviando solicitação...";
        const docRef = await fs.addDoc(fs.collection(db, "corridas"), {
          ...corridaLocal,
          criadoEm: fs.serverTimestamp()
        });
        corridaAtualId = docRef.id;
        localStorage.setItem("32drive_corrida_id", corridaAtualId);
        msgPassageiro.textContent = "Corrida " + codigo + " enviada com sucesso!";
        observarCorridaAtual();
      } catch (erro) {
        console.error(erro);
        msgPassageiro.textContent = "Erro ao enviar corrida para a nuvem.";
      }
    }

    function observarCorridaAtual() {
      if (!db || !fs || !corridaAtualId) return;
      fs.onSnapshot(fs.doc(db, "corridas", corridaAtualId), (snap) => {
        if (snap.exists()) {
          renderizarCorrida(snap.data());
        }
      });
    }

    elDistancia.addEventListener("input", calcularEstimativa);
    elDistancia.addEventListener("change", calcularEstimativa);
    elChuva.addEventListener("change", () => {
      atualizarVisualChuva(elChuva.checked);
      calcularEstimativa();
    });
    document.getElementById("btn-solicitar-corrida").addEventListener("click", solicitarCorrida);

    atualizarVisualChuva(false);
    calcularEstimativa();

    try {
      const configModulo = await import("./firebase-config.js");
      fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      db = configModulo.db;
      if (!db) throw new Error("db não exportado");

      badgePassageiro.textContent = "Online";
      mostrarAvisoFirebase("");

      fs.onSnapshot(fs.doc(db, "config", "geral"), (snap) => {
        const chuvaGlobal = snap.exists() ? Boolean(snap.data().chuva) : false;
        atualizarVisualChuva(chuvaGlobal);
        calcularEstimativa();
      });

      observarCorridaAtual();
    } catch (erro) {
      console.error(erro);
      badgePassageiro.textContent = "Passageiro";
      mostrarAvisoFirebase(
        "Tela do Passageiro carregada. O arquivo firebase-config.js ainda não foi encontrado no repositório."
      );
    }
  </script>
</body>
</html>
