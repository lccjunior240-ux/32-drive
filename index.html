<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
  <meta name="theme-color" content="#0b192c" />
  <link rel="manifest" href="manifest-passageiro.json?v=40" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Entrega — Cliente Inclusivo</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 70%, #0c1e38 100%);
      --border: #94a3b8;
      --text: #0f172a;
      --muted: #334155;
      --accent: #f59e0b;
      --green: #047857;
      --blue: #0369a1;
      --f-base: 19px;
      --f-label: 18px;
      --f-btn: 19px;
      --f-title: 22px;
    }
    body.fonte-grande {
      --f-base: 23px;
      --f-label: 22px;
      --f-btn: 22px;
      --f-title: 26px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: var(--f-base);
      line-height: 1.5;
    }
    header {
      background: var(--navy-header);
      border-bottom: 4px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 2px solid var(--accent);
      background: #ffffff;
    }
    h1 { font-size: 21px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #e2e8f0; font-weight: 600; }
    .header-acoes { display: flex; align-items: center; gap: 8px; }
    .btn-acess {
      background: #ffffff;
      color: #0b192c;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-acess.ativo {
      background: var(--accent);
      color: #0f172a;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #d97706;
      color: #78350f;
      border-radius: 14px;
      padding: 14px;
      font-size: var(--f-label);
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-title { font-size: var(--f-title); font-weight: 900; color: #0f172a; }
    label.campo-lbl {
      font-size: var(--f-label);
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 6px;
      display: block;
    }
    input, select {
      width: 100%;
      min-height: 56px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid #475569;
      background: #ffffff;
      color: #0f172a;
      font-size: var(--f-base);
      font-weight: 700;
    }
    .btn-gps {
      margin-top: 8px;
      min-height: 54px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--blue);
      background: #e0f2fe;
      color: #0c4a6e;
      font-size: var(--f-label);
      font-weight: 900;
      cursor: pointer;
      width: 100%;
    }
    .atalhos-rapidos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-atalho {
      padding: 10px 14px;
      border-radius: 999px;
      border: 2px solid #475569;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-atalho:hover, .btn-atalho:focus {
      background: #0b192c;
      color: #ffffff;
      border-color: #0b192c;
    }
    .chuva-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f0f9ff;
      border: 2px solid #0284c7;
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      min-height: 60px;
    }
    .chuva-toggle.ativo {
      background: #0369a1;
      border-color: #0c4a6e;
      color: #ffffff;
    }
    .chuva-toggle input {
      width: 28px;
      height: 28px;
      min-height: 28px;
      accent-color: #0b192c;
    }
    .estimativa-box {
      background: #f1f5f9;
      border: 2px solid #475569;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .estimativa-lbl { font-size: var(--f-label); font-weight: 900; color: #0f172a; }
    .estimativa-val {
      font-size: 26px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
      text-align: right;
    }
    .btn {
      width: 100%;
      min-height: 58px;
      padding: 15px 18px;
      border: none;
      border-radius: 14px;
      font-size: var(--f-btn);
      font-weight: 900;
      cursor: pointer;
    }
    .btn-sm {
      min-height: 46px;
      padding: 10px 14px;
      font-size: 16px;
      width: auto;
    }
    .btn-outline {
      background: #e2e8f0;
      color: #0f172a;
      border: 2px solid #475569;
    }
    .btn-accent {
      background: var(--accent);
      color: #0f172a;
      border: 2px solid #b45309;
    }
    .btn-green {
      background: #059669;
      color: #ffffff;
    }
    .status-msg { font-size: var(--f-label); font-weight: 900; color: var(--green); text-align: center; min-height: 24px; }
    .erro-msg { font-size: var(--f-label); font-weight: 900; color: #b91c1c; text-align: center; min-height: 20px; }
    .corrida-box {
      background: #f8fafc;
      border: 2px solid #64748b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .alerta-aceita {
      background: #dcfce7;
      border: 2px solid #15803d;
      color: #14532d;
      border-radius: 12px;
      padding: 14px;
      font-weight: 900;
      font-size: var(--f-label);
    }
    .chegada-destaque {
      background: #fef3c7;
      border: 2px solid #d97706;
      color: #78350f;
      border-radius: 12px;
      padding: 14px;
      font-weight: 900;
      font-size: var(--f-label);
    }
    .pix-box {
      background: #eff6ff;
      border: 2px solid #1d4ed8;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pix-chave-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: #ffffff;
      border: 2px solid #60a5fa;
      border-radius: 10px;
      padding: 12px;
      font-weight: 900;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Entrega" />
      <div>
        <h1>32 Entrega</h1>
        <div class="subtitle">Inclusivo • Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <div class="header-acoes">
      <button class="btn-acess" type="button" id="btn-fonte-grande" aria-pressed="false">
        Letra A+
      </button>
    </div>
  </header>

  <main>
    <div class="aviso-firebase" id="aviso-firebase"></div>

    <section class="card">
      <div class="card-header">
        <div class="card-title">1. Pedir Entrega</div>
        <button class="btn btn-outline btn-sm" type="button" id="btn-ler-voz">
          Ouvir Resumo
        </button>
      </div>

      <div>
        <label class="campo-lbl" for="pas-nome">Seu Nome (Cliente)</label>
        <input id="pas-nome" type="text" placeholder="Como podemos te chamar?" />
      </div>

      <div>
        <label class="campo-lbl" for="pas-origem">Onde você está agora? (Retirada)</label>
        <input id="pas-origem" type="text" placeholder="Rua, bairro ou toque no botão de localização" />
        <button class="btn-gps" type="button" id="btn-gps-origem">
          Usar Minha Localização Atual (GPS)
        </button>
      </div>

      <div>
        <label class="campo-lbl" for="pas-destino">Para onde vai a entrega?</label>
        <input id="pas-destino" type="text" placeholder="Escolha um lugar rápido abaixo ou digite" />
        <div class="atalhos-rapidos" id="atalhos-destino">
          <button class="btn-atalho" type="button" data-destino="Centro — Rio Grande">Centro</button>
          <button class="btn-atalho" type="button" data-destino="Balneário Cassino — Av. Rio Grande">Cassino</button>
          <button class="btn-atalho" type="button" data-destino="FURG — Campus Carreiros, Rio Grande">FURG</button>
          <button class="btn-atalho" type="button" data-destino="Santa Casa do Rio Grande">Santa Casa</button>
          <button class="btn-atalho" type="button" data-destino="Estação Rodoviária de Rio Grande">Rodoviária</button>
          <button class="btn-atalho" type="button" data-destino="Shopping Praça Rio Grande">Shopping Praça</button>
        </div>
      </div>

      <div>
        <label class="campo-lbl" for="pas-pagamento">Como você vai pagar?</label>
        <select id="pas-pagamento">
          <option value="Pix">Pix</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão">Cartão</option>
        </select>
      </div>

      <label class="chuva-toggle" id="box-chuva-toggle" for="pas-chuva">
        <div>
          <strong>Dia de Chuva (+25%)</strong>
          <div style="font-size:16px;font-weight:700;" id="txt-chuva-status">Tarifa normal</div>
        </div>
        <input id="pas-chuva" type="checkbox" />
      </label>

      <button class="btn btn-outline" type="button" id="btn-calcular-rota">
        Ver Valor da Entrega
      </button>

      <div class="estimativa-box">
        <div>
          <div class="estimativa-lbl">Valor Estimado</div>
          <div id="detalhe-tarifa" style="font-size:16px;font-weight:700;color:var(--muted);">Preencha onde está e para onde vai</div>
        </div>
        <div class="estimativa-val" id="pas-valor-estimado"></div>
      </div>

      <div class="erro-msg" id="erro-rota"></div>

      <button class="btn btn-accent" type="button" id="btn-solicitar-corrida">
        Chamar Entregador
      </button>
      <div class="status-msg" id="msg-passageiro"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-title">2. Sua Entrega</div>
        <button class="btn btn-outline btn-sm" type="button" id="btn-limpar-corrida">
          Limpar Tela
        </button>
      </div>
      <div id="box-corrida-ativa" class="corrida-box">
        Nenhuma entrega solicitada ainda.
      </div>
    </section>
  </main>

  <script type="module">
    const avisoFirebase = document.getElementById("aviso-firebase");
    const msgPassageiro = document.getElementById("msg-passageiro");
    const erroRota = document.getElementById("erro-rota");
    const boxCorridaAtiva = document.getElementById("box-corrida-ativa");
    const elNome = document.getElementById("pas-nome");
    const elOrigem = document.getElementById("pas-origem");
    const elDestino = document.getElementById("pas-destino");
    const elPagamento = document.getElementById("pas-pagamento");
    const elChuva = document.getElementById("pas-chuva");
    const boxChuvaToggle = document.getElementById("box-chuva-toggle");
    const txtChuvaStatus = document.getElementById("txt-chuva-status");
    const elValorEstimado = document.getElementById("pas-valor-estimado");
    const elDetalheTarifa = document.getElementById("detalhe-tarifa");
    const btnCalcularRota = document.getElementById("btn-calcular-rota");
    const btnLimparCorrida = document.getElementById("btn-limpar-corrida");
    const btnGpsOrigem = document.getElementById("btn-gps-origem");
    const btnFonteGrande = document.getElementById("btn-fonte-grande");
    const btnLerVoz = document.getElementById("btn-ler-voz");
    const atalhosDestino = document.getElementById("atalhos-destino");

    let db = null;
    let fs = null;
    let distanciaCalculadaKm = null;
    let tempoRotaMinutos = null;
    let calculoTimer = null;
    let corridaAtualId = localStorage.getItem("32drive_corrida_id") || "";
    let corridaOcultaPasId = localStorage.getItem("32drive_pas_oculta_id") || "";
    let ultimoStatusAvisado = "";
    let ultimoResumoVoz = "Nenhuma entrega solicitada ainda.";

    const nomeSalvo = localStorage.getItem("32drive_pas_nome") || "";
    if (nomeSalvo) elNome.value = nomeSalvo;

    const fonteGrandeSalva = localStorage.getItem("32drive_fonte_grande") === "true";
    function aplicarFonteGrande(ativo) {
      document.body.classList.toggle("fonte-grande", ativo);
      btnFonteGrande.classList.toggle("ativo", ativo);
      btnFonteGrande.setAttribute("aria-pressed", String(ativo));
      localStorage.setItem("32drive_fonte_grande", String(ativo));
    }
    aplicarFonteGrande(fonteGrandeSalva);

    function falarTexto(texto) {
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const fala = new SpeechSynthesisUtterance(texto);
          fala.lang = "pt-BR";
          window.speechSynthesis.speak(fala);
        }
      } catch (_) {}
    }

    const PONTOS_CONHECIDOS = [
      { chaves: ["furg", "campus carreiros", "universidade federal"], lat: -32.0736, lon: -52.1674, nome: "FURG — Campus Carreiros, Rio Grande" },
      { chaves: ["furg saude", "area academica", "hu furg", "hospital universitario"], lat: -32.0375, lon: -52.1045, nome: "Área Acadêmica da Saúde / HU-FURG, Rio Grande" },
      { chaves: ["shopping praca", "praca rio grande"], lat: -32.0628, lon: -52.1489, nome: "Shopping Praça Rio Grande" },
      { chaves: ["partage", "partage shopping"], lat: -32.0592, lon: -52.1387, nome: "Partage Shopping Rio Grande" },
      { chaves: ["rodoviaria", "estacao rodoviaria"], lat: -32.0369, lon: -52.1072, nome: "Estação Rodoviária de Rio Grande" },
      { chaves: ["santa casa"], lat: -32.0357, lon: -52.1021, nome: "Santa Casa do Rio Grande" },
      { chaves: ["centro", "centro rio grande", "largo barbosa coelho"], lat: -32.0349, lon: -52.0986, nome: "Centro — Rio Grande" },
      { chaves: ["cassino", "balneario cassino", "av rio grande cassino"], lat: -32.1829, lon: -52.1592, nome: "Balneário Cassino — Av. Rio Grande" },
      { chaves: ["querencia"], lat: -32.1685, lon: -52.1642, nome: "Bairro Querência — Cassino" },
      { chaves: ["molhes", "molhes da barra"], lat: -32.1614, lon: -52.0968, nome: "Molhes da Barra — Cassino" },
      { chaves: ["cidade nova"], lat: -32.0434, lon: -52.1095, nome: "Bairro Cidade Nova — Rio Grande" },
      { chaves: ["vila militar"], lat: -32.0462, lon: -52.1189, nome: "Vila Militar — Rio Grande" },
      { chaves: ["parque marinha"], lat: -32.0672, lon: -52.1563, nome: "Parque Marinha — Rio Grande" },
      { chaves: ["junção", "juncao"], lat: -32.0548, lon: -52.1311, nome: "Junção — Rio Grande" }
    ];

    function normalizarTexto(txt) {
      return String(txt || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function buscarPontoConhecido(endereco) {
      const norm = normalizarTexto(endereco);
      if (!norm) return null;
      for (const ponto of PONTOS_CONHECIDOS) {
        for (const chave of ponto.chaves) {
          if (norm === chave || norm.startsWith(chave + " ") || norm.endsWith(" " + chave)) {
            return { lat: ponto.lat, lon: ponto.lon, nome: ponto.nome };
          }
        }
      }
      return null;
    }

    function expandirAbreviacoes(endereco) {
      return String(endereco || "")
        .replace(/\bav\.?\b/gi, "Avenida")
        .replace(/\br\.?\b/gi, "Rua")
        .replace(/\bpres\.?\b/gi, "Presidente")
        .replace(/\bdr\.?\b/gi, "Doutor")
        .replace(/\bprof\.?\b/gi, "Professor")
        .replace(/\bsanta tereza\b/gi, "Vila Santa Tereza")
        .trim();
    }

    function mostrarAvisoFirebase(texto) {
      if (!avisoFirebase) return;
      avisoFirebase.textContent = texto;
      avisoFirebase.style.display = texto ? "block" : "none";
    }

    function formatarMoeda(valor) {
      return "R$ " + Number(valor || 0).toFixed(2).replace(".", ",");
    }

    function atualizarVisualChuva(ativo) {
      elChuva.checked = Boolean(ativo);
      boxChuvaToggle.classList.toggle("ativo", Boolean(ativo));
      txtChuvaStatus.textContent = ativo
        ? "Ativo: acréscimo de 25% no valor"
        : "Tarifa normal";
    }

    function calcularPrecoPelaDistancia(km, chuvaAtiva) {
      const dist = Number(km);
      if (!Number.isFinite(dist) || dist <= 0) return null;

      let baseValor = 0;
      let regraTexto = "";

      if (dist <= 3.5) {
        baseValor = 7.99;
        regraTexto = dist.toFixed(1).replace(".", ",") + " km • Trecho curto";
      } else {
        baseValor = dist * 2.0;
        regraTexto = dist.toFixed(1).replace(".", ",") + " km × R$ 2,00/km";
      }

      const total = chuvaAtiva ? baseValor * 1.25 : baseValor;
      const arredondado = Number(total.toFixed(2));

      return {
        valor: arredondado,
        detalhe: chuvaAtiva ? regraTexto + " + 25% chuva" : regraTexto
      };
    }

    function atualizarTelaPreco() {
      const chuvaAtiva = Boolean(elChuva.checked);
      if (distanciaCalculadaKm === null) {
        elValorEstimado.textContent = "";
        elDetalheTarifa.textContent = "Preencha onde está e para onde vai";
        return;
      }
      const calc = calcularPrecoPelaDistancia(distanciaCalculadaKm, chuvaAtiva);
      if (calc) {
        elValorEstimado.textContent = formatarMoeda(calc.valor);
        elDetalheTarifa.textContent = calc.detalhe;
      }
    }

    async function usarLocalizacaoAtual() {
