<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b192c" />
  <link rel="manifest" href="manifest-passageiro.json?v=36" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Passageiro</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 70%, #0c1e38 100%);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #f59e0b;
      --green: #059669;
      --blue: #0284c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.45;
    }
    header {
      background: var(--navy-header);
      border-bottom: 3px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      border: 2px solid var(--accent);
      background: #ffffff;
    }
    h1 { font-size: 20px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #dbeafe; }
    .badge {
      background: var(--accent);
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #f59e0b;
      color: #78350f;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title { font-size: 19px; font-weight: 900; color: #0f172a; }
    label { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; display: block; }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #94a3b8;
      background: #ffffff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
    }
    .chuva-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #f0f9ff;
      border: 2px solid #7dd3fc;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .chuva-toggle.ativo {
      background: #0284c7;
      border-color: #0369a1;
      color: #ffffff;
    }
    .chuva-toggle input {
      width: 22px;
      height: 22px;
      accent-color: #0b192c;
    }
    .estimativa-box {
      background: #f1f5f9;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .estimativa-lbl { font-size: 15px; font-weight: 800; color: #0f172a; }
    .estimativa-val {
      font-size: 24px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
      min-width: 110px;
      text-align: right;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-sm {
      padding: 9px 12px;
      font-size: 14px;
      width: auto;
    }
    .btn-outline {
      background: #e2e8f0;
      color: #0f172a;
      border: 2px solid #94a3b8;
    }
    .btn-accent { background: var(--accent); color: #0f172a; }
    .btn-green { background: #10b981; color: #052e16; }
    .status-msg { font-size: 16px; font-weight: 800; color: #047857; text-align: center; min-height: 20px; }
    .erro-msg { font-size: 15px; font-weight: 800; color: #b91c1c; text-align: center; min-height: 18px; }
    .corrida-box {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .alerta-aceita {
      background: #dcfce7;
      border: 2px solid #16a34a;
      color: #14532d;
      border-radius: 12px;
      padding: 12px;
      font-weight: 900;
      font-size: 16px;
    }
    .chegada-destaque {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #78350f;
      border-radius: 12px;
      padding: 12px;
      font-weight: 800;
      font-size: 16px;
    }
    .pix-box {
      background: #eff6ff;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .pix-chave-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 800;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 DRIVE — Passageiro</h1>
        <div class="subtitle">Pedir Corrida • Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <span class="badge" id="badge-passageiro">v36</span>
  </header>

  <main>
    <div class="aviso-firebase" id="aviso-firebase"></div>

    <section class="card">
      <div class="card-title">Solicitar Corrida</div>

      <div>
        <label for="pas-nome">Seu Nome</label>
        <input id="pas-nome" type="text" placeholder="Ex: Maria Clara" />
      </div>

      <div>
        <label for="pas-origem">Onde você está? (Origem)</label>
        <input id="pas-origem" type="text" placeholder="Ex: Av. Rio Grande, 450, Cassino" />
      </div>

      <div>
        <label for="pas-destino">Para onde vai? (Destino)</label>
        <input id="pas-destino" type="text" placeholder="Ex: FURG, Centro, Shopping Praça..." />
      </div>

      <div>
        <label for="pas-pagamento">Forma de Pagamento</label>
        <select id="pas-pagamento">
          <option value="Pix">Pix</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão">Cartão</option>
        </select>
      </div>

      <label class="chuva-toggle" id="box-chuva-toggle" for="pas-chuva">
        <div>
          <strong>Adicional Dia de Chuva (+25%)</strong>
          <div style="font-size:14px;opacity:0.9;" id="txt-chuva-status">Desativado (tarifa normal)</div>
        </div>
        <input id="pas-chuva" type="checkbox" />
      </label>

      <button class="btn btn-outline" type="button" id="btn-calcular-rota">
        Calcular Valor pela Rota
      </button>

      <div class="estimativa-box">
        <div>
          <div class="estimativa-lbl">Valor Estimado</div>
          <div id="detalhe-tarifa" style="font-size:14px;color:var(--muted);">Preencha origem e destino para calcular</div>
        </div>
        <div class="estimativa-val" id="pas-valor-estimado"></div>
      </div>

      <div class="erro-msg" id="erro-rota"></div>

      <button class="btn btn-accent" type="button" id="btn-solicitar-corrida">
        Chamar Motorista
      </button>
      <div class="status-msg" id="msg-passageiro"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-title">Acompanhamento da Corrida</div>
        <button class="btn btn-outline btn-sm" type="button" id="btn-limpar-corrida">
          Limpar
        </button>
      </div>
      <div id="box-corrida-ativa" class="corrida-box">
        Nenhuma corrida solicitada ainda.
      </div>
    </section>
  </main>

  <script type="module">
    const badgePassageiro = document.getElementById("badge-passageiro");
    const avisoFirebase = document.getElementById("aviso-firebase");
    const msgPassageiro = document.getElementById("msg-passageiro");
    const erroRota = document.getElementById("erro-rota");
    const boxCorridaAtiva = document.getElementById("box-corrida-ativa");
    const elOrigem = document.getElementById("pas-origem");
    const elDestino = document.getElementById("pas-destino");
    const elPagamento = document.getElementById("pas-pagamento");
    const elChuva = document.getElementById("pas-chuva");
    const boxChuvaToggle = document.getElementById("box-chuva-toggle");
    const txtChuvaStatus = document.getElementById("txt-chuva-status");
    const elValorEstimado = document.getElementById("pas-valor-estimado");
    const elDetalheTarifa = document.getElementById("detalhe-tarifa");
    const btnCalcularRota = document.getElementById("btn-calcular-rota");
    const btnLimparCorrida = document.getElementById("btn-limpar-corrida");

    let db = null;
    let fs = null;
    let distanciaCalculadaKm = null;
    let tempoRotaMinutos = null;
    let calculoTimer = null;
    let corridaAtualId = localStorage.getItem("32drive_corrida_id") || "";
    let unsubscribeCorrida = null;
    let ultimoStatusAvisado = "";

    const PONTOS_CONHECIDOS = [
      { chaves: ["furg", "campus carreiros", "universidade federal"], lat: -32.0736, lon: -52.1674, nome: "FURG — Campus Carreiros, Rio Grande" },
      { chaves: ["furg saude", "area academica", "hu furg", "hospital universitario"], lat: -32.0375, lon: -52.1045, nome: "Área Acadêmica da Saúde / HU-FURG, Rio Grande" },
      { chaves: ["shopping praca", "praca rio grande"], lat: -32.0628, lon: -52.1489, nome: "Shopping Praça Rio Grande" },
      { chaves: ["partage", "partage shopping"], lat: -32.0592, lon: -52.1387, nome: "Partage Shopping Rio Grande" },
      { chaves: ["rodoviaria", "estacao rodoviaria"], lat: -32.0369, lon: -52.1072, nome: "Estação Rodoviária de Rio Grande" },
      { chaves: ["santa casa"], lat: -32.0357, lon: -52.1021, nome: "Santa Casa do Rio Grande" },
      { chaves: ["centro", "centro rio grande", "largo barbosa coelho"], lat: -32.0349, lon: -52.0986, nome: "Centro — Rio Grande" },
      { chaves: ["cassino", "balneario cassino", "av rio grande cassino"], lat: -32.1829, lon: -52.1592, nome: "Balneário Cassino — Av. Rio Grande" },
      { chaves: ["querencia"], lat: -32.1685, lon: -52.1642, nome: "Bairro Querência — Cassino" },
      { chaves: ["molhes", "molhes da barra"], lat: -32.1614, lon: -52.0968, nome: "Molhes da Barra — Cassino" },
      { chaves: ["cidade nova"], lat: -32.0434, lon: -52.1095, nome: "Bairro Cidade Nova — Rio Grande" },
      { chaves: ["vila militar"], lat: -32.0462, lon: -52.1189, nome: "Vila Militar — Rio Grande" },
      { chaves: ["parque marinha"], lat: -32.0672, lon: -52.1563, nome: "Parque Marinha — Rio Grande" },
      { chaves: ["junção", "juncao"], lat: -32.0548, lon: -52.1311, nome: "Junção — Rio Grande" }
    ];

    function normalizarTexto(txt) {
      return String(txt || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function buscarPontoConhecido(endereco) {
      const norm = normalizarTexto(endereco);
      if (!norm) return null;
      for (const ponto of PONTOS_CONHECIDOS) {
        for (const chave of ponto.chaves) {
          if (norm === chave || norm.startsWith(chave + " ") || norm.endsWith(" " + chave)) {
            return { lat: ponto.lat, lon: ponto.lon, nome: ponto.nome };
          }
        }
      }
      return null;
    }

    function expandirAbreviacoes(endereco) {
      return String(endereco || "")
        .replace(/\bav\.?\b/gi, "Avenida")
        .replace(/\br\.?\b/gi, "Rua")
        .replace(/\bpres\.?\b/gi, "Presidente")
        .replace(/\bdr\.?\b/gi, "Doutor")
        .replace(/\bprof\.?\b/gi, "Professor")
        .replace(/\bsanta tereza\b/gi, "Vila Santa Tereza")
        .trim();
    }

    function mostrarAvisoFirebase(texto) {
      if (!avisoFirebase) return;
      avisoFirebase.textContent = texto;
      avisoFirebase.style.display = texto ? "block" : "none";
    }

    function formatarMoeda(valor) {
      return "R$ " + Number(valor || 0).toFixed(2).replace(".", ",");
    }

    function atualizarVisualChuva(ativo) {
      elChuva.checked = Boolean(ativo);
      boxChuvaToggle.classList.toggle("ativo", Boolean(ativo));
      txtChuvaStatus.textContent = ativo
        ? "Ativo: +25% aplicado no valor"
        : "Desativado (tarifa normal)";
    }

    function calcularPrecoPelaDistancia(km, chuvaAtiva) {
      const dist = Number(km);
      if (!Number.isFinite(dist) || dist <= 0) return null;

      let baseValor = 0;
      let regraTexto = "";

      if (dist <= 3.5) {
        baseValor = 7.99;
        regraTexto = dist.toFixed(1).replace(".", ",") + " km • Trecho curto";
      } else {
        baseValor = dist * 2.0;
        regraTexto = dist.toFixed(1).replace(".", ",") + " km × R$ 2,00/km";
      }

      const total = chuvaAtiva ? baseValor * 1.25 : baseValor;
      const arredondado = Number(total.toFixed(2));

      return {
        valor: arredondado,
        detalhe: chuvaAtiva ? regraTexto + " + 25% chuva" : regraTexto
      };
    }

    function atualizarTelaPreco() {
      const chuvaAtiva = Boolean(elChuva.checked);
      if (distanciaCalculadaKm === null) {
        elValorEstimado.textContent = "";
        elDetalheTarifa.textContent = "Preencha origem e destino para calcular";
        return;
      }
      const calc = calcularPrecoPelaDistancia(distanciaCalculadaKm, chuvaAtiva);
      if (calc) {
        elValorEstimado.textContent = formatarMoeda(calc.valor);
        elDetalheTarifa.textContent = calc.detalhe;
      }
    }

    async function consultarNominatimLocal(textoBusca) {
      const viewbox = "-52.68,-32.35,-52.04,-31.92";
      const url =
        "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&bounded=1&viewbox=" +
        encodeURIComponent(viewbox) +
        "&q=" +
        encodeURIComponent(textoBusca);

      const resp = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!resp.ok) return null;
      const dados = await resp.json();
      if (!Array.isArray(dados) || !dados.length) return null;
      return {
        lat: Number(dados[0].lat),
        lon: Number(dados[0].lon),
        nome: dados[0].display_name
      };
    }

    async function geocodificarEndereco(endereco) {
      const conhecido = buscarPontoConhecido(endereco);
      if (conhecido) return conhecido;

      const limpo = expandirAbreviacoes(endereco);
      const semNumero = limpo.replace(/,?\s*\d+\b/g, "").trim();

      const tentativas = [
        limpo + ", Rio Grande, RS",
        limpo,
        semNumero && semNumero !== limpo ? semNumero + ", Rio Grande, RS" : ""
      ].filter(Boolean);

      for (const tentativa of tentativas) {
        const achado = await consultarNominatimLocal(tentativa);
        if (achado) return achado;
      }

      throw new Error("Endereço não encontrado em Rio Grande / Cassino");
    }

    async function buscarRotaOSRM(pontoA, pontoB) {
      const url =
        "https://router.project-osrm.org/route/v1/driving/" +
        pontoA.lon + "," + pontoA.lat + ";" +
        pontoB.lon + "," + pontoB.lat +
        "?overview=false";

      const resp = await fetch(url);
      if (!resp.ok) throw new Error("Falha ao calcular rota");
      const dados = await resp.json();
      if (!dados.routes || !dados.routes.length) {
        throw new Error("Rota indisponível");
      }
      const metros = Number(dados.routes[0].distance || 0);
      const segundos = Number(dados.routes[0].duration || 0);
      const km = Number((metros / 1000).toFixed(2));
      const minutosEstimados = Math.max(2, Math.round(segundos / 60) || Math.round(km * 2.2));
      return { km, minutosEstimados };
    }

    async function calcularRotaAutomatica() {
      const origem = (elOrigem.value || "").trim();
      const destino = (elDestino.value || "").trim();
      erroRota.textContent = "";

      if (origem.length < 3 || destino.length < 3) {
        distanciaCalculadaKm = null;
        tempoRotaMinutos = null;
        atualizarTelaPreco();
        return;
      }

      try {
        elDetalheTarifa.textContent = "Calculando rota e distância...";
        btnCalcularRota.disabled = true;
        btnCalcularRota.textContent = "Calculando rota...";

        const [pontoA, pontoB] = await Promise.all([
          geocodificarEndereco(origem),
          geocodificarEndereco(destino)
        ]);

        const rota = await buscarRotaOSRM(pontoA, pontoB);
        if (rota.km > 120) {
          throw new Error("Distância fora da área de atendimento");
        }

        distanciaCalculadaKm = rota.km;
        tempoRotaMinutos = rota.minutosEstimados;
        erroRota.textContent = "";
        atualizarTelaPreco();
      } catch (erro) {
        console.error(erro);
        distanciaCalculadaKm = null;
        tempoRotaMinutos = null;
        atualizarTelaPreco();
        erroRota.textContent =
          "Não localizamos um dos endereços. Tente escrever o nome da rua ou bairro (ex: Av. Presidente Vargas, Centro, FURG).";
      } finally {
        btnCalcularRota.disabled = false;
        btnCalcularRota.textContent = "Calcular Valor pela Rota";
      }
    }

    function agendarCalculoAutomatico() {
      clearTimeout(calculoTimer);
      calculoTimer = setTimeout(() => {
        calcularRotaAutomatica();
      }, 900);
    }

    function escaparHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function limparCorridaTela(mensagem = "Nenhuma corrida solicitada ainda.") {
      if (typeof unsubscribeCorrida === "function") {
        unsubscribeCorrida();
        unsubscribeCorrida = null;
      }
      corridaAtualId = "";
      localStorage.removeItem("32drive_corrida_id");
      ultimoStatusAvisado = "";
      boxCorridaAtiva.innerHTML = escaparHtml(mensagem);
    }

    function renderizarCorrida(c) {
      if (!c) {
        boxCorridaAtiva.innerHTML = "Nenhuma corrida solicitada ainda.";
        return;
      }

      if (c.status === "Finalizada" || c.status === "Cancelada") {
        limparCorridaTela("Corrida " + (c.status === "Finalizada" ? "finalizada" : "cancelada") + ". Pronta para novo pedido.");
        msgPassageiro.textContent = "Corrida encerrada e painel zerado.";
        return;
      }

      const foiAceita = Boolean(c.motorista && c.motorista.nome) ||
        ["Aceita", "Motorista a caminho", "No local de embarque", "Em viagem"].includes(c.status);

      const minutosChegada = Number(c.tempoChegadaMin || 0) || Number(c.tempoEstimadoRotaMin || 0) || null;
      const modoChegada = c.modoTempoChegada || (c.tempoChegadaMin ? "motorista" : "estimativa da rota");

      if (foiAceita && ultimoStatusAvisado !== (c.status || "Aceita")) {
        ultimoStatusAvisado = c.status || "Aceita";
        msgPassageiro.textContent = "Viagem aceita! " + (minutosChegada ? "Chegada estimada em " + minutosChegada + " min." : "Motorista a caminho.");
      }

      const alertaAceitaHtml = foiAceita
        ? '<div class="alerta-aceita">Viagem aceita! O motorista confirmou seu pedido.</div>'
        : "";

      const chegadaHtml = minutosChegada
        ? '<div class="chegada-destaque">Previsão de chegada até você: <strong>' +
            escaparHtml(minutosChegada) + ' min</strong> (' + escaparHtml(modoChegada) + ')</div>'
        : "";

      const motTexto = c.motorista && c.motorista.nome
        ? escaparHtml(c.motorista.nome) +
          (c.motorista.veiculo ? " • " + escaparHtml(c.motorista.veiculo) : "") +
          (c.motorista.placa ? " (" + escaparHtml(c.motorista.placa) + ")" : "")
        : "Aguardando motorista aceitar...";

      const kmTxt = c.distanciaKm ? Number(c.distanciaKm).toFixed(1).replace(".", ",") + " km" : "—";
      const chavePix = (c.chavePixMotorista || (c.motorista && c.motorista.chavePix) || "").trim();
      const mostrarPix = String(c.pagamento || "").toLowerCase() === "pix" || Boolean(chavePix);

      const pixHtml = mostrarPix
        ? '<div class="pix-box">' +
            '<div><strong>Pagamento via Pix</strong> — Valor: <strong>' + formatarMoeda(c.valorBruto) + '</strong></div>' +
            (chavePix
              ? '<div class="pix-chave-linha">' +
                  '<span id="texto-chave-pix">' + escaparHtml(chavePix) + '</span>' +
                  '<button class="btn btn-green btn-sm" type="button" id="btn-copiar-pix">Copiar Pix</button>' +
                '</div>' +
                '<div style="font-size:13px;color:#1e3a8a;">Copie a chave e faça o Pix diretamente para o motorista.</div>'
              : '<div style="font-size:14px;color:#1e3a8a;">Aguardando o motorista enviar a chave Pix na corrida.</div>') +
          '</div>'
        : "";

      boxCorridaAtiva.innerHTML =
        alertaAceitaHtml +
        chegadaHtml +
        "<div><strong>Código:</strong> " + escaparHtml(c.codigo || "—") + " • <strong>Status:</strong> " + escaparHtml(c.status || "Solicitada") + "</div>" +
        "<div><strong>Passageiro:</strong> " + escaparHtml(c.passageiro || "—") + " • <strong>Valor:</strong> " + formatarMoeda(c.valorBruto) + "</div>" +
        "<div><strong>Distância:</strong> " + kmTxt + " • <strong>Pagamento:</strong> " + escaparHtml(c.pagamento || "Pix") + "</div>" +
        "<div><strong>Trecho:</strong> " + escaparHtml(c.origem || "—") + " → " + escaparHtml(c.destino || "—") + "</div>" +
        "<div><strong>Motorista:</strong> " + motTexto + "</div>" +
        pixHtml;

      const btnCopiar = document.getElementById("btn-copiar-pix");
      if (btnCopiar && chavePix) {
        btnCopiar.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(chavePix);
            btnCopiar.textContent = "Copiado!";
          } catch (_) {
            const temp = document.createElement("textarea");
            temp.value = chavePix;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
            btnCopiar.textContent = "Copiado!";
          }
          setTimeout(() => {
            if (btnCopiar) btnCopiar.textContent = "Copiar Pix";
          }, 2000);
        });
      }
    }

    async function solicitarCorrida() {
      const nome = (document.getElementById("pas-nome").value || "").trim();
      const origem = (elOrigem.value || "").trim();
      const destino = (elDestino.value || "").trim();
      const pagamento = elPagamento.value || "Pix";

      if (!nome || !origem || !destino) {
        msgPassageiro.textContent = "Preencha seu nome, origem e destino.";
        return;
      }

      if (distanciaCalculadaKm === null) {
        await calcularRotaAutomatica();
      }

      if (distanciaCalculadaKm === null) {
        msgPassageiro.textContent = "Confira os endereços de origem e destino antes de chamar.";
        return;
      }

      const calc = calcularPrecoPelaDistancia(distanciaCalculadaKm, Boolean(elChuva.checked));
      const valorBruto = calc ? calc.valor : 7.99;
      const codigo = "32D-" + Math.floor(1000 + Math.random() * 9000);
      ultimoStatusAvisado = "";

      const corridaLocal = {
        codigo,
        passageiro: nome,
        origem,
        destino,
        distanciaKm: distanciaCalculadaKm,
        tempoEstimadoRotaMin: tempoRotaMinutos || Math.max(2, Math.round(distanciaCalculadaKm * 2.2)),
        pagamento,
        chavePixMotorista: "",
        valorBruto,
        chuva: Boolean(elChuva.checked),
        status: "Aguardando motorista",
        motorista: null,
        criadoEmTimestamp: Date.now()
      };

      renderizarCorrida(corridaLocal);

      if (!db || !fs) {
        msgPassageiro.textContent = "Corrida simulada (" + formatarMoeda(valorBruto) + "). Configure o firebase-config.js para enviar ao motorista.";
        return;
      }

      try {
        msgPassageiro.textContent = "Enviando solicitação...";
        const docRef = await fs.addDoc(fs.collection(db, "corridas"), {
          ...corridaLocal,
          criadoEm: fs.serverTimestamp()
        });
        corridaAtualId = docRef.id;
        localStorage.setItem("32drive_corrida_id", corridaAtualId);
        msgPassageiro.textContent = "Corrida " + codigo + " enviada! Aguardando motorista...";
        observarCorridaAtual();
      } catch (erro) {
        console.error(erro);
        msgPassageiro.textContent = "Erro ao enviar corrida para a nuvem.";
      }
    }

    function observarCorridaAtual() {
      if (typeof unsubscribeCorrida === "function") {
        unsubscribeCorrida();
        unsubscribeCorrida = null;
      }
      if (!db || !fs || !corridaAtualId) return;
      unsubscribeCorrida = fs.onSnapshot(fs.doc(db, "corridas", corridaAtualId), (snap) => {
        if (!snap.exists()) {
          limparCorridaTela("Nenhuma corrida solicitada ainda.");
          return;
        }
        renderizarCorrida(snap.data());
      });
    }

    elOrigem.addEventListener("input", agendarCalculoAutomatico);
    elDestino.addEventListener("input", agendarCalculoAutomatico);
    elOrigem.addEventListener("change", calcularRotaAutomatica);
    elDestino.addEventListener("change", calcularRotaAutomatica);
    btnCalcularRota.addEventListener("click", calcularRotaAutomatica);
    btnLimparCorrida.addEventListener("click", () => {
      limparCorridaTela("Nenhuma corrida solicitada ainda.");
      msgPassageiro.textContent = "Painel limpo.";
    });

    elChuva.addEventListener("change", () => {
      atualizarVisualChuva(elChuva.checked);
      atualizarTelaPreco();
    });

    document.getElementById("btn-solicitar-corrida").addEventListener("click", solicitarCorrida);

    atualizarVisualChuva(false);
    atualizarTelaPreco();

    try {
      const configModulo = await import("./firebase-config.js");
      fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      db = configModulo.db;
      if (!db) throw new Error("db não exportado");

      badgePassageiro.textContent = "Online";
      mostrarAvisoFirebase("");

      fs.onSnapshot(fs.doc(db, "config", "geral"), (snap) => {
        const chuvaGlobal = snap.exists() ? Boolean(snap.data().chuva) : false;
        atualizarVisualChuva(chuvaGlobal);
        atualizarTelaPreco();
      });

      observarCorridaAtual();
    } catch (erro) {
      console.error(erro);
      badgePassageiro.textContent = "Passageiro";
      mostrarAvisoFirebase(
        "Tela do Passageiro carregada. O arquivo firebase-config.js ainda não foi encontrado no repositório."
      );
    }
  </script>
</body>
</html>
