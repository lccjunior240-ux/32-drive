<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>32 Drive — Passageiro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #0f172a;
      padding: 16px;
      font-size: 17px;
      line-height: 1.45;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 { font-size: 22px; font-weight: 900; }
    .sub { font-size: 15px; color: #475569; }
    .card {
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #ffffff;
    }
    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #1e293b;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 17px;
      color: #0f172a;
      background: #ffffff;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-calc { background: #fef3c7; color: #92400e; border: 2px solid #f59e0b; }
    .btn-send { background: #f59e0b; color: #0f172a; }
    .resumo {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
    }
    .valor {
      font-size: 24px;
      font-weight: 900;
      color: #059669;
      margin-top: 4px;
    }
    .status {
      font-size: 16px;
      font-weight: 700;
      color: #047857;
      min-height: 22px;
    }
    .item {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      background: #f8fafc;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>32 Drive — Passageiro</h1>
      <div class="sub">Cassino &amp; Rio Grande • Mínima R$ 7,99 (até 3,5 km) • R$ 2,00/km</div>
    </div>

    <div class="card">
      <div>
        <label for="nome">Seu nome</label>
        <input id="nome" type="text" placeholder="Ex: Junior" />
      </div>
      <div>
        <label for="origem">Ponto de embarque</label>
        <input id="origem" type="text" placeholder="Ex: Rua Ijuí, 654, Cassino" />
      </div>
      <div>
        <label for="destino">Destino</label>
        <input id="destino" type="text" placeholder="Ex: Supermercado Guanabara, Cassino" />
      </div>
      <div>
        <label for="pagamento">Pagamento</label>
        <input id="pagamento" type="text" value="Pix / Dinheiro" />
      </div>

      <button class="btn btn-calc" type="button" id="btn-calcular">Calcular corrida</button>

      <div class="resumo">
        <div id="detalhe-calc" class="sub">Km e valor calculados automaticamente ao informar embarque e destino.</div>
        <div class="valor" id="valor-total">R$ 0,00</div>
      </div>

      <button class="btn btn-send" type="button" id="btn-enviar">Enviar pedido</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <strong>Pedidos enviados</strong>
      <div id="lista-pedidos" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
  </div>

  <script>
    (function () {
      const CHAVE = "32drive_pedidos_simples";
      const TOPICO_PEDIDOS = "32drive_cassino_jr_pedidos_v3";
      const TOPICO_RESPOSTAS = "32drive_cassino_jr_respostas_v3";
      const VALOR_KM = 2.0;

      const PONTOS = [
        { chaves: ["ijui", "ijuí", "654"], coords: [-32.1865, -52.1642] },
        { chaves: ["guanabara"], coords: [-32.1798, -52.1685] },
        { chaves: ["cassino"], coords: [-32.1833, -52.1667] },
        { chaves: ["centro"], coords: [-32.0350, -52.0986] },
        { chaves: ["furg", "carreiros"], coords: [-32.0750, -52.1630] },
        { chaves: ["navegantes"], coords: [-32.0420, -52.1150] },
        { chaves: ["cidade nova"], coords: [-32.0520, -52.1180] },
        { chaves: ["porto novo"], coords: [-32.0450, -52.0950] },
        { chaves: ["santa tereza"], coords: [-32.0490, -52.0920] }
      ];

      let ultimoCalculo = null;

      function acharCoords(texto) {
        const t = String(texto || "").toLowerCase();
        for (let i = 0; i < PONTOS.length; i++) {
          for (let j = 0; j < PONTOS[i].chaves.length; j++) {
            if (t.includes(PONTOS[i].chaves[j])) return PONTOS[i].coords;
          }
        }
        return null;
      }

      function haversineKm(a, b) {
        const R = 6371;
        const rad = function (g) { return (g * Math.PI) / 180; };
        const dLat = rad(b[0] - a[0]);
        const dLng = rad(b[1] - a[1]);
        const x =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(rad(a[0])) * Math.cos(rad(b[0])) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
        return R * (2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x))) * 1.3;
      }

      function estimarKm(origem, destino) {
        const c1 = acharCoords(origem);
        const c2 = acharCoords(destino);
        if (c1 && c2) return Math.max(1.0, Number(haversineKm(c1, c2).toFixed(1)));
        const oCassino = String(origem).toLowerCase().includes("cassino") || String(origem).toLowerCase().includes("ijui") || String(origem).toLowerCase().includes("ijuí");
        const dCassino = String(destino).toLowerCase().includes("cassino") || String(destino).toLowerCase().includes("guanabara");
        if (oCassino && dCassino) return 2.8;
        if (oCassino !== dCassino) return 18.0;
        return 4.5;
      }

      function formatarReal(v) {
        return "R$ " + Number(v || 0).toFixed(2).replace(".", ",");
      }

      function calcular() {
        const origem = document.getElementById("origem").value.trim();
        const destino = document.getElementById("destino").value.trim();
        const status = document.getElementById("status");

        if (!origem || !destino) {
          ultimoCalculo = null;
          document.getElementById("detalhe-calc").textContent = "Km e valor calculados automaticamente ao informar embarque e destino.";
          document.getElementById("valor-total").textContent = "R$ 0,00";
          return null;
        }

        const km = estimarKm(origem, destino);
        const total = km <= 3.5 ? 7.99 : Number((km * VALOR_KM).toFixed(2));
        const regra = km <= 3.5
          ? km.toFixed(1).replace(".", ",") + " km automático • Mínima (até 3,5 km): R$ 7,99"
          : km.toFixed(1).replace(".", ",") + " km automático × R$ 2,00/km";

        ultimoCalculo = { km: km, valorKm: VALOR_KM, total: total, regra: regra };
        document.getElementById("detalhe-calc").textContent = regra;
        document.getElementById("valor-total").textContent = formatarReal(total);
        status.textContent = "Cálculo automático pronto (" + km.toFixed(1).replace(".", ",") + " km).";
        return ultimoCalculo;
      }

      function lerLista() {
        try {
          return JSON.parse(localStorage.getItem(CHAVE) || "[]");
        } catch (e) {
          return [];
        }
      }

      function salvarLista(lista) {
        localStorage.setItem(CHAVE, JSON.stringify(lista));
      }

      function renderLista() {
        const box = document.getElementById("lista-pedidos");
        const lista = lerLista();
        if (!lista.length) {
          box.innerHTML = '<div class="item">Nenhum pedido enviado ainda.</div>';
          return;
        }
        box.innerHTML = lista.slice(0, 5).map(function (p) {
          const chegada = p.tempoChegada ? "<br/><strong>Chegada: " + p.tempoChegada + " min</strong>" : "";
          return (
            '<div class="item">' +
            "<strong>" + p.id + "</strong> • " + p.valor + " (" + p.status + ")" + chegada + "<br/>" +
            p.origem + " → " + p.destino + " (" + p.km + " km)" +
            "</div>"
          );
        }).join("");
      }

      function enviar() {
        const status = document.getElementById("status");
        const nome = document.getElementById("nome").value.trim() || "Passageiro";
        const origem = document.getElementById("origem").value.trim();
        const destino = document.getElementById("destino").value.trim();
        const pagamento = document.getElementById("pagamento").value.trim() || "Pix / Dinheiro";
        const calc = ultimoCalculo || calcular();

        if (!origem || !destino || !calc) {
          status.textContent = "Preencha embarque e destino.";
          return;
        }

        const pedido = {
          id: "32D-" + Date.now().toString().slice(-5),
          passageiro: nome,
          origem: origem,
          destino: destino,
          km: calc.km,
          valorKm: calc.valorKm,
          valor: formatarReal(calc.total),
          pagamento: pagamento,
          status: "Aguardando motorista",
          tempoChegada: null
        };

        const lista = lerLista();
        lista.unshift(pedido);
        salvarLista(lista);
        renderLista();

        status.textContent = "Enviando " + pedido.id + "...";
        fetch("https://ntfy.sh/" + TOPICO_PEDIDOS, {
          method: "POST",
          headers: { "Content-Type": "text/plain; charset=utf-8" },
          body: JSON.stringify(pedido)
        }).then(function () {
          status.textContent = "Pedido " + pedido.id + " enviado ao motorista!";
        }).catch(function () {
          status.textContent = "Salvo no aparelho; tentando reenviar...";
        });
      }

      function buscarRespostas() {
        fetch("https://ntfy.sh/" + TOPICO_RESPOSTAS + "/json?poll=1&since=60m", { cache: "no-store" })
          .then(function (r) { return r.text(); })
          .then(function (texto) {
            if (!texto) return;
            const linhas = texto.split("\n");
            const lista = lerLista();
            let mudou = false;

            for (let i = 0; i < linhas.length; i++) {
              const linha = linhas[i].trim();
              if (!linha) continue;
              try {
                const env = JSON.parse(linha);
                if (env && env.event === "message" && env.message) {
                  const res = JSON.parse(env.message);
                  for (let j = 0; j < lista.length; j++) {
                    if (lista[j].id === res.id) {
                      if (lista[j].status !== res.status || lista[j].tempoChegada !== res.tempoChegada) {
                        lista[j].status = res.status || lista[j].status;
                        lista[j].tempoChegada = res.tempoChegada || null;
                        mudou = true;
                      }
                    }
                  }
                }
              } catch (e) {}
            }

            if (mudou) {
              salvarLista(lista);
              renderLista();
              const topo = lista[0];
              if (topo) {
                document.getElementById("status").textContent =
                  topo.id + ": " + topo.status + (topo.tempoChegada ? " (" + topo.tempoChegada + " min)" : "");
              }
            }
          })
          .catch(function () {});
      }

      document.getElementById("origem").addEventListener("input", calcular);
      document.getElementById("destino").addEventListener("input", calcular);
      document.getElementById("btn-calcular").addEventListener("click", calcular);
      document.getElementById("btn-enviar").addEventListener("click", enviar);

      renderLista();
      buscarRespostas();
      setInterval(buscarRespostas, 2500);
    })();
  </script>
</body>
</html>
