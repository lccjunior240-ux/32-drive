<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entrega — Cliente V40</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 16px;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .topo {
      background: #0b192c;
      color: #ffffff;
      border-bottom: 4px solid #f59e0b;
      border-radius: 14px;
      padding: 16px;
    }
    .topo h1 {
      margin: 0;
      font-size: 20px;
      color: #f59e0b;
    }
    .diag {
      background: #0f172a;
      color: #f8fafc;
      border: 2px solid #f59e0b;
      border-radius: 12px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
    }
    .card {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    label {
      font-weight: 800;
      font-size: 15px;
      display: block;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 2px solid #64748b;
      border-radius: 10px;
      font-size: 16px;
      background: #ffffff;
      color: #0f172a;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-mini {
      width: auto;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
    }
    .btn-ouro { background: #f59e0b; color: #0f172a; }
    .btn-cinza { background: #e2e8f0; color: #0f172a; border: 1px solid #94a3b8; }
    .box-pedido {
      border: 2px solid #059669;
      background: #ecfdf5;
      color: #064e3b;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      font-weight: 800;
      color: #047857;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topo">
      <h1>32 Entrega — Cliente V40</h1>
      <div>Cassino &amp; Rio Grande</div>
    </div>

    <div class="diag" id="diag">Diag V40: iniciando...</div>

    <div class="card">
      <label for="cli-nome">Seu Nome</label>
      <input id="cli-nome" type="text" placeholder="Ex: Cliente" value="Cliente" />

      <label for="cli-origem">Endereço de Retirada</label>
      <input id="cli-origem" type="text" placeholder="Ex: Rua Ijuí, 654" />

      <label for="cli-destino">Endereço de Entrega</label>
      <input id="cli-destino" type="text" placeholder="Ex: Rua Bagé, 234" />

      <label for="cli-pagamento">Pagamento</label>
      <select id="cli-pagamento">
        <option value="Pix">Pix</option>
        <option value="Dinheiro">Dinheiro</option>
        <option value="Cartão">Cartão</option>
      </select>

      <button class="btn-ouro" type="button" id="btn-chamar">Chamar Entregador</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="card">
      <div class="card-topo">
        <strong>Sua Entrega</strong>
        <button class="btn-cinza btn-mini" type="button" id="btn-limpar">Encerrar / Limpar</button>
      </div>
      <div id="detalhe-pedido">Nenhum pedido ativo no momento.</div>
    </div>
  </div>

  <script type="module">
    const diagEl = document.getElementById("diag");
    const msgEl = document.getElementById("msg");
    const detalheEl = document.getElementById("detalhe-pedido");
    const nomeEl = document.getElementById("cli-nome");
    const origemEl = document.getElementById("cli-origem");
    const destinoEl = document.getElementById("cli-destino");
    const pagEl = document.getElementById("cli-pagamento");
    const btnChamar = document.getElementById("btn-chamar");
    const btnLimpar = document.getElementById("btn-limpar");

    let db = null;
    let fs = null;
    let unsubDoc = null;
    let corridaAtualId = localStorage.getItem("v40_corrida_atual_id") || "";

    function setDiag(t) {
      if (diagEl) diagEl.textContent = t;
    }

    function setMsg(t) {
      if (msgEl) msgEl.textContent = t;
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, function (m) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
      });
    }

    function formatarMoeda(v) {
      const n = Number(v);
      return Number.isFinite(n) && n > 0 ? "R$ " + n.toFixed(2).replace(".", ",") : "A definir pelo entregador";
    }

    function renderPedido(docId, d) {
      if (!detalheEl) return;
      if (!docId || !d) {
        detalheEl.innerHTML = "Nenhum pedido ativo no momento.";
        setDiag("Diag V40: sem pedido ativo");
        return;
      }

      const motNome = (d.motorista && d.motorista.nome) ? d.motorista.nome : "Aguardando entregador aceitar...";
      const pixChave = d.chavePixMotorista || (d.motorista && d.motorista.chavePix) || "";
      const valTxt = formatarMoeda(d.valorBruto);

      setDiag(
        "Diag V40: ID=" + docId +
        " | cod=" + (d.codigo || "") +
        " | st=" + (d.status || "") +
        " | val=" + (d.valorBruto || "") +
        " | mot=" + (d.motorista && d.motorista.nome ? d.motorista.nome : "")
      );

      detalheEl.innerHTML =
        '<div class="box-pedido">' +
          '<div><strong>Código:</strong> ' + esc(d.codigo || "") + ' • <strong>Status:</strong> <strong>' + esc(d.status || "") + '</strong></div>' +
          '<div><strong>Valor:</strong> <strong>' + esc(valTxt) + '</strong></div>' +
          '<div><strong>Pagamento:</strong> ' + esc(d.pagamento || "Pix") + '</div>' +
          '<div><strong>Retirada:</strong> ' + esc(d.origem || "") + '</div>' +
          '<div><strong>Destino:</strong> ' + esc(d.destino || "") + '</div>' +
          '<div><strong>Entregador:</strong> ' + esc(motNome) + '</div>' +
          '<div><strong>Pix:</strong> ' + (pixChave ? esc(pixChave) : "Aguardando chave Pix...") + '</div>' +
        '</div>';
    }

    function escutarPedido(docId) {
      if (unsubDoc) {
        unsubDoc();
        unsubDoc = null;
      }
      if (!docId || !db || !fs) {
        renderPedido("", null);
        return;
      }
      unsubDoc = fs.onSnapshot(fs.doc(db, "corridas", docId), function (snap) {
        if (!snap.exists()) {
          corridaAtualId = "";
          localStorage.removeItem("v40_corrida_atual_id");
          renderPedido("", null);
          return;
        }
        const d = snap.data();
        renderPedido(snap.id, d);
      }, function (err) {
        setDiag("Diag V40 ERR snapshot: " + (err.code || err.message));
      });
    }

    if (btnChamar) {
      btnChamar.onclick = async function () {
        if (!db || !fs) {
          setMsg("Firebase ainda não conectado.");
          return;
        }
        const origem = (origemEl && origemEl.value ? origemEl.value : "").trim();
        const destino = (destinoEl && destinoEl.value ? destinoEl.value : "").trim();
        const passageiro = (nomeEl && nomeEl.value ? nomeEl.value : "").trim() || "Cliente";
        const pagamento = pagEl ? pagEl.value : "Pix";

        if (!origem || !destino) {
          setMsg("Preencha retirada e entrega.");
          return;
        }

        const codigo = "32E-" + Math.floor(1000 + Math.random() * 9000);
        const novoDoc = {
          codigo: codigo,
          passageiro: passageiro,
          origem: origem,
          destino: destino,
          pagamento: pagamento,
          status: "Aguardando motorista",
          criadoEmTimestamp: Date.now(),
          criadoEm: fs.serverTimestamp()
        };

        try {
          setDiag("Diag V40: enviando pedido...");
          const ref = await fs.addDoc(fs.collection(db, "corridas"), novoDoc);
          corridaAtualId = ref.id;
          localStorage.setItem("v40_corrida_atual_id", ref.id);
          setMsg("Pedido " + codigo + " enviado!");
          escutarPedido(ref.id);
        } catch (e) {
          setDiag("Diag V40 ERR criar: " + (e.code || e.message));
          setMsg("Erro ao enviar pedido.");
        }
      };
    }

    if (btnLimpar) {
      btnLimpar.onclick = async function () {
        const idAntigo = corridaAtualId;
        corridaAtualId = "";
        localStorage.removeItem("v40_corrida_atual_id");
        if (unsubDoc) {
          unsubDoc();
          unsubDoc = null;
        }
        renderPedido("", null);
        if (idAntigo && db && fs) {
          try {
            await fs.updateDoc(fs.doc(db, "corridas", idAntigo), { status: "Cancelada" });
          } catch (_) {}
        }
        setMsg("Tela limpa.");
      };
    }

    async function iniciar() {
      try {
        setDiag("Diag V40: conectando firebase-config.js...");
        let cfg = null;
        try {
          cfg = await import("./firebase-config.js");
        } catch (_) {
          cfg = await import("../firebase-config.js");
        }
        fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
        db = cfg.db;
        if (!db) throw new Error("db ausente");

        setDiag("Diag V40: conectado!");
        if (corridaAtualId) {
          escutarPedido(corridaAtualId);
        }
      } catch (e) {
        setDiag("Diag V40 ERR init: " + (e && e.message ? e.message : e));
      }
    }

    iniciar();
  </script>
</body>
</html>
