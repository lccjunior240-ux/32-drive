<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Drive • Passageiro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b192c;
      --card: #ffffff;
      --navy: #0b192c;
      --navy-2: #13294b;
      --accent: #f59e0b;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --green: #059669;
      --red: #dc2626;
      --blue: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.5;
    }

    .topbar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      border-bottom: 3px solid var(--accent);
      padding: 14px 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .badge-32 {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--navy);
      font-weight: 900;
      font-size: 20px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand h1 { font-size: 20px; font-weight: 900; color: var(--accent); }
    .brand p { font-size: 14px; color: #cbd5e1; }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 9px;
      border: 1.5px solid #94a3b8;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      background: #ffffff;
    }

    #mapa-passageiro {
      width: 100%;
      height: 250px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #e2e8f0;
      z-index: 1;
    }

    .rua-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 11px 13px;
      font-size: 16px;
      font-weight: 800;
      color: var(--navy);
    }

    .chegada-box {
      background: #ecfdf5;
      border: 1.5px solid #10b981;
      color: #065f46;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 16px;
      font-weight: 800;
      display: none;
    }

    .valor-box {
      background: var(--navy);
      color: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .valor-box span { font-size: 15px; color: #cbd5e1; font-weight: 700; }
    .valor-box strong { font-size: 26px; color: var(--accent); font-weight: 900; }

    .acoes { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      padding: 13px 16px;
      border-radius: 10px;
      border: none;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-green { background: var(--green); color: #ffffff; flex: 1; }
    .btn-blue { background: var(--blue); color: #ffffff; }
    .btn-red { background: var(--red); color: #ffffff; }
    .btn-accent { background: var(--accent); color: #0f172a; }
    .btn-outline { background: #e2e8f0; color: var(--text); border: 1px solid #94a3b8; }

    .viagem-atual {
      border: 2px solid var(--accent);
      background: #fffbeb;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 17px;
    }

    .viagem-atual.aceita {
      border-color: var(--green);
      background: #ecfdf5;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 900;
      background: #fef3c7;
      color: #92400e;
    }

    .status-pill.aceita {
      background: #d1fae5;
      color: #065f46;
    }

    .meta { font-size: 16px; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="badge-32">32</div>
      <div>
        <h1>32 DRIVE</h1>
        <p>Balneário Cassino • Rio Grande</p>
      </div>
    </div>
    <span class="meta" id="status-conexao" style="color:#fde68a;">Conectando...</span>
  </header>

  <main class="wrap">
    <section class="card">
      <div>
        <label for="pas-origem">Local de Embarque (Rua)</label>
        <input id="pas-origem" type="text" placeholder="Buscando sua rua atual..." />
      </div>

      <div>
        <label for="pas-destino">Endereço Final (Para onde você vai?)</label>
        <input id="pas-destino" type="text" placeholder="Digite o endereço de destino" />
      </div>

      <div id="mapa-passageiro"></div>

      <div class="chegada-box" id="info-chegada-motorista"></div>

      <div class="rua-box" id="rua-atual-texto">Rua atual: carregando localização...</div>

      <div class="acoes">
        <button type="button" class="btn btn-blue" id="btn-buscar-local">Buscar Localização Atual</button>
        <button type="button" class="btn btn-outline" id="btn-nova-busca">Nova Busca</button>
      </div>

      <div class="valor-box">
        <div>
          <div>Valor da viagem</div>
          <span id="sub-valor-texto">Informe o endereço final para calcular</span>
        </div>
        <strong id="valor-corrida">—</strong>
      </div>

      <div class="acoes">
        <button type="button" class="btn btn-green" id="btn-chamar">Solicitar Corrida</button>
      </div>
    </section>

    <section class="card" id="caixa-viagem-atual" style="display:none;"></section>
  </main>

      const STORAGE_KEY_CORRIDA = "32drive_corrida_ativa_id";

      const GEOHASH_BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz";
      function encodeGeohash(lat, lon, precision) {
        precision = precision || 6;
        let idx = 0, bit = 0, evenBit = true, geohash = "";
        let latMin = -90, latMax = 90, lonMin = -180, lonMax = 180;
        while (geohash.length < precision) {
          if (evenBit) {
            const lonMid = (lonMin + lonMax) / 2;
            if (lon >= lonMid) { idx = idx * 2 + 1; lonMin = lonMid; }
            else { idx = idx * 2; lonMax = lonMid; }
          } else {
            const latMid = (latMin + latMax) / 2;
            if (lat >= latMid) { idx = idx * 2 + 1; latMin = latMid; }
            else { idx = idx * 2; latMax = latMid; }
          }
          evenBit = !evenBit;
          if (++bit === 5) {
            geohash += GEOHASH_BASE32.charAt(idx);
            bit = 0;
            idx = 0;
          }
        }
        return geohash;
      }

      function salvarIdLocal(id) {
        try {
          if (id) localStorage.setItem(STORAGE_KEY_CORRIDA, String(id));
          else localStorage.removeItem(STORAGE_KEY_CORRIDA);
        } catch (e) {}
      }

      function lerIdLocal() {
        try {
          return String(localStorage.getItem(STORAGE_KEY_CORRIDA) || "").trim();
        } catch (e) {
          return "";
        }
      }

      function moeda(v) {
        return "R$ " + Number(v || 0).toFixed(2).replace(".", ",");
      }

      function escapar(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
          Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * 1.28;
      }

      function montarValorPorKm(km) {
        const dist = Math.max(0.5, Number(km || 1));
        let base = 7.99;
        if (dist > 3.5) {
          base = Number((dist * 2.0).toFixed(2));
        }
        const bruto = Number((base * (1 + Number(state.dinamicaPct || 0) / 100)).toFixed(2));
        const mot80 = Number((bruto * 0.8).toFixed(2));
        const app20 = Number((bruto - mot80).toFixed(2));
        return { km: Number(dist.toFixed(2)), base, bruto, mot80, app20 };
      }

      async function geocodificarDestino(textoDestino) {
        const limpa = String(textoDestino || "").trim();
        if (!limpa) return null;

        const bLower = limpa.toLowerCase();
        if (bLower.includes("centro") && (bLower.includes("rio grande") || !bLower.includes("cassino"))) {
          return { lat: -32.0350, lng: -52.0986 };
        }

        const consulta = limpa.toLowerCase().includes("rio grande") ? limpa : limpa + ", Rio Grande, RS, Brasil";
        const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=" + encodeURIComponent(consulta);
        const res = await fetch(url);
        const arr = await res.json();
        if (Array.isArray(arr) && arr.length > 0) {
          return { lat: Number(arr[0].lat), lng: Number(arr[0].lon) };
        }
        return null;
      }

      async function buscarRotaOSRM(lat1, lng1, lat2, lng2) {
        try {
          const url = "https://router.project-osrm.org/route/v1/driving/" +
            lng1 + "," + lat1 + ";" + lng2 + "," + lat2 + "?overview=full&geometries=geojson";

          const data = await res.json();
          if (data && data.routes && data.routes.length > 0) {
            const rota = data.routes[0];
            const km = Number((rota.distance / 1000).toFixed(2));
            const minutos = Math.max(1, Math.round((rota.duration || (rota.distance / 8.5)) / 60));
            return { km, minutos, geometry: rota.geometry };
          }
        } catch (e) {}
