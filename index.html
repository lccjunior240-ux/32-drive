<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest-passageiro.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Passageiro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #2a2a2a;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }
    .badge {
      background: var(--accent);
      color: #111;
      font-weight: 800;
      font-size: 12px;
      padding: 5px 9px;
      border-radius: 8px;
      letter-spacing: 0.4px;
    }
    h1 { font-size: 16px; font-weight: 700; }
    .subtitle { font-size: 12px; color: var(--muted); }
    main {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }
    #map {
      width: 100%;
      height: 230px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #141414;
      color: var(--text);
      font-size: 14px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .resumo {
      background: #151515;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .valor {
      font-size: 20px;
      font-weight: 800;
      color: var(--green);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent);
      color: #111;
    }
    .btn-secondary {
      background: #262626;
      color: var(--text);
    }
    .status {
      font-size: 13px;
      color: var(--green);
      min-height: 18px;
      text-align: center;
    }
    .lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      background: #151515;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 Drive — Passageiro</h1>
        <div class="subtitle">Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <span class="badge">R$ 7,99</span>
  </header>

  <main>
    <div id="map"></div>

    <div class="card">
      <div>
        <label for="nome">Seu nome</label>
        <input id="nome" type="text" placeholder="Ex: Junior" />
      </div>
      <div>
        <label for="origem">Ponto de embarque</label>
        <input id="origem" type="text" placeholder="Ex: Av. Rio Grande, Cassino" />
      </div>
      <div>
        <label for="destino">Destino</label>
        <input id="destino" type="text" placeholder="Ex: Centro / Rua General Bacelar" />
      </div>
      <div class="row">
        <div>
          <label for="km">Distância estimada (km)</label>
          <input id="km" type="number" step="0.1" min="0.1" placeholder="Ex: 3.5" oninput="atualizarValor()" />
        </div>
        <div>
          <label for="pagamento">Pagamento</label>
          <input id="pagamento" type="text" value="Pix / Dinheiro" />
        </div>
      </div>

      <div class="resumo">
        <div>
          <div style="font-size:12px;color:var(--muted);">Valor estimado</div>
          <div id="detalhe-tarifa" style="font-size:12px;color:var(--muted);">Até 3,5 km: R$ 7,99</div>
        </div>
        <div class="valor" id="valor-total">R$ 7,99</div>
      </div>

      <button class="btn btn-secondary" type="button" onclick="usarLocalizacao()">Usar minha localização atual</button>
      <button class="btn btn-primary" type="button" onclick="enviarPedido()">Solicitar corrida agora</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:14px;">Meus pedidos enviados</div>
      <div class="lista" id="meus-pedidos"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const CHAVE_CORRIDAS = "32drive_corridas";
    let coordsAtual = [-32.1833, -52.1667];

    const map = L.map("map").setView(coordsAtual, 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    let marcador = L.marker(coordsAtual).addTo(map).bindPopup("Ponto inicial").openPopup();

    function calcularTarifa(km) {
      const distancia = parseFloat(km);
      if (!distancia || distancia <= 0) {
        return { total: 7.99, texto: "Até 3,5 km: R$ 7,99" };
      }
      if (distancia <= 3.5) {
        return { total: 7.99, texto: "Tarifa base até 3,5 km" };
      }
      const extraKm = distancia - 3.5;
      const total = 7.99 + extraKm * 2.0;
      return {
        total,
        texto: `R$ 7,99 + ${extraKm.toFixed(1).replace(".", ",")} km × R$ 2,00`
      };
    }

    function formatarMoeda(valor) {
      return "R$ " + valor.toFixed(2).replace(".", ",");
    }

    function atualizarValor() {
      const km = document.getElementById("km").value;
      const calc = calcularTarifa(km);
      document.getElementById("valor-total").textContent = formatarMoeda(calc.total);
      document.getElementById("detalhe-tarifa").textContent = calc.texto;
    }

    function usarLocalizacao() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.textContent = "Geolocalização não disponível neste aparelho.";
        return;
      }
      status.textContent = "Buscando localização...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          coordsAtual = [pos.coords.latitude, pos.coords.longitude];
          map.setView(coordsAtual, 15);
          marcador.setLatLng(coordsAtual).bindPopup("Você está aqui").openPopup();
          document.getElementById("origem").value =
            `Lat ${coordsAtual[0].toFixed(5)}, Lng ${coordsAtual[1].toFixed(5)}`;
          status.textContent = "Localização capturada!";
        },
        () => {
          status.textContent = "Não foi possível obter o GPS. Digite o endereço.";
        }
      );
    }

    function lerCorridas() {
      try {
        return JSON.parse(localStorage.getItem(CHAVE_CORRIDAS) || "[]");
      } catch {
        return [];
      }
    }

    function salvarCorridas(lista) {
      localStorage.setItem(CHAVE_CORRIDAS, JSON.stringify(lista));
    }

    function enviarPedido() {
      const nome = document.getElementById("nome").value.trim() || "Passageiro";
      const origem = document.getElementById("origem").value.trim();
      const destino = document.getElementById("destino").value.trim();
      const km = parseFloat(document.getElementById("km").value) || 3.5;
      const pagamento = document.getElementById("pagamento").value.trim() || "Pix / Dinheiro";
      const status = document.getElementById("status");

      if (!origem || !destino) {
        status.textContent = "Preencha embarque e destino.";
        return;
      }

      const calc = calcularTarifa(km);
      const novoPedido = {
        id: "32D-" + Date.now().toString().slice(-5),
        passageiro: nome,
        origem,
        destino,
        km,
        valor: formatarMoeda(calc.total),
        pagamento,
        status: "Aguardando motorista",
        criadoEm: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
      };

      const lista = lerCorridas();
      lista.unshift(novoPedido);
      salvarCorridas(lista);

      status.textContent = `Pedido ${novoPedido.id} enviado ao painel do motorista!`;
      renderizarPedidos();
    }

    function renderizarPedidos() {
      const container = document.getElementById("meus-pedidos");
      const lista = lerCorridas();
      if (!lista.length) {
        container.innerHTML = `<div class="item" style="color:var(--muted);">Nenhum pedido enviado ainda.</div>`;
        return;
      }
      container.innerHTML = lista
        .slice(0, 5)
        .map(
          (p) => `
          <div class="item">
            <strong>${p.id}</strong> — ${p.valor} (${p.status})<br/>
            <span style="color:var(--muted);">De:</span> ${p.origem}<br/>
            <span style="color:var(--muted);">Para:</span> ${p.destino}
          </div>`
        )
        .join("");
    }

    atualizarValor();
    renderizarPedidos();
  </script>
</body>
</html>
