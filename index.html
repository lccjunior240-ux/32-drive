<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Drive • Passageiro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0b192c;
      --card: #ffffff;
      --navy: #0b192c;
      --navy-2: #13294b;
      --accent: #f59e0b;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --green: #059669;
      --red: #dc2626;
      --blue: #0284c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.4;
    }

    .topbar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
      border-bottom: 3px solid var(--accent);
      padding: 12px 16px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .badge-32 {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--navy);
      font-weight: 900;
      font-size: 17px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand h1 { font-size: 16px; font-weight: 900; color: var(--accent); }
    .brand p { font-size: 12px; color: #cbd5e1; }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 3px;
    }

    input {
      width: 100%;
      padding: 9px 11px;
      border-radius: 9px;
      border: 1.5px solid #94a3b8;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      background: #ffffff;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 110px; gap: 8px; }

    @media (max-width: 480px) {
      .row-2 { grid-template-columns: 1fr; }
    }

    #mapa-passageiro {
      width: 100%;
      height: 240px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #e2e8f0;
      z-index: 1;
    }

    .rua-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 800;
      color: var(--navy);
    }

    .valor-box {
      background: var(--navy);
      color: #ffffff;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .valor-box span { font-size: 12px; color: #cbd5e1; font-weight: 700; }
    .valor-box strong { font-size: 22px; color: var(--accent); font-weight: 900; }

    .acoes { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-green { background: var(--green); color: #ffffff; flex: 1; }
    .btn-blue { background: var(--blue); color: #ffffff; }
    .btn-red { background: var(--red); color: #ffffff; }
    .btn-outline { background: #e2e8f0; color: var(--text); border: 1px solid #94a3b8; }

    .viagem-atual {
      border: 2px solid var(--accent);
      background: #fffbeb;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .viagem-atual.aceita {
      border-color: var(--green);
      background: #ecfdf5;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      background: #fef3c7;
      color: #92400e;
    }

    .status-pill.aceita {
      background: #d1fae5;
      color: #065f46;
    }

    .meta { font-size: 12px; color: var(--muted); font-weight: 700; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="badge-32">32</div>
      <div>
        <h1>32 DRIVE</h1>
        <p>Balneário Cassino • Rio Grande</p>
      </div>
    </div>
    <span class="meta" id="status-conexao" style="color:#fde68a;">Conectando...</span>
  </header>

  <main class="wrap">
    <section class="card">
      <div>
        <label for="pas-origem">Local de Embarque (Rua)</label>
        <input id="pas-origem" type="text" placeholder="Buscando sua rua atual..." />
      </div>

      <div class="row-2">
        <div>
          <label for="pas-destino">Para onde você vai?</label>
          <input id="pas-destino" type="text" placeholder="Digite o destino" />
        </div>
        <div>
          <label for="pas-km">Trecho (km)</label>
          <input id="pas-km" type="number" step="0.1" min="0.5" value="2.8" />
        </div>
      </div>

      <div id="mapa-passageiro"></div>

      <div class="rua-box" id="rua-atual-texto">Rua atual: carregando localização...</div>

      <div class="acoes">
        <button type="button" class="btn btn-blue" id="btn-buscar-local">Buscar Localização Atual</button>
        <button type="button" class="btn btn-outline" id="btn-nova-busca">Nova Busca</button>
      </div>

      <div class="valor-box">
        <div>
          <div>Valor da corrida</div>
          <span>Pronto para chamar</span>
        </div>
        <strong id="valor-corrida">R$ 7,99</strong>
      </div>

      <div class="acoes">
        <button type="button" class="btn btn-green" id="btn-chamar">Chamar Motorista</button>
      </div>
    </section>

    <section class="card" id="caixa-viagem-atual" style="display:none;"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    (function () {
      const firebaseConfig = {
        apiKey: "AIzaSyDlKouGeTQ7_NNgIRCLSYl66zB-J-9TzHs",
        authDomain: "drive-4745f.firebaseapp.com",
        databaseURL: "https://drive-4745f-default-rtdb.firebaseio.com",
        projectId: "drive-4745f",
        storageBucket: "drive-4745f.firebasestorage.app",
        messagingSenderId: "762959482484",
        appId: "1:762959482484:web:f40e2cb51020a61195cb21",
        measurementId: "G-V5PZCVKTCJ"
      };

      const GEOHASH_BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz";
      function encodeGeohash(lat, lon, precision) {
        precision = precision || 6;
        let idx = 0, bit = 0, evenBit = true, geohash = "";
        let latMin = -90, latMax = 90, lonMin = -180, lonMax = 180;
        while (geohash.length < precision) {
          if (evenBit) {
            const lonMid = (lonMin + lonMax) / 2;
            if (lon >= lonMid) { idx = idx * 2 + 1; lonMin = lonMid; }
            else { idx = idx * 2; lonMax = lonMid; }
          } else {
            const latMid = (latMin + latMax) / 2;
            if (lat >= latMid) { idx = idx * 2 + 1; latMin = latMid; }
            else { idx = idx * 2; latMax = latMid; }
          }
          evenBit = !evenBit;
          if (++bit === 5) {
            geohash += GEOHASH_BASE32.charAt(idx);
            bit = 0;
            idx = 0;
          }
        }
        return geohash;
      }

      const state = {
        lat: -32.1856,
        lng: -52.1658,
        geohash: "",
        geohashSetor: "",
        rua: "Balneário Cassino, Rio Grande - RS",
        dinamicaPct: 0,
        corridaAtualId: localStorage.getItem("32drive_corrida_atual") || "",
        corridaAtual: null
      };
      state.geohash = encodeGeohash(state.lat, state.lng, 6);
      state.geohashSetor = state.geohash.slice(0, 4);

      let db = null;
      let mapa = null;
      let marcador = null;
      let unsubscribeCorrida = null;

      const elOrigem = document.getElementById("pas-origem");
      const elDestino = document.getElementById("pas-destino");
      const elKm = document.getElementById("pas-km");
      const elRuaTexto = document.getElementById("rua-atual-texto");
      const elValor = document.getElementById("valor-corrida");
      const elStatus = document.getElementById("status-conexao");
      const elCaixaAtual = document.getElementById("caixa-viagem-atual");

      function moeda(v) {
        return "R$ " + Number(v || 0).toFixed(2).replace(".", ",");
      }

      function escapar(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function calcularValor() {
        const km = Math.max(0.1, Number(elKm.value || 1));
        let base = 7.99;
        if (km > 3.5) {
          base = Number((km * 2.0).toFixed(2));
        }
        const bruto = Number((base * (1 + Number(state.dinamicaPct || 0) / 100)).toFixed(2));
        const mot80 = Number((bruto * 0.8).toFixed(2));
        const app20 = Number((bruto - mot80).toFixed(2));
        elValor.textContent = moeda(bruto);
        return { km, base, bruto, mot80, app20 };
      }

      async function atualizarNomeRua(lat, lng, preencherInput) {
        try {
          const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lng));
          const data = await r.json();
          const a = data && data.address ? data.address : {};
          const rua = a.road || a.pedestrian || a.suburb || a.neighbourhood || "";
          const num = a.house_number ? ", " + a.house_number : "";
          const bairro = a.suburb || a.neighbourhood || "";
          const cidade = a.city || a.town || a.village || "Rio Grande";
          const linha = (rua ? rua + num : "") + (bairro && bairro !== rua ? " • " + bairro : "") + (rua || bairro ? " — " : "") + cidade + " - RS";
          state.rua = linha;
          elRuaTexto.textContent = "Rua atual: " + linha;
          if (preencherInput || !elOrigem.value.trim()) {
            elOrigem.value = linha;
          }
        } catch (e) {
          state.rua = "Balneário Cassino, Rio Grande - RS";
          elRuaTexto.textContent = "Rua atual: " + state.rua;
          if (!elOrigem.value.trim()) elOrigem.value = state.rua;
        }
      }

      function moverMapa(lat, lng, preencherInput) {
        state.lat = Number(lat);
        state.lng = Number(lng);
        state.geohash = encodeGeohash(state.lat, state.lng, 6);
        state.geohashSetor = state.geohash.slice(0, 4);

        if (mapa && marcador) {
          try {
            marcador.setLatLng([state.lat, state.lng]);
            mapa.setView([state.lat, state.lng], 15);
            mapa.invalidateSize();
          } catch (e) {}
        }
        atualizarNomeRua(state.lat, state.lng, preencherInput);
      }

      function iniciarMapa() {
        try {
          if (typeof window.L === "undefined") return;
          mapa = window.L.map("mapa-passageiro").setView([state.lat, state.lng], 14);
          window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap"
          }).addTo(mapa);
          marcador = window.L.marker([state.lat, state.lng], { draggable: true }).addTo(mapa);

          marcador.on("dragend", function () {
            const p = marcador.getLatLng();
            moverMapa(p.lat, p.lng, true);
          });

          mapa.on("click", function (ev) {
            moverMapa(ev.latlng.lat, ev.latlng.lng, true);
          });

          setTimeout(function () {
            if (mapa) mapa.invalidateSize();
          }, 300);
        } catch (e) {}
      }

      function buscarLocalizacaoAtual() {
        elRuaTexto.textContent = "Rua atual: buscando GPS...";
        if (!navigator.geolocation) {
          moverMapa(state.lat, state.lng, true);
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            moverMapa(pos.coords.latitude, pos.coords.longitude, true);
          },
          function () {
            moverMapa(state.lat, state.lng, true);
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }

      function renderizarViagemAtual() {
        const c = state.corridaAtual;
        if (!c || !state.corridaAtualId) {
          elCaixaAtual.style.display = "none";
          elCaixaAtual.innerHTML = "";
          return;
        }

        const st = c.status || "Aguardando motorista";
        const aceitaOuEmAndamento = st === "Aceita" || st === "Em viagem" || st === "Finalizada";
        const textoStatus =
          st === "Aceita" ? "Motorista a caminho • Viagem iniciando" :
          st === "Em viagem" ? "Viagem em andamento" :
          st === "Finalizada" ? "Viagem finalizada" : st;

        elCaixaAtual.style.display = "flex";
        elCaixaAtual.innerHTML =
          '<div class="viagem-atual ' + (aceitaOuEmAndamento ? "aceita" : "") + '">' +
            '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">' +
              '<strong>' + moeda(c.valorBruto) + ' • ' + escapar(c.codigo || "") + '</strong>' +
              '<span class="status-pill ' + (aceitaOuEmAndamento ? "aceita" : "") + '">' + escapar(textoStatus) + '</span>' +
            '</div>' +
            '<div><strong>Embarque:</strong> ' + escapar(c.origem) + '</div>' +
            '<div><strong>Destino:</strong> ' + escapar(c.destino) + '</div>' +
            (c.motoristaNome
              ? '<div class="meta">Motorista: <strong>' + escapar(c.motoristaNome) + '</strong>' + (c.motoristaVeiculo ? ' • ' + escapar(c.motoristaVeiculo) : '') + '</div>'
              : '<div class="meta">Aguardando aceite do motorista...</div>') +
            '<div class="meta">Código de confirmação: <strong>' + escapar(c.codigo4d || "") + '</strong></div>' +
            '<div class="acoes" style="margin-top:4px;">' +
              (st === "Aguardando motorista" || st === "Aceita"
                ? '<button type="button" class="btn btn-red" id="btn-cancelar-atual">Cancelar Corrida</button>'
                : '<button type="button" class="btn btn-outline" id="btn-encerrar-tela">Nova Chamada</button>') +
            '</div>' +
          '</div>';

        const btnCanc = document.getElementById("btn-cancelar-atual");
        if (btnCanc) {
          btnCanc.addEventListener("click", async function () {
            state.corridaAtual.status = "Cancelada";
            renderizarViagemAtual();
            if (db && state.corridaAtualId) {
              try { await db.collection("corridas").doc(state.corridaAtualId).set({ status: "Cancelada" }, { merge: true }); } catch (e) {}
            }
          });
        }

        const btnEnc = document.getElementById("btn-encerrar-tela");
        if (btnEnc) {
          btnEnc.addEventListener("click", function () {
            limparParaNovaBusca();
          });
        }
      }

      function observarCorridaAtual(id) {
        if (unsubscribeCorrida) {
          unsubscribeCorrida();
          unsubscribeCorrida = null;
        }
        if (!db || !id) return;

        unsubscribeCorrida = db.collection("corridas").doc(id).onSnapshot(function (doc) {
          if (!doc.exists) return;
          state.corridaAtual = Object.assign({ id: doc.id }, doc.data());
          renderizarViagemAtual();
        });
      }

      async function chamarMotorista() {
        const origem = (elOrigem.value || "").trim() || state.rua || "Balneário Cassino, Rio Grande - RS";
        const destino = (elDestino.value || "").trim() || "Centro, Rio Grande - RS";
        const calc = calcularValor();
        const agora = Date.now();
        const id = "corrida_" + agora;
        const codigo4d = String(Math.floor(1000 + Math.random() * 9000));

        const dados = {
          id: id,
          codigo: "32-" + String(agora).slice(-5),
          codigo4d: codigo4d,
          passageiro: "Passageiro 32",
          origem: origem,
          destino: destino,
          distanciaKm: calc.km,
          valorBase: calc.base,
          dinamicaPct: Number(state.dinamicaPct || 0),
          valorBruto: calc.bruto,
          repasseMotorista: calc.mot80,
          taxaPlataforma: calc.app20,
          latEmbarque: state.lat,
          lngEmbarque: state.lng,
          geohashEmbarque: state.geohash,
          geohashSetor: state.geohashSetor,
          status: "Aguardando motorista",
          criadoEm: agora
        };

        state.corridaAtualId = id;
        state.corridaAtual = dados;
        localStorage.setItem("32drive_corrida_atual", id);
        renderizarViagemAtual();

        if (!db) {
          elStatus.textContent = "Sem conexão";
          return;
        }

        try {
          await db.collection("corridas").doc(id).set(dados);
          elStatus.textContent = "Chamada enviada";
          observarCorridaAtual(id);
        } catch (e) {
          elStatus.textContent = "Erro ao enviar";
        }
      }

      function limparParaNovaBusca() {
        state.corridaAtualId = "";
        state.corridaAtual = null;
        localStorage.removeItem("32drive_corrida_atual");
        if (unsubscribeCorrida) {
          unsubscribeCorrida();
          unsubscribeCorrida = null;
        }
        elDestino.value = "";
        renderizarViagemAtual();
      }

      function conectarFirebase() {
        try {
          if (!window.firebase || !window.firebase.firestore) {
            elStatus.textContent = "Modo local";
            return;
          }
          if (!window.firebase.apps.length) window.firebase.initializeApp(firebaseConfig);
          db = window.firebase.firestore();
          elStatus.textContent = "Online";

          db.collection("config").doc("32drive_dinamica").onSnapshot(function (doc) {
            if (!doc.exists) return;
            state.dinamicaPct = Number((doc.data() || {}).dinamicaPct || 0);
            calcularValor();
          });

          if (state.corridaAtualId) {
            observarCorridaAtual(state.corridaAtualId);
          }
        } catch (e) {
          elStatus.textContent = "Offline";
        }
      }

      document.getElementById("btn-buscar-local").addEventListener("click", buscarLocalizacaoAtual);
      document.getElementById("btn-nova-busca").addEventListener("click", limparParaNovaBusca);
      document.getElementById("btn-chamar").addEventListener("click", chamarMotorista);
      elKm.addEventListener("input", calcularValor);
      elKm.addEventListener("change", calcularValor);

      iniciarMapa();
      moverMapa(state.lat, state.lng, true);
      calcularValor();
      conectarFirebase();
    })();
  </script>
</body>
</html>
