<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f10" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest-passageiro.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Passageiro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1d;
      --card-elevated: #222226;
      --border: #2c2c32;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #f59e0b;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1d1b16 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(26, 26, 29, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand img {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
    }
    .badge {
      background: var(--accent);
      color: #111;
      font-weight: 800;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
    }
    h1 { font-size: 16px; font-weight: 800; }
    .subtitle { font-size: 12px; color: var(--muted); }
    main {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }
    .hero-card {
      background: linear-gradient(135deg, #231f16 0%, var(--card) 65%);
      border: 1px solid #3a3220;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .hero-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent);
    }
    .hero-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.14);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }
    .driver-box {
      background: var(--card-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .driver-name { font-size: 15px; font-weight: 800; }
    .driver-car { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .plate-box {
      background: #f8fafc;
      color: #0f172a;
      border: 2px solid #0284c7;
      border-radius: 8px;
      padding: 6px 10px;
      text-align: center;
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 13px;
      min-width: 104px;
    }
    .plate-label {
      display: block;
      font-size: 8px;
      font-weight: 800;
      color: #0284c7;
      letter-spacing: 0.8px;
      margin-bottom: 1px;
    }
    #map {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      display: block;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #121215;
      color: var(--text);
      font-size: 15px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .resumo {
      background: #131316;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .valor {
      font-size: 21px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-secondary {
      background: #252529;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-calc {
      background: #2b2b30;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-primary {
      background: var(--accent);
      color: #111;
    }
    .status {
      font-size: 13px;
      color: var(--green);
      min-height: 18px;
      text-align: center;
      font-weight: 600;
    }
    .lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item {
      background: #131316;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 Drive — Passageiro</h1>
        <div class="subtitle">Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <span class="badge">R$ 7,99 mín.</span>
  </header>

  <main>
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-title">32 DRIVE</div>
          <div class="hero-sub">Mobilidade Urbana Local • Cassino &amp; Rio Grande</div>
        </div>
        <span class="online-pill"><span class="dot"></span>Ativo</span>
      </div>

      <div class="driver-box">
        <div>
          <div class="driver-name">Luíz Carlos Costa Jr.</div>
          <div class="driver-car">VW Voyage 2010</div>
        </div>
        <div class="plate-box">
          <span class="plate-label">BRASIL</span>
          IQD8060
        </div>
      </div>

      <div id="map"></div>
    </section>

    <div class="card">
      <div>
        <label for="nome">Seu nome</label>
        <input id="nome" type="text" placeholder="Ex: Junior" />
      </div>
      <div>
        <label for="origem">Ponto de embarque</label>
        <input id="origem" type="text" placeholder="Ex: Av. Rio Grande, Cassino, Rio Grande" />
      </div>
      <div>
        <label for="destino">Destino</label>
        <input id="destino" type="text" placeholder="Ex: Centro, Rio Grande" />
      </div>

      <button class="btn btn-secondary" type="button" id="btn-gps">Usar minha localização no embarque</button>
      <button class="btn btn-calc" type="button" id="btn-calcular">Calcular rota e valor</button>

      <div class="row">
        <div>
          <label for="km">Distância calculada (km)</label>
          <input id="km" type="text" inputmode="decimal" placeholder="Calculado no mapa" />
        </div>
        <div>
          <label for="pagamento">Pagamento</label>
          <input id="pagamento" type="text" value="Pix / Dinheiro" />
        </div>
      </div>

      <div class="resumo">
        <div>
          <div style="font-size:12px;color:var(--muted);">Valor da corrida</div>
          <div id="detalhe-tarifa" style="font-size:12px;color:var(--muted);">Até 3,5 km: R$ 7,99 | Acima: R$ 2,00/km</div>
        </div>
        <div class="valor" id="valor-total">—</div>
      </div>

      <button class="btn btn-primary" type="button" id="btn-enviar">Enviar pedido para o motorista</button>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:14px;">Meus pedidos enviados</div>
      <div class="lista" id="meus-pedidos"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    (function () {
      const CHAVE_CORRIDAS = "32drive_corridas";
      const MOTORISTA_PADRAO = {
        nome: "Luíz Carlos Costa Jr.",
        veiculo: "VW Voyage 2010",
        placa: "IQD8060"
      };

      const centroCassino = [-32.1833, -52.1667];
      let map = null;
      let marcadorOrigem = null;
      let marcadorDestino = null;
      let linhaRota = null;
      let coordsOrigem = null;
      let coordsDestino = null;

      if (window.L) {
        try {
          map = L.map("map").setView(centroCassino, 13);
          L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap"
          }).addTo(map);
        } catch (e) {}
      }

      function parseKm(raw) {
        if (raw === null || raw === undefined) return NaN;
        const limpo = String(raw).trim().replace(",", ".");
        if (!limpo) return NaN;
        const n = Number(limpo);
        return Number.isFinite(n) && n > 0 ? n : NaN;
      }

      function calcularTarifa(rawKm) {
        const distancia = parseKm(rawKm);
        if (!Number.isFinite(distancia)) {
          return null;
        }
        if (distancia <= 3.5) {
          return {
            total: 7.99,
            texto: "Tarifa mínima (até 3,5 km): R$ 7,99",
            kmUsado: distancia
          };
        }
        const total = distancia * 2.0;
        return {
          total,
          texto: distancia.toFixed(1).replace(".", ",") + " km × R$ 2,00/km",
          kmUsado: distancia
        };
      }

      function formatarMoeda(valor) {
        return "R$ " + Number(valor).toFixed(2).replace(".", ",");
      }

      function atualizarValor() {
        const inputKm = document.getElementById("km");
        const elTotal = document.getElementById("valor-total");
        const elDetalhe = document.getElementById("detalhe-tarifa");
        const calc = calcularTarifa(inputKm ? inputKm.value : "");

        if (!calc) {
          if (elTotal) elTotal.textContent = "—";
          if (elDetalhe) elDetalhe.textContent = "Até 3,5 km: R$ 7,99 | Acima: R$ 2,00/km";
          return null;
        }
        if (elTotal) elTotal.textContent = formatarMoeda(calc.total);
        if (elDetalhe) elDetalhe.textContent = calc.texto;
        return calc;
      }

      function atualizarMapa(origemCoords, destinoCoords, rotaCoords) {
        if (!map || !window.L) return;
        if (origemCoords) {
          if (!marcadorOrigem) {
            marcadorOrigem = L.marker(origemCoords).addTo(map).bindPopup("Embarque");
          } else {
            marcadorOrigem.setLatLng(origemCoords);
          }
        }
        if (destinoCoords) {
          if (!marcadorDestino) {
            marcadorDestino = L.marker(destinoCoords).addTo(map).bindPopup("Destino");
          } else {
            marcadorDestino.setLatLng(destinoCoords);
          }
        }
        if (linhaRota) {
          map.removeLayer(linhaRota);
          linhaRota = null;
        }
        if (rotaCoords && rotaCoords.length) {
          linhaRota = L.polyline(rotaCoords, { color: "#f59e0b", weight: 4 }).addTo(map);
          map.fitBounds(linhaRota.getBounds(), { padding: [24, 24] });
        } else if (origemCoords && destinoCoords) {
          map.fitBounds([origemCoords, destinoCoords], { padding: [24, 24] });
        } else if (origemCoords) {
          map.setView(origemCoords, 15);
        }
      }

      function buscarCoordenadas(endereco) {
        const termo = endereco.toLowerCase().includes("rio grande")
          ? endereco
          : endereco + ", Rio Grande, RS, Brasil";
        const url =
          "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
          encodeURIComponent(termo);
        return fetch(url, {
          headers: { "Accept": "application/json" }
        })
          .then(function (r) { return r.json(); })
          .then(function (dados) {
            if (!Array.isArray(dados) || !dados.length) {
              throw new Error("Endereço não encontrado");
            }
            return [parseFloat(dados[0].lat), parseFloat(dados[0].lon)];
          });
      }

      function buscarRotaOSRM(p1, p2) {
        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          p1[1] + "," + p1[0] + ";" + p2[1] + "," + p2[0] +
          "?overview=full&geometries=geojson";
        return fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!data.routes || !data.routes.length) {
              throw new Error("Rota indisponível");
            }
            const rota = data.routes[0];
            const km = rota.distance / 1000;
            const coords = rota.geometry.coordinates.map(function (c) {
              return [c[1], c[0]];
            });
            return { km: Number(km.toFixed(1)), coords: coords };
          });
      }

      function calcularRotaAutomatica() {
        const origemTxt = (document.getElementById("origem").value || "").trim();
        const destinoTxt = (document.getElementById("destino").value || "").trim();
        const status = document.getElementById("status");

        if (!origemTxt || !destinoTxt) {
          if (status) status.textContent = "Preencha embarque e destino para calcular a rota.";
          return;
        }

        if (status) status.textContent = "Calculando rota no mapa...";

        const promessaOrigem = coordsOrigem
          ? Promise.resolve(coordsOrigem)
          : buscarCoordenadas(origemTxt);

        const promessaDestino = coordsDestino
          ? Promise.resolve(coordsDestino)
          : buscarCoordenadas(destinoTxt);

        Promise.all([promessaOrigem, promessaDestino])
          .then(function (pontos) {
            coordsOrigem = pontos[0];
            coordsDestino = pontos[1];
            return buscarRotaOSRM(coordsOrigem, coordsDestino);
          })
          .then(function (resultado) {
            atualizarMapa(coordsOrigem, coordsDestino, resultado.coords);
            const inputKm = document.getElementById("km");
            if (inputKm) inputKm.value = String(resultado.km).replace(".", ",");
            atualizarValor();
            if (status) {
              status.textContent =
                "Rota calculada: " + String(resultado.km).replace(".", ",") + " km.";
            }
          })
          .catch(function () {
            if (status) {
              status.textContent =
                "Não foi possível traçar a rota automática. Você pode digitar os km no campo ao lado.";
            }
          });
      }

      function usarLocalizacao() {
        const status = document.getElementById("status");
        if (!navigator.geolocation) {
          if (status) status.textContent = "Geolocalização não disponível neste aparelho.";
          return;
        }
        if (status) status.textContent = "Buscando localização...";
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            coordsOrigem = [pos.coords.latitude, pos.coords.longitude];
            const origem = document.getElementById("origem");
            if (origem) {
              origem.value =
                "Lat " + coordsOrigem[0].toFixed(5) + ", Lng " + coordsOrigem[1].toFixed(5);
            }
            atualizarMapa(coordsOrigem, coordsDestino, null);
            if (status) status.textContent = "Localização definida no embarque!";
          },
          function () {
            if (status) status.textContent = "Não foi possível obter o GPS. Digite o endereço.";
          }
        );
      }

      function lerCorridas() {
        try {
          return JSON.parse(localStorage.getItem(CHAVE_CORRIDAS) || "[]");
        } catch (e) {
          return [];
        }
      }

      function salvarCorridas(lista) {
        localStorage.setItem(CHAVE_CORRIDAS, JSON.stringify(lista));
      }

      function renderizarPedidos() {
        const container = document.getElementById("meus-pedidos");
        if (!container) return;
        const lista = lerCorridas();
        if (!lista.length) {
          container.innerHTML = '<div class="item" style="color:var(--muted);">Nenhum pedido enviado ainda.</div>';
          return;
        }
        container.innerHTML = lista
          .slice(0, 5)
          .map(function (p) {
            return (
              '<div class="item">' +
              "<strong>" + p.id + "</strong> — " + p.valor + " (" + p.status + ")<br/>" +
              '<span style="color:var(--muted);">De:</span> ' + p.origem + "<br/>" +
              '<span style="color:var(--muted);">Para:</span> ' + p.destino +
              "</div>"
            );
          })
          .join("");
      }

      function enviarPedido() {
        const nome = (document.getElementById("nome").value || "").trim() || "Passageiro";
        const origem = (document.getElementById("origem").value || "").trim();
        const destino = (document.getElementById("destino").value || "").trim();
        const pagamento = (document.getElementById("pagamento").value || "").trim() || "Pix / Dinheiro";
        const status = document.getElementById("status");

        if (!origem || !destino) {
          if (status) status.textContent = "Preencha embarque e destino.";
          return;
        }

        const calc = atualizarValor();
        if (!calc) {
          if (status) status.textContent = "Toque em Calcular rota e valor antes de enviar.";
          return;
        }

        const novoPedido = {
          id: "32D-" + Date.now().toString().slice(-5),
          passageiro: nome,
          origem: origem,
          destino: destino,
          km: calc.kmUsado,
          valor: formatarMoeda(calc.total),
          pagamento: pagamento,
          motorista: MOTORISTA_PADRAO,
          status: "Aguardando motorista",
          criadoEm: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })
        };

        const lista = lerCorridas();
        lista.unshift(novoPedido);
        salvarCorridas(lista);

        if (status) status.textContent = "Pedido " + novoPedido.id + " enviado ao painel do motorista!";
        renderizarPedidos();
      }

      const inputOrigem = document.getElementById("origem");
      if (inputOrigem) {
        inputOrigem.addEventListener("input", function () { coordsOrigem = null; });
      }

      const inputDestino = document.getElementById("destino");
      if (inputDestino) {
        inputDestino.addEventListener("input", function () { coordsDestino = null; });
      }

      const inputKm = document.getElementById("km");
      if (inputKm) {
        inputKm.addEventListener("input", atualizarValor);
      }

      const btnGps = document.getElementById("btn-gps");
      if (btnGps) btnGps.addEventListener("click", usarLocalizacao);

      const btnCalc = document.getElementById("btn-calcular");
      if (btnCalc) btnCalc.addEventListener("click", calcularRotaAutomatica);

      const btnEnviar = document.getElementById("btn-enviar");
      if (btnEnviar) btnEnviar.addEventListener("click", enviarPedido);

      renderizarPedidos();
    })();
  </script>
</body>
</html>
