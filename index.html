<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b192c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest-passageiro.json" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Passageiro</title>
  <style>
    :root {
      --bg: #0f0f10;
      --card: #1a1a1d;
      --navy-card: linear-gradient(145deg, #0b192c 0%, #13294b 65%, #0c1e38 100%);
      --navy-border: #1e3f6e;
      --card-elevated: rgba(255, 255, 255, 0.06);
      --border: #2c2c32;
      --text: #f5f5f7;
      --muted: #b4b4be;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #13233b 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 17px;
      line-height: 1.45;
    }
    header {
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand img {
      width: 46px;
      height: 46px;
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid var(--navy-border);
    }
    .badge {
      background: var(--accent);
      color: #111;
      font-weight: 800;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    h1 { font-size: 19px; font-weight: 900; }
    .subtitle { font-size: 15px; color: var(--muted); }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }
    .hero-card {
      background: var(--navy-card);
      border: 1px solid var(--navy-border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }
    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-title {
      font-size: 24px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .hero-sub {
      font-size: 15px;
      color: #dbeafe;
      margin-top: 3px;
    }
    .online-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.16);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }
    .online-pill.offline {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
    }
    .online-pill.offline .dot {
      background: var(--red);
    }
    .driver-box {
      background: var(--card-elevated);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .driver-name { font-size: 19px; font-weight: 800; color: #ffffff; }
    .driver-car { font-size: 16px; color: #dbeafe; margin-top: 3px; }
    .plate-box {
      background: #f8fafc;
      color: #0f172a;
      border: 2px solid #0284c7;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 16px;
      min-width: 118px;
    }
    .plate-label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: #0284c7;
      letter-spacing: 0.8px;
      margin-bottom: 2px;
    }
    .live-banner {
      display: none;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(16, 185, 129, 0.45);
      border-radius: 16px;
      padding: 16px;
      flex-direction: column;
      gap: 8px;
    }
    .live-banner.visivel {
      display: flex;
    }
    .live-banner.recusada {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.45);
    }
    .live-title {
      font-size: 19px;
      font-weight: 900;
      color: var(--green);
    }
    .live-banner.recusada .live-title {
      color: #fca5a5;
    }
    .live-eta {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }
    .live-sub {
      font-size: 15px;
      color: #dbeafe;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label {
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }
    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #121215;
      color: var(--text);
      font-size: 18px;
    }
    .resumo {
      background: #131316;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .valor {
      font-size: 26px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
    }
    .pix-box {
      background: #131316;
      border: 1px solid #1e3f6e;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pix-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #0c0c0e;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      flex-wrap: wrap;
    }
    .pix-key {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      word-break: break-all;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-copy {
      width: auto;
      padding: 11px 16px;
      font-size: 16px;
      background: var(--green);
      color: #062117;
      white-space: nowrap;
    }
    .btn-secondary {
      background: #252529;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-calc {
      background: #2b2b30;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .btn-primary {
      background: var(--accent);
      color: #111;
    }
    .status {
      font-size: 16px;
      color: var(--green);
      min-height: 22px;
      text-align: center;
      font-weight: 700;
    }
    .lista {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item {
      background: #131316;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 Drive — Passageiro</h1>
        <div class="subtitle">Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <span class="badge">R$ 7,99 mín.</span>
  </header>

  <main>
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-title">32 DRIVE</div>
          <div class="hero-sub">Mobilidade Urbana Local • Cassino &amp; Rio Grande</div>
        </div>
        <span class="online-pill" id="passageiro-status-pill">
          <span class="dot"></span>
          <span id="passageiro-status-text">Em Operação</span>
        </span>
      </div>

      <div class="driver-box">
        <div>
          <div class="driver-name">Luíz Carlos Costa Jr.</div>
          <div class="driver-car">VW Voyage 2010</div>
        </div>
        <div class="plate-box">
          <span class="plate-label">BRASIL</span>
          IQD8060
        </div>
      </div>
    </section>

    <section class="live-banner" id="live-banner">
      <div class="live-title" id="live-title">Corrida aceita!</div>
      <div class="live-eta" id="live-eta">Tempo estimado de chegada: —</div>
      <div class="live-sub" id="live-sub">Motorista: Luíz Carlos Costa Jr. • VW Voyage 2010 • IQD8060</div>
    </section>

    <div class="card">
      <div>
        <label for="nome">Seu nome</label>
        <input id="nome" type="text" placeholder="Ex: Junior" />
      </div>
      <div>
        <label for="origem">Ponto de embarque</label>
        <input id="origem" type="text" placeholder="Ex: Rua Ijuí, 654, Cassino" />
      </div>
      <div>
        <label for="destino">Destino</label>
        <input id="destino" type="text" placeholder="Ex: Supermercado Guanabara, Cassino" />
