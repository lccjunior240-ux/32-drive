<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
  <meta name="theme-color" content="#0b192c" />
  <link rel="manifest" href="manifest-passageiro.json?v=40" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Passageiro Inclusivo</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 70%, #0c1e38 100%);
      --border: #94a3b8;
      --text: #0f172a;
      --muted: #334155;
      --accent: #f59e0b;
      --green: #047857;
      --blue: #0369a1;
      --f-base: 19px;
      --f-label: 18px;
      --f-btn: 19px;
      --f-title: 22px;
    }
    body.fonte-grande {
      --f-base: 23px;
      --f-label: 22px;
      --f-btn: 22px;
      --f-title: 26px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: var(--f-base);
      line-height: 1.5;
    }
    header {
      background: var(--navy-header);
      border-bottom: 4px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 2px solid var(--accent);
      background: #ffffff;
    }
    h1 { font-size: 21px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #e2e8f0; font-weight: 600; }
    .header-acoes { display: flex; align-items: center; gap: 8px; }
    .btn-acess {
      background: #ffffff;
      color: #0b192c;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-acess.ativo {
      background: var(--accent);
      color: #0f172a;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #d97706;
      color: #78350f;
      border-radius: 14px;
      padding: 14px;
      font-size: var(--f-label);
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-title { font-size: var(--f-title); font-weight: 900; color: #0f172a; }
    label.campo-lbl {
      font-size: var(--f-label);
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 6px;
      display: block;
    }
    input, select {
      width: 100%;
      min-height: 56px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid #475569;
      background: #ffffff;
      color: #0f172a;
      font-size: var(--f-base);
      font-weight: 700;
    }
    .btn-gps {
      margin-top: 8px;
      min-height: 54px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid var(--blue);
      background: #e0f2fe;
      color: #0c4a6e;
      font-size: var(--f-label);
      font-weight: 900;
      cursor: pointer;
      width: 100%;
    }
    .atalhos-rapidos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-atalho {
      padding: 10px 14px;
      border-radius: 999px;
      border: 2px solid #475569;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-atalho:hover, .btn-atalho:focus {
      background: #0b192c;
      color: #ffffff;
      border-color: #0b192c;
    }
    .estimativa-box {
      background: #f1f5f9;
      border: 2px solid #475569;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .estimativa-lbl { font-size: var(--f-label); font-weight: 900; color: #0f172a; }
    .estimativa-val {
      font-size: 26px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
      text-align: right;
    }
    .btn {
      width: 100%;
      min-height: 58px;
      padding: 15px 18px;
      border: none;
      border-radius: 14px;
      font-size: var(--f-btn);
      font-weight: 900;
      cursor: pointer;
    }
    .btn-sm {
      min-height: 46px;
      padding: 10px 14px;
      font-size: 16px;
      width: auto;
    }
    .btn-outline {
      background: #e2e8f0;
      color: #0f172a;
      border: 2px solid #475569;
    }
    .btn-accent {
      background: var(--accent);
      color: #0f172a;
      border: 2px solid #b45309;
    }
    .btn-green {
      background: #059669;
      color: #ffffff;
    }
    .status-msg { font-size: var(--f-label); font-weight: 900; color: var(--green); text-align: center; min-height: 24px; }
    .erro-msg { font-size: var(--f-label); font-weight: 900; color: #b91c1c; text-align: center; min-height: 20px; }
    .corrida-box {
      background: #f8fafc;
      border: 2px solid #64748b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .alerta-aceita {
      background: #dcfce7;
      border: 2px solid #15803d;
      color: #14532d;
      border-radius: 12px;
      padding: 14px;
      font-weight: 900;
      font-size: var(--f-label);
    }
    .chegada-destaque {
      background: #fef3c7;
      border: 2px solid #d97706;
      color: #78350f;
      border-radius: 12px;
      padding: 14px;
      font-weight: 900;
      font-size: var(--f-label);
    }
    .pix-box {
      background: #eff6ff;
      border: 2px solid #1d4ed8;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .pix-chave-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: #ffffff;
      border: 2px solid #60a5fa;
      border-radius: 10px;
      padding: 12px;
      font-weight: 900;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Drive" />
      <div>
        <h1>32 DRIVE</h1>
        <div class="subtitle">Inclusivo • Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <div class="header-acoes">
      <button class="btn-acess" type="button" id="btn-fonte-grande" aria-pressed="false">
        Letra A+
      </button>
    </div>
  </header>

  <main>
    <div class="aviso-firebase" id="aviso-firebase"></div>

    <section class="card">
      <div class="card-header">
        <div class="card-title">1. Pedir Corrida</div>
        <button class="btn btn-outline btn-sm" type="button" id="btn-ler-voz">
          Ouvir Resumo
        </button>
      </div>

      <div>
        <label class="campo-lbl" for="pas-nome">Seu Nome</label>
        <input id="pas-nome" type="text" placeholder="Como podemos te chamar?" />
      </div>

      <div>
        <label class="campo-lbl" for="pas-origem">Onde você está agora?</label>
