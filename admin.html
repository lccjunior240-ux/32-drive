<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b192c" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Drive — Painel Administrativo</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 70%, #0c1e38 100%);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --accent: #f59e0b;
      --green: #059669;
      --red: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 18px;
      line-height: 1.45;
    }
    header {
      background: var(--navy-header);
      border-bottom: 3px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 46px; height: 46px; border-radius: 11px; border: 2px solid var(--accent); background: #fff; }
    h1 { font-size: 20px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #dbeafe; }
    .badge {
      background: var(--accent);
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .aviso-topo {
      background: #fffbeb;
      border: 2px solid #f59e0b;
      color: #78350f;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
    }
    .card-title { font-size: 19px; font-weight: 900; color: #0f172a; }
    .kpis {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .kpi-box {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .kpi-lbl { font-size: 14px; font-weight: 700; color: var(--muted); }
    .kpi-num { font-size: 22px; font-weight: 900; color: #0f172a; margin-top: 2px; }
    label { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 4px; display: block; }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #94a3b8;
      background: #ffffff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-primary { background: #0b192c; color: #ffffff; }
    .btn-green { background: #10b981; color: #052e16; }
    .btn-red { background: #fee2e2; color: #991b1b; border: 2px solid #f87171; }
