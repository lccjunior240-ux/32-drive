<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>32 Drive — Mobilidade Urbana</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: #2e2e2e;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --accent: #f59e0b;
      --accent-dark: #d97706;
      --green: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: var(--accent);
      color: #111;
      font-weight: 800;
      font-size: 15px;
      padding: 6px 10px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 18px; font-weight: 700; }
    .subtitle { font-size: 12px; color: var(--muted); }
    main {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }
    #map {
      width: 100%;
      height: 250px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-title { font-size: 14px; font-weight: 600; color: var(--muted); }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #141414;
      color: var(--text);
      font-size: 15px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 10px; }
    button, .btn-link {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary { background: var(--accent); color: #111; }
    .btn-primary:active { background: var(--accent-dark); }
    .btn-secondary { background: #262626; color: var(--text); border: 1px solid var(--border); }
    .btn-pix { background: var(--green); color: #fff; }
    .status { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .pix-box {
      display: none;
      background: #141414;
      border: 1px dashed var(--accent);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="badge">32</span>
      <div>
        <h1>32 Drive</h1>
        <div class="subtitle">Rio Grande • Balneário do Cassino</div>
      </div>
    </div>
    <span class="subtitle" id="gpsStatus">Localizando...</span>
  </header>

  <main>
    <div id="map" aria-label="Mapa de localização"></div>

    <section class="card">
      <div class="card-title">Solicitar Corrida</div>
      <div>
        <label for="pickup">Ponto de embarque</label>
        <input id="pickup" type="text" placeholder="Ex.: Av. Rio Grande, Cassino" />
      </div>
      <div>
        <label for="destination">Destino</label>
        <input id="destination" type="text" placeholder="Ex.: Centro de Rio Grande" />
      </div>
      <div class="row">
        <button type="button" class="btn-secondary" id="locateBtn">Usar meu GPS</button>
        <a class="btn-primary" id="wazeBtn" href="https://waze.com/ul?q=Balneario%20do%20Cassino%20Rio%20Grande&navigate=yes" target="_blank" rel="noopener">Abrir Waze</a>
      </div>
      <div class="status" id="rideSummary">Preencha origem e destino para abrir a rota no Waze.</div>
    </section>

    <section class="card">
      <div class="card-title">Pagamento</div>
      <button type="button" class="btn-pix" id="pixBtn">Mostrar Chave Pix</button>
      <div class="pix-box" id="pixBox">
        Chave Pix (32 Drive): <strong id="pixKey">lccjunior240@gmail.com</strong>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    (function () {
      const defaultCoords = [-32.1819, -52.1649]; // Cassino / Rio Grande, RS
      const map = L.map("map").setView(defaultCoords, 13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);
      const marker = L.marker(defaultCoords).addTo(map).bindPopup("32 Drive").openPopup();

      const pickupInput = document.getElementById("pickup");
      const destInput = document.getElementById("destination");
      const wazeBtn = document.getElementById("wazeBtn");
      const summary = document.getElementById("rideSummary");
      const gpsStatus = document.getElementById("gpsStatus");

      function updateWaze() {
        const dest = destInput.value.trim();
        const pickup = pickupInput.value.trim();
        if (dest) {
          wazeBtn.href = "https://waze.com/ul?q=" + encodeURIComponent(dest + " Rio Grande RS") + "&navigate=yes";
          summary.textContent = (pickup ? "De: " + pickup + " → " : "") + "Para: " + dest;
        }
      }

      pickupInput.addEventListener("input", updateWaze);
      destInput.addEventListener("input", updateWaze);

      function setLocation() {
        if (!navigator.geolocation) {
          gpsStatus.textContent = "GPS indisponível";
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            map.setView([lat, lon], 15);
            marker.setLatLng([lat, lon]);
            if (!pickupInput.value) {
              pickupInput.value = lat.toFixed(5) + ", " + lon.toFixed(5);
            }
            gpsStatus.textContent = "GPS ativo";
            updateWaze();
          },
          function () {
            gpsStatus.textContent = "Cassino / RG";
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }

      document.getElementById("locateBtn").addEventListener("click", setLocation);
      document.getElementById("pixBtn").addEventListener("click", function () {
        const box = document.getElementById("pixBox");
        box.style.display = box.style.display === "block" ? "none" : "block";
      });

      setLocation();
    })();
  </script>
</body>
</html>
